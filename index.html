}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Bronchiolite", "d": {"id": "p2-bronchiolite", "titre": "Bronchiolite", "groupe": "Respiratoire", "bref": "Infection virale des voies respiratoires inférieures du **nourrisson de moins de 2 ans**, avec œdème et obstruction des bronches distales.", "signes": ["Début : toux, congestion, rhinorrhée, avec ou sans **fièvre**", "Toux **quinteuse**, auscultation « typique »", "Ensuite : **polypnée**, **cyanose** des lèvres et des ongles", "Geignement, battements des ailes du nez, tirage intercostal, respiration abdominale", "Sibilants diffus aux deux temps respiratoires", "Manque d'appétit, difficultés à s'alimenter, perte de poids", "Vomissements glaireux sur quinte de toux, selles glaireuses", "FR normale : < 1 mois **40 à 60/min** ; 1 mois à 2 ans **30 à 60/min**"], "alerte": ["**Cyanose**, détresse respiratoire, apnée : signaler tout de suite", "Signaler toute **saturation < 92 %** et toute **T° > 37,8 °C**", "⚠ Seuil d'O2 : débuter sous **92 %** et viser ≥ **92 %** au service S 51 ; valeur habituelle : saturation ≥ 93 %, ou O2 sous 92 % en air ambiant. À confirmer avec la prescription / le service", "⚠ Âge : « moins de 2 ans » au service S 51 ; « 2 ans ou moins » valeur habituelle (écart minime)", "⚠ Gouttes nasales (Nesivine) utilisées au service S 51 ; les vasoconstricteurs nasaux sont déconseillés chez l'enfant : seulement sur prescription, demander à l'infirmier(e) de référence"], "causes": ["Origine **virale** : **VRS** (cause principale, jusqu'à 2/3 des cas)", "Autres : métapneumovirus, parainfluenza 3, adénovirus, bocavirus, coronavirus, entérovirus, influenza, rougeole, rhinovirus", "Facteur favorisant : **crèche** ; facteur aggravant : **tabagisme passif**", "Chez le petit : calibre étroit, débris cellulaires et mucus obstruent facilement"], "complications": ["Aiguës : aspiration, insuffisance respiratoire, **apnée**, surinfection bactérienne, décès", "Tardives : wheezing récidivant, bronchiolite oblitérante"], "examens": ["Diagnostic **clinique** (histoire + signes)", "**Saturation** : aide à décider O2 et hospitalisation", "Radio du thorax en général non recommandée (images non spécifiques)", "Tests viraux rapides sur prélèvement nasopharyngé", "Diagnostic différentiel : coqueluche"], "traitement": ["**!! NEZ !!** : lavage au sérum physiologique, aspiration naso-pharyngée si besoin", "Gouttes nasales selon prescription (Nesivine, Néobacitracine)", "**O2** si sat < 92 % : lunettes nasales, **max 3 l/min**, humidifié (Aquapack®)", "Assistance ventilatoire si besoin", "Repas fractionnés (petites quantités, plus fréquentes)", "**SNG** si l'enfant ne s'alimente pas (gavage ou voie IV)", "Hydratation IV si trop encombré pour tolérer la SG", "Salbutamol en aérosol : essai possible si détresse sévère (bénéfice des aérosols incertain)", "Glucocorticoïdes et épinéphrine racémique : non recommandés", "**ATB** seulement si surinfection bactérienne", "Si T° > 38 °C : antipyrétique + hémoculture si nécessaire", "Kiné respiratoire en phase sécrétoire ou si atélectasie", "Prévention VRS : palivizumab, nirsevimab, vaccin maternel pendant la grossesse"], "stage": ["Surveillance continue de la **saturation**", "Recontrôler 30 min après la première prise de paramètres", "Fièvre : découvrir l'enfant (moyen non médicamenteux) ; recontrôle d'office 1 h après l'antipyrétique", "Position **proclive 30°**, anti-reflux", "**Isolement gouttelettes** (feuille rose) : masque, tablier, gants ; attention aux mains", "Fractionner les repas, hydrater", "Repos en phase aiguë", "Présenter les paramètres à ton IR, signaler tout paramètre anormal"], "retenir": ["Nourrisson < 2 ans, **VRS**, 2/3 des cas avant 6 mois", "**Nez d'abord** : lavage + aspiration", "O2 si sat < 92 %, lunettes max 3 l/min", "Isolement gouttelettes, repas fractionnés"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Bronchite et bronchite spastique", "d": {"id": "p2-bronchite-et-bronchite-spastique", "titre": "Bronchite et bronchite spastique", "groupe": "Respiratoire", "bref": "Atteinte bronchique avec toux ; la bronchite spastique = **sifflements (wheezing) récidivants** du jeune enfant de 0 à 4 ans, souvent viraux.", "signes": ["Toux, fièvre, dyspnée variables", "Râles ou **sibilances** à l'auscultation", "Sibilances récurrentes, surtout déclenchées par des **virus**", "Wheezing récidivant : au moins **3 épisodes** de plus de 24 h dans l'année"], "alerte": ["Si **3 bronchites « asthmatiformes »** : penser à l'**asthme**", "Un wheezing ne veut pas forcément dire asthme ; l'absence de signes n'exclut pas l'asthme", "Premier épisode sévère ou mauvaise réponse **avant 12 mois** : avis pneumologue (risque d'anomalie anatomique)", "Signaler toute **saturation < 92 %** à ton IR"], "causes": ["Origine souvent **virale** (rhinovirus, VRS) quel que soit le statut asthmatique", "Autres déclencheurs si profil asthmatique : effort, rire, pleurs, fumée de tabac"], "complications": ["Évolution vers l'**asthme** à rechercher"], "examens": ["Anamnèse, examen clinique, tests (même démarche que pour l'asthme)", "Résistances de 3 à 6 ans, bilan allergologique", "Scores de risque : mAPI (antécédents familiaux, eczéma, profil des sifflements, sensibilisation allergique) et PARS", "Profil atopique : sensibilisation aux aéroallergènes, éosinophilie ≥ 300/µL"], "traitement": ["Traitement symptomatique ; si asthme : voir « Asthme »", "**Crise** : bronchodilatateur courte durée (**SABA**), corticoïdes oraux selon gravité", "**Fond**, un choix parmi : corticoïde inhalé quotidien faible dose, corticoïde inhalé forte dose intermittent, **montélukast** (efficacité équivalente dans le profil non atopique)", "**Hospitalisation** : premier épisode sévère (soins intensifs ou nébulisation continue), hypoxémie ou détresse non améliorée, hospitalisations multiples", "O2 si besoin : objectif sat ≥ 92 %, lunettes nasales max 3 l/min, humidifiées (Aquapack®)"], "stage": ["Surveiller la saturation, signaler < 92 %", "O2 : lunettes nasales max 3 l/min (irritant pour les muqueuses), Aquapack®", "Observer le profil des épisodes (récidives, déclencheurs)"], "retenir": ["Wheezing récidivant 0-4 ans, souvent viral", "3 épisodes : penser asthme", "Crise : SABA ; sat cible ≥ 92 %"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Bronchopneumonie et pneumonie", "d": {"id": "p2-bronchopneumonie-et-pneumonie", "titre": "Bronchopneumonie et pneumonie", "groupe": "Respiratoire", "bref": "Atteinte **infectieuse et inflammatoire** des poumons (bronchioles et alvéoles), avec liquide dans le parenchyme ; due à une bactérie, un virus ou un mycoplasme.", "signes": ["Forme bactérienne : début **brutal**, altération de l'état général, frissons", "**Fièvre 39-40 °C**, toux, dyspnée", "Respiration saccadée", "**Crépitants localisés** (attention chez le nourrisson), systématisation lobaire, parfois épanchement", "Douleur thoracique ou abdominale (le jeune enfant peut avoir mal au ventre)", "Plaintes peu spécifiques : toux, fièvre, tachypnée, difficulté respiratoire", "Nouveau-né : geignement, apnée, intolérance alimentaire", "FR normale : < 1 mois 40-60/min ; 1 mois-2 ans 30-60/min ; 2-12 ans 20-30/min"], "alerte": ["Détresse : tachypnée, battements des ailes du nez, tirage, **hypoxie**", "Aucun signe isolé de l'examen ne permet de poser le diagnostic", "Signaler **sat < 92 %** et **T° > 37,8 °C**", "**Hospitalisation** : nourrissons < 90 jours, immunodéprimés, maladie chronique (drépanocytose, mucoviscidose), échec du traitement ambulatoire, **sat < 90 %**", "Doses d'ATB : suivre la prescription"], "causes": ["Virus, bactéries, mycoplasme, Chlamydia pneumoniae, parfois champignons", "Nouveau-né : streptocoque B, Klebsiella, E. coli, Listeria", "30 jours-2 ans : surtout virale", "2-5 ans : virus, puis pneumocoque et Haemophilus influenzae", "5-13 ans : Mycoplasma pneumoniae, pneumocoque le plus fréquent", "1re cause de maladie et de décès < 5 ans dans le monde"], "complications": ["Parfois **épanchement pleural**"], "examens": ["Biologie : syndrome inflammatoire, hyperleucocytose à neutrophiles", "Marqueurs inflammatoires : ne distinguent pas virale et bactérienne", "Prélèvement nasopharyngé (grippe, VRS, métapneumovirus)", "Hémocultures et bilan si forme sévère", "Radio réservée à : aspect toxique, maladie prolongée malgré traitement, nourrisson 0-3 mois fébrile, suspicion de corps étranger, < 5 ans fébrile avec hyperleucocytose sans foyer"], "traitement": ["**Antibiotiques** IV, parfois per os (exemple : enfant de 12 mois, Augmentin IV 350 mg × 4/jour)", "Nouveau-né : ampicilline + aminoside ou céphalosporine 3e génération", "> 3 mois : amoxicilline forte dose ou autre bêtalactamine (pneumocoque)", "> 5 ans : macrolide en général en 1re intention", "Correspondances : Augmentin® = Amoxiclav ; Clamoxyl® = Amoxicilline ; Amukin® = Amikacine ; Claforan® = Cefotaxime", "O2 si hypoxie : sat ≥ 92 %, lunettes max 3 l/min, Aquapack®", "Hydratation ; antipyrétique (Dafalgan®/paracétamol, Nurofen®/ibuprofène : connaître la dose/poids)", "Bronchodilatateurs", "Antitussifs : non recommandés", "Douleur : EVENDOL 0 à 4-6 ans ; EVA ou échelle numérique en auto-évaluation"], "stage": ["Paramètres : signaler sat < 92 % et T° > 37,8 °C", "Recontrôle 30 min après la 1re prise", "Si T° > 38 °C : antipyrétique + hémoculture si nécessaire, recontrôle d'office 1 h plus tard ; découvrir l'enfant", "Position **proclive**", "**Isolement gouttelettes** (feuille rose) : masque, tablier, gants", "Évaluer la douleur, **réévaluer 30 min après analgésie**", "Hydratation, observer la détresse et ausculter"], "retenir": ["Début brutal, fièvre 39-40 °C, crépitants localisés", "Germe selon l'âge (nouveau-né, < 5 ans viral, 5-13 ans mycoplasme)", "ATB IV + O2 si hypoxie + proclive", "Isolement gouttelettes"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Laryngite (spasmodique aiguë et croup)", "d": {"id": "p2-laryngite-laryngite-spasmodique-aigu-et-croup", "titre": "Laryngite (spasmodique aiguë et croup)", "groupe": "Respiratoire", "bref": "Maladie **virale** avec inflammation du larynx et des cordes vocales, donnant une **toux aboyante** et un **stridor inspiratoire**.", "signes": ["**Toux aboyante**, **stridor inspiratoire**, dyspnée inspiratoire", "Voix enrouée / rauque, rhinite", "Dyspnée obstructive haute : stridor, tirage sus-sternal, voix rauque", "Laryngite spasmodique : prodromes minimes et brefs, début **brutal nocturne**, résolution rapide, bon état général, **pas de fièvre**", "Croup : fièvre souvent légère (non nécessaire au diagnostic), pic des symptômes entre **24 et 48 h**", "FR normale 2-12 ans : 20 à 30/min"], "alerte": ["L'**épiglottite** fait partie des causes de dyspnée obstructive haute", "**Score de Westley** : léger ≤ 2 ; modéré 3-7 ; sévère 8-11 ; insuffisance respiratoire imminente ≥ 12", "⚠ Corticoïde : aérosols de Pulmicort / Solumédrol au service S 51 ; valeur habituelle : dexaméthasone et adrénaline nébulisée. À confirmer avec la prescription", "Humidification proposée, mais une méta-analyse ne montre pas d'effet sur le croup modéré"], "causes": ["Virus **parainfluenza** 1 à 3 (~75 %, type 1 le plus fréquent)", "Aussi influenza, adénovirus, VRS, rhinovirus, entérovirus", "Œdème des voies aériennes supérieures sous la glotte"], "complications": ["Mortalité < 0,5 %, même chez les enfants intubés"], "examens": ["Diagnostic **clinique** (toux aboyante nocturne brutale, bon état général)", "Imagerie et biologie rarement nécessaires", "« Signe du clocher » à la radio : ni sensible ni spécifique"], "traitement": ["**Corticoïdes** : aérosols de Pulmicort et Solumédrol (traitement principal au service S 51)", "Dexaméthasone **0,6 mg/kg** dose unique PO, IM ou IV, toute gravité (à confirmer avec la prescription)", "**Adrénaline** (épinéphrine racémique) nébulisée si forme modérée à sévère : 0,05 mL/kg de solution à 2,25 % (à confirmer avec la prescription)", "Humidification", "Douleur : EVENDOL 0 à 4-6 ans ; EVA ou échelle numérique ; réévaluer 30 min après analgésie"], "stage": ["Surveiller la respiration (stridor, tirage, FR)", "Évaluer la douleur et la réévaluer 30 min après analgésie", "Appliquer la prescription et le protocole du service"], "retenir": ["Toux aboyante + stridor inspiratoire", "Spasmodique : 3 mois-3 ans, nocturne, sans fièvre ; croup : 6 mois-3 ans, parfois jusqu'à 6 ans", "Corticoïde = traitement principal", "Westley pour la gravité"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Asthme", "d": {"id": "p2-asthme", "titre": "Asthme", "groupe": "Respiratoire", "bref": "Maladie **inflammatoire chronique** des voies aériennes avec crises : dyspnée, oppression, sifflements, toux ; obstruction variable et hyperréactivité bronchique.", "signes": ["Toux, **sifflements**, oppression thoracique, essoufflement, souvent épisodiques, pires la **nuit** ou après un déclencheur", "Tableaux : crise, bronchites spastiques à répétition, toux chronique, toux nocturne, symptômes à l'effort", "Détresse à évaluer : tirage sus-sternal/intercostal/sous-costal, battements des ailes du nez, wheezing (sifflement expiratoire), grunting, coloration péri-buccale, stridor (bruit inspiratoire)", "Conscience : normale (légère) ; anxiété ; agitation ; altérée (sévère)", "Dyspnée : éloquence normale (légère) ; phrases (modérée) ; mots (sévère)", "Saturation : > 95 % (légère) ; 90-95 % (modérée) ; < 90 % (sévère)"], "alerte": ["**Exacerbation grave** : tachycardie > 120/min (grand) ou > 160/min (petit), tachypnée, ne parle plus en longues phrases, muscles accessoires", "**Signes de danger** : agitation ou baisse de conscience, épuisement, **cyanose**, entrée d'air quasi nulle (bradypnée et bradycardie en « danger »)", "L'absence de signes n'exclut pas l'asthme ; un wheezing n'est pas forcément un asthme", "⚠ Seuil d'O2 : < 92 % au service S 51 ; valeur habituelle : < 92-93 % ou 90-92 %. À confirmer avec la prescription / l'équipe", "⚠ Âge de la spirométrie : 6 ans ou 5 ans. À confirmer avec le service", "⚠ Doses de crise : deux séries de valeurs (voir traitement). À confirmer avec la prescription", "Nesivine : confirmer la prescription avec l'équipe"], "causes": ["Facteurs déclenchants : infections virales, allergènes, exercice, irritants, médicaments, air froid, facteurs émotionnels", "Animaux, poussière, moisissures, fumée de tabac, aérosols", "Origine multifactorielle (génétique + environnement) ; antécédents familiaux augmentent le risque", "3 mécanismes : œdème de l'épithélium bronchique, bronchospasme, hyperactivité bronchique"], "complications": ["Asthme non contrôlé et exacerbations : insuffisance respiratoire, décès"], "examens": ["Anamnèse, examen clinique, tests", "Spirométrie après 6 ans (ou 5 ans) ; résistances de 3 à 6 ans", "Réversibilité significative : VEMS +12 % ou +200 mL après bronchodilatateur", "Bilan allergologique", "Score de Wood modifié"], "traitement": ["**Crise** : « bronchodilater, et vite ! », sans négliger l'inflammation", "Salbutamol (Ventolin, Airomir), Atrovent, Combivent (nébulisation), Duovent", "Doses : salbutamol nébulisé 2,5-5 mg, répétable toutes les 20 min ; ipratropium 250-500 µg × 3 doses (crise modérée à sévère)", "Corticoïdes systémiques **1-2 mg/kg/jour** PO ou IV (prednisolone ou méthylprednisolone), sans dégression si < 5 jours ; ou dexaméthasone 0,6 mg/kg", "Soins intensifs : nébulisation continue de bêta-2, adrénaline, salbutamol IV, ventilation assistée", "**O2** si sat < 92 % ; objectif ≥ 92 % ; lunettes nasales max 3 l/min, Aquapack®", "**Fond** si contrôle insuffisant (bronchodilatateur > 2 fois/sem, symptômes diurnes, nocturnes ou à l'effort, attaque sévère récente)", "Corticoïdes inhalés : béclométasone (Qvar), budésonide (Pulmicort), fluticasone (Flixotide)", "Effets locaux : dysphagie, candidose buccale, dysphonie ; prévention : chambre + rinçage de bouche", "Autres : bêta-agonistes longue durée, associations fixes (Seretide, Symbicort, Relvar, Inuvair), antagonistes des leucotriènes", "Inhalation : < 3 ans chambre + masque ; 3-6 ans chambre + embout ; > 6 ans chambre + embout, poudre sèche ou aérosol-doseur", "Puffs avec chambre Optichamber", "Nébuliseur seulement si rien d'autre (dépôt 2-10 % ; chambre 20-40 % ; poudre 10-32 %)", "Plan d'action écrit avec l'enfant et la famille"], "stage": ["Électrodes + câble de saturation", "Paramètres : saturation, FR, pulsations", "Évaluer les signes de détresse", "Lavage de nez au sérum physiologique ; gouttes nasales selon prescription (Nesivine, Néobacitracine)", "Position **proclive 30°**", "**Isolement gouttelettes** (feuille rose) : masque, tablier, gants", "Kiné respiratoire parfois après la phase aiguë", "Après la phase aiguë : reprise du traitement de fond par puffs", "Éducation : chambre d'inhalation, rinçage de bouche, plan d'action"], "retenir": ["Crise : bronchodilater vite (salbutamol), puis corticoïdes", "Signes de danger : cyanose, épuisement, entrée d'air quasi nulle", "Corticoïdes inhalés : chambre + rinçage de bouche", "O2 si sat < 92 %, max 3 l/min"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Mucoviscidose", "d": {"id": "p2-mucoviscidose", "titre": "Mucoviscidose", "groupe": "Respiratoire", "bref": "Maladie **génétique héréditaire** (autosomique récessive, gène CFTR) : mucus épais et collant, atteinte respiratoire, digestive et génitale.", "signes": ["Respiratoire : toux chronique, expectorations matinales, exacerbations « faciles »", "Sinusite chronique, polypose nasale, atélectasies, bronchectasies", "Infections à répétition (Haemophilus, MSSA, MRSA, **Pseudomonas aeruginosa**, Cepacia, Candida)", "Exacerbation : toux persistante, dyspnée, expectorations plus abondantes, EFR perturbées", "Digestif (85 %) : insuffisance pancréatique exocrine, **selles grasses** volumineuses malodorantes, stagnation pondérale, douleurs abdominales", "Intestin : diarrhée, constipation, occlusion, prolapsus rectal ; RGO", "**Iléus méconial** chez 15-20 % des nouveau-nés atteints", "Pancréas : diabète, pancréatite ; foie : fibrose, cirrhose, ascite, lithiase biliaire", "Déficit en vitamines liposolubles (ADEK), anomalies électrolytiques", "Sueur salée, hippocratisme digital, ostéoporose précoce"], "alerte": ["Insuffisance respiratoire et **cœur pulmonaire**", "Un dépistage néonatal normal n'exclut pas la maladie", "Certains antibiotiques sont **toxiques** : dosages nécessaires ; hyperhydrater", "⚠ Incidence : 1/2 500 ou ~1/3 500 naissances ; mutations : plus de 1 500 ou plus de 2 000. Valeurs à confirmer avec le service", "Marques, chiffres et objectifs nutritionnels : suivre les protocoles du service"], "causes": ["Deux mutations du gène **CFTR** (canal chlorure) : sécrétions anormales", "Plus de 1 500 mutations (ou > 2 000) ; F508del : 70-90 % des cas aux États-Unis", "Portage : 1 personne sur 25 ; maladie : 1 naissance sur 2 500 (ou ~1/3 500)", "Mauvaise clairance mucociliaire : forte infection ; atteinte respiratoire = facteur n°1 de pronostic"], "complications": ["Insuffisance respiratoire, cœur pulmonaire", "Diabète lié à la mucoviscidose (~10 % des adolescents)", "Atteinte hépatobiliaire, syndrome d'obstruction intestinale distale", "Ostéoporose (malabsorption calcium/vitamine D, corticoïdes, inflammation)", "Dépression (19 %) et anxiété (32 %)", "Survie médiane prédite ~57 ans (nés 2018-2022, États-Unis)"], "examens": ["**Test de la sueur** (référence) : ≤ 29 mmol/L peu probable ; 30-59 tests complémentaires ; ≥ 60 diagnostic posé", "Diagnostic confirmé : test de la sueur pathologique (2 fois) ou 2 mutations", "Recherche de mutations", "Dépistage néonatal : trypsine immuno-réactive (IRT) + ADN ou 2e dosage", "EFR (perturbées en exacerbation)", "Classifications : mucoviscidose, CFTR-RD, CRMS/CFSPID"], "traitement": ["Kinésithérapie respiratoire, mucolytiques, lavage nasal (Lotta®)", "Aérosols : antibiotique, bronchodilatateur, corticoïde, mucolytique", "Dornase alfa, sérum salé hypertonique, percussions", "ATB IV : Glazidim, Obracin, Meronem… ; inhalés : tobramycine, aztréonam, amikacine ; azithromycine au long cours si Pseudomonas", "Antifongique", "Modulateurs CFTR : Kalydeco, Orkambi, Symdeko, Trikafta", "Enzymes pancréatiques : **Créon® 10 000 à 25 000 UI**", "Vitamines ADEK, antireflux, laxatif", "Nutrition hypercalorique et hypergraisseuse (poids/taille ou IMC ≥ 50e percentile)", "Prévention : nutrition, lutte contre le tabagisme, vaccinations, activité sportive, suivi"], "stage": ["**Isolement gouttelettes** (feuille rose) : masque, tablier, gants", "Prévenir les **infections croisées** : 2 enfants atteints non apparentés ne se côtoient pas (≥ 6 pieds, ~1,8 m)", "Kiné respiratoire, aérosols, lavage nasal", "Hyperhydratation PO/IV sous antibiotiques", "Surveiller les dosages des antibiotiques toxiques", "Alimentation hypercalorique, enzymes avec les repas"], "retenir": ["CFTR, autosomique récessive, mucus épais", "Poumons = pronostic ; digestif : selles grasses, enzymes (Créon)", "Test de la sueur ≥ 60 : diagnostic", "Isolement + éviter les infections croisées"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Tuberculose", "d": {"id": "p2-tuberculose", "titre": "Tuberculose", "groupe": "Respiratoire", "bref": "Maladie infectieuse **très contagieuse** due au bacille de Koch (Mycobacterium tuberculosis), transmise par gouttelettes en suspension dans l'air.", "signes": ["90 % des grands enfants nouvellement infectés : **asymptomatiques**", "Jusqu'à 50 % des nourrissons infectés : symptômes respiratoires ou généraux + anomalies radiologiques", "Adolescent : réactivation (fatigue, perte de poids, sueurs nocturnes, cavernes)", "Toux, fièvre, mauvais appétit, perte de poids, fatigue > **2 semaines**", "Extrapulmonaire : ganglionnaire (60 %), **méningée** (la plus grave), osseuse (mal de Pott, dactylite), abdominale, génito-urinaire, miliaire (< 1 %)"], "alerte": ["Isolement **aérien** (feuille blanche), FFP2", "Xpert MTB/RIF négatif n'exclut pas la tuberculose de l'enfant", "Méningite tuberculeuse : > 50 % des survivants ont des séquelles neurodéveloppementales", "⚠ Intradermo : confirme le diagnostic au service S 51 ; mais jusqu'à 40 % des enfants avec tuberculose prouvée n'avaient pas réagi au test", "⚠ Durée du traitement de la méningite : 12 mois ou 6 mois en alternative ; schéma court de 4 mois pour certaines formes. À confirmer avec la prescription", "⚠ Doses (isoniazide, rifampicine, pyrazinamide) : à confirmer avec la prescription"], "causes": ["Contact avec un cas contagieux (surtout pulmonaire à frottis ou culture positifs)", "Âge < 5 ans ; réponse immunitaire altérée chez le nourrisson", "Infection ≠ maladie : risque de maladie sans traitement 40-50 % nourrisson, 25 % trottineur, 10-15 % enfant d'âge scolaire", "En 2023 : 1,3 million de cas < 15 ans, ~250 000 décès"], "complications": ["Retard de diagnostic : hydrocéphalie, atteinte cérébro-vasculaire, mal de Pott avec paraplégie, occlusion intestinale, insuffisance rénale, dissémination miliaire", "Méningite tuberculeuse : séquelles neurodéveloppementales"], "examens": ["Contexte de contact, clinique, test cutané à la tuberculine (intradermo) ou IGRA, radio, microbiologie", "Radio : opacité persistante + adénopathies hilaires ou sous-carénaires", "< 5 ans : aspiration ou lavage gastrique ; au service S 51 : **3 tubages gastriques**", "Culture : 3 à 8 semaines", "Xpert MTB/RIF : résultat en < 2 h"], "traitement": ["Forme sensible : **2HRZE/4HR** (2 mois isoniazide + rifampicine + pyrazinamide + éthambutol, puis 4 mois isoniazide + rifampicine)", "Schéma de 4 mois (2HRZ(E)/2HR) : formes non sévères de 3 mois à 16 ans", "Méningite : 4 médicaments, 12 mois (ou 6 mois en alternative)", "Doses : isoniazide 10-15 mg/kg, rifampicine 15-20 mg/kg, pyrazinamide 30-40 mg/kg", "Traitement sous **observation directe**", "**BCG** : ~90 % de protection contre formes disséminées sévères la 1re année, pas contre la forme pulmonaire, contre-indiqué si immunodépression", "< 5 ans exposé : évaluation et traitement préventif"], "stage": ["Prise des paramètres", "**Isolement aérien** (feuille blanche) : masque **FFP2**, tablier, gants", "Affiche sur la porte de la chambre + chariot avec le matériel", "Préparer/assister : 3 tubages gastriques, intradermo"], "retenir": ["Isolement aérien, FFP2", "Souvent asymptomatique chez l'enfant ; < 5 ans à risque", "2HRZE puis 4HR", "Méningite = forme la plus grave"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Épanchement pleural (parapneumonique et empyème)", "d": {"id": "p2-panchement-pleural-parapneumonique-et-empyme", "titre": "Épanchement pleural (parapneumonique et empyème)", "groupe": "Respiratoire", "bref": "Épanchement pleural **exsudatif** associé à une infection pulmonaire du même côté, le plus souvent une pneumonie.", "signes": ["Toux, fièvre, **douleur pleurale**, dyspnée, tachypnée, tachycardie", "**Matité** à la percussion, murmure vésiculaire diminué ou absent", "Dans la bronchopneumonie : douleur thoracique ou abdominale chez le jeune enfant"], "alerte": ["Classification : non compliqué (cultures négatives, glucose > 60 mg/dL, pH > 7,20) ; compliqué (pH < 7,20 ou glucose bas) ; **empyème** (pus franc, Gram ou culture positifs)", "Signaler **sat < 92 %** et **T° > 37,8 °C**"], "causes": ["Streptococcus pneumoniae et Staphylococcus aureus : ~70 % des cultures aérobies", "S. aureus après chirurgie", "Stades : exsudatif (2-5 j), fibropurulent (5-10 j), organisation (2-3 sem, « peau » pleurale)"], "complications": ["Épaississement pleural résiduel, fibrose, fistule broncho-pleurale", "La plupart des patients guérissent ; mortalité 10 %, surtout chez l'adulte"], "examens": ["Radio de face et **échographie** (liquide libre ou cloisonné ; guide ponction/drainage)", "Scanner non systématique chez l'enfant", "Hémocultures", rétions → purulence", "**Bactéries** : pneumocoque, Haemophilus influenzae non typable, Moraxella catarrhalis", "**Virus** : VRS, coronavirus, influenza, adénovirus, métapneumovirus, picornavirus", "Facteurs de risque : crèche, tabagisme passif, allergies, immunodépression, anomalies cranio-faciales, peu ou pas d'allaitement, antécédents familiaux d'OMA récidivante"], "complications": ["**Mastoïdite**", "Intratemporales : surdité, perforation, otite chronique suppurée, cholestéatome, pétrosite, labyrinthite, paralysie faciale", "Intracrâniennes : méningite, empyème sous-dural, abcès cérébral, abcès extradural, thrombose du sinus latéral"], "examens": ["Otoscopie pneumatique : mobilité du tympan, épanchement", "OMA = bombement modéré à sévère du tympan, ou otorrhée nouvelle (hors otite externe)", "Bombement léger suffit si otalgie récente ou érythème", "Pas de biologie en routine", "Imagerie seulement si complication suspectée"], "traitement": ["**Antibiotique** si : enfant **< 6 mois**, pas d'amélioration sous anti-inflammatoire après **48-72 h**, otorrhée", "OMA suppurée : **amoxicilline** (Clamoxyl®) forte dose **10 jours** si pas d'allergie à la pénicilline", "Surveillance attentive (« watchful waiting ») dans la plupart des pays européens", "Antalgie : AINS, paracétamol, parfois lidocaïne topique 1 %", "Paracétamol (Dafalgan®), ibuprofène (Nurofen®) : connaître la dose par kg", "Drains transtympaniques : après 3 épisodes en 6 mois ou ≥ 4 en 12 mois", "À vérifier avec la prescription / le service"], "stage": ["Douleur : échelle adaptée à l'âge (EVENDOL 0 à 4-6 ans ; EVA ou échelle numérique) ; réévaluer 30 min après analgésie", "Fièvre au service S 51 : signaler toute T° **> 37,8 °C** ; antipyrétique si **> 38 °C** ; recontrôle 30 min après la 1re prise", "Fièvre : découvrir l'enfant (moyen non médicamenteux)"], "retenir": ["OMA = otalgie + tympan bombé ± otorrhée", "Pas d'antibiotique systématique : < 6 mois, 48-72 h sans amélioration, otorrhée", "Complication majeure : mastoïdite"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : ORL et bouche", "title": "Mastoïdite", "d": {"id": "p2-mastodite", "titre": "Mastoïdite", "groupe": "ORL et bouche", "bref": "Infection bactérienne des cellules aériennes de la mastoïde, en continuité avec l'oreille moyenne.", "signes": ["**Rougeur, douleur, tuméfaction rétro-auriculaires**", "**Pavillon de l'oreille décollé**", "Chaleur et sensibilité rétro-auriculaires, parfois fluctuation", "Enfant : irritabilité, léthargie, fièvre, tiraillement de l'oreille"], "alerte": ["Complications intracrâniennes dans **6 à 23 %** des cas"], "causes": ["Complication d'une **otite moyenne aiguë** (progression vers les cellules mastoïdiennes, érosion possible des cloisons osseuses)", "**Pneumocoque** : le plus fréquent", "Aussi streptocoque bêta-hémolytique du groupe A, staphylocoque doré, Haemophilus influenzae"], "complications": ["Extracrâniennes : abcès sous-périosté, paralysie faciale, labyrinthite, pétrosite", "Intracrâniennes (6 à 23 %) : abcès temporal ou cérébelleux, abcès épidural ou sous-dural, thrombose de sinus veineux"], "examens": ["**Scanner** : étendue de l'infection (épaississement muqueux, perte des cloisons osseuses, destruction corticale)", "Biologie : NFS (leucocytes élevés, déviation gauche), VS, CRP", "Diagnostic clinique, confirmé par biologie et imagerie"], "traitement": ["**Antibiothérapie IV**", "Vancomycine IV en 1re ligne", "Paracentèse", "Myringotomie avec drain transtympanique", "**Mastoïdectomie** si pas d'amélioration en **48 h**"], "stage": ["Douleur : échelle adaptée à l'âge (EVENDOL 0 à 4-6 ans ; EVA ou échelle numérique) ; réévaluer 30 min après analgésie", "Fièvre au service S 51 : signaler toute T° **> 37,8 °C** ; antipyrétique si **> 38 °C** ; recontrôle 30 min après la 1re prise"], "retenir": ["Oreille décollée + tuméfaction rétro-auriculaire = mastoïdite", "Complication de l'otite : antibiotiques IV", "Scanner pour l'étendue ; chirurgie si pas d'amélioration en 48 h"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : ORL et bouche", "title": "Amygdalite (angine)", "d": {"id": "p2-amygdalite-angine", "titre": "Amygdalite (angine)", "groupe": "ORL et bouche", "bref": "Infection du pharynx et des amygdales, virale (EBV courant) ou bactérienne (streptocoque du groupe A).", "signes": ["**Odynophagie** (mal de gorge douloureux)", "**Fièvre** d'apparition brutale", "Adénopathies cervicales sensibles", "Exsudat amygdalien, inflammation pharyngée, pétéchies palatines, œdème de la luette", "Halitose, voix étouffée", "Contact récent avec des malades"], "alerte": ["Complications rares : rhumatisme articulaire aigu, glomérulonéphrite, abcès", "⚠ Dose d'amoxicilline : à confirmer avec la prescription"], "causes": ["**Virale** (courante : EBV) ou **bactérienne**", "Streptocoque du groupe A (Streptococcus pyogenes) : coccus Gram positif en chaînettes"], "complications": ["Non suppurées (rares) : **rhumatisme articulaire aigu** (critères de Jones : arthralgie, cardite, nodules, érythème marginé, chorée), **glomérulonéphrite** post-streptococcique", "Suppurées (≈ 1 %) : abcès, otite moyenne, sinusite, fasciite nécrosante, méningite, thrombophlébite"], "examens": ["**Frottis de gorge** : test rapide + culture (streptocoque A ?)", "Score de Centor : 1 point par exsudat amygdalien, adénopathies sensibles, absence de toux, fièvre > 38 °C", "Centor : risque faible 0-1 ; intermédiaire 2-3 ; élevé 4", "Score de McIsaac (adapté à l'âge)", "Test rapide si risque intermédiaire ou élevé", "Culture de gorge si test rapide négatif chez l'enfant"], "traitement": ["Si streptocoque A positif : **amoxicilline** (Clamoxyl®)", "1re ligne : amoxicilline ou pénicilline V **10 jours**", "Enfant : **50 mg/kg/jour** PO, max **1 000 mg** (à confirmer avec la prescription)", "Allergie : céphalexine, azithromycine, clarithromycine ou clindamycine (Dalacin®)", "Paracétamol (Dafalgan®) ou AINS (Nurofen®) : connaître la dose par kg", "Retour à l'école possible après **24 h** d'antibiotiques"], "stage": ["Douleur : échelle adaptée à l'âge (EVENDOL 0 à 4-6 ans ; EVA ou échelle numérique) ; réévaluer 30 min après analgésie", "Fièvre au service S 51 : signaler toute T° **> 37,8 °C** ; antipyrétique si **> 38 °C** ; recontrôle 30 min après la 1re prise"], "retenir": ["Angine = virale ou bactérienne : frottis de gorge (test rapide + culture)", "Streptocoque A positif : amoxicilline 10 jours", "Complications rares mais graves : RAA, glomérulonéphrite"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : ORL et bouche", "title": "Sinusite et ethmoïdite", "d": {"id": "p2-sinusite-et-ethmodite", "titre": "Sinusite et ethmoïdite", "groupe": "ORL et bouche", "bref": "Inflammation de la cavité nasale et des sinus de la face (aiguë si < 4 semaines) ; l'ethmoïdite est à reconnaître.", "signes": ["Écoulement nasal **purulent** + obstruction nasale", "Douleur, pression ou plénitude faciale", "Toux, fatigue, perte de l'odorat", "Fièvre plus fréquente chez l'enfant", "Âge : sinusite **maxillaire** pas avant **3 ans** ; **frontale** pas avant **10 ans**"], "alerte": ["Complications **orbitaires** (cellulite orbitaire, abcès sous-périosté, thrombose du sinus caverneux) et **encéphalo-méningées**", "Ethmoïdite : source la plus fréquente de cellulite périorbitaire", "Sinusite bactérienne probable : > 10 jours, ou fièvre > 39 °C + écoulement purulent 3-4 jours, ou double aggravation"], "causes": ["Virale ou bactérienne, le plus souvent **virale** : rhinovirus, influenza, parainfluenza, adénovirus, coronavirus, VRS", "**Bactéries** : pneumocoque, Haemophilus influenzae, Moraxella catarrhalis", "Mécanisme : obstruction du drainage (œdème), altération du transport mucociliaire, altération du mucus"], "complications": ["Orbitaires, encéphalo-méningées, évolution subaiguë ou chronique", "≈ 1 cas sur 1 000 ; ≈ 80 % des complications orbito-crâniennes sont orbitaires", "Intracrâniennes : méningite, empyème sous-dural"], "examens": ["Cellulite orbitaire : **IRM ou scanner**"], "traitement": ["Anti-inflammatoire et antibiotique", "Surtout virale : soins de soutien (humidification, hydratation, lavage nasal au sérum salé, corticoïde nasal)", "Antibiotique : amoxicilline en 1re ligne chez l'adulte, **5 à 10 jours**", "Bénéfice limité par rapport à la surveillance dans les essais", "**À éviter** : antihistaminiques, corticoïdes systémiques sans preuve", "Chirurgie : échecs, évolution rapide, complications menaçant la vue ou le système nerveux"], "stage": ["Lavage de nez au sérum physiologique (soin de confort)", "Douleur : échelle adaptée à l'âge (EVENDOL 0 à 4-6 ans ; EVA ou échelle numérique) ; réévaluer 30 min après analgésie", "Fièvre au service S 51 : signaler toute T° **> 37,8 °C** ; antipyrétique si **> 38 °C** ; recontrôle 30 min après la 1re prise"], "retenir": ["Sinusite = surtout virale ; antibiotique si critères de sinusite bactérienne", "Ethmoïdite : penser aux complications orbitaires", "Signes orbitaires ou neurologiques = alerter"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : ORL et bouche", "title": "Rhinite", "d": {"id": "p2-rhinite", "titre": "Rhinite", "groupe": "ORL et bouche", "bref": "Inflammation de la muqueuse nasale : allergique (atopique) ou infectieuse (rhume).", "signes": ["**Allergique** : congestion nasale, éternuements, rhinorrhée claire, prurit nasal et oculaire, larmoiement", "**Rhume** : mal de gorge souvent en 1er, puis 1-2 jours après rhinorrhée et éternuements", "Rhume : symptômes **7 à 10 jours**, toux parfois plusieurs semaines", "Rhume : fièvre éventuelle, en général modérée", "Nourrisson < 3 mois : rhinite = cause de dyspnée obstructive (nez)", "Rhinite aussi signe de la **bronchiolite** et de la **laryngite**"], "alerte": ["Rhinite du nourrisson < 3 mois : gêne respiratoire", "Fièvre > 37,8 °C : signaler immédiatement", "Médicaments du rhume en vente libre : **pas avant 4 ans**", "**Miel** contre-indiqué avant **1 an**"], "causes": ["Allergène : acariens, pollens", "Allergie : antécédents familiaux d'atopie, sexe masculin, IgE spécifiques, tabagisme passif, introduction précoce d'aliments", "Allergie : IgE, histamine (5 à 15 min), phase tardive 4 à 6 h", "Forme saisonnière ≈ 20 %, pérenne 40 %, mixte 40 %", "Rhume : **rhinovirus** 50 à 80 % ; aussi coronavirus, adénovirus, parainfluenza, influenza, VRS, entérovirus, métapneumovirus, bocavirus"], "complications": ["Allergie : rhinosinusite chronique, polypes nasaux, hypertrophie des végétations", "10 à 40 % des patients allergiques ont aussi un asthme", "Rhume : infections respiratoires basses, otite moyenne, mastoïdite, sinusite, pneumonie, exacerbation d'asthme"], "examens": ["Diagnostic clinique (histoire et examen)", "Rhume : pas de test nécessaire dans la grande majorité des cas", "Allergie : bilan allergologique, IgE spécifiques sériques ou tests cutanés"], "traitement": ["**Allergique** : éviction (acariens, pollens), antihistaminiques, corticoïdes locaux", "Corticoïdes intranasaux en 1re ligne, antihistaminiques, montélukast, immunothérapie", "**Rhume** : traitement de soutien (antalgiques, sérum salé nasal, humidificateur à brume fraîche)", "Antibiotiques sans bénéfice dans le rhume", "Antalgiques : Dafalgan®/paracétamol, Nurofen®/ibuprofène : dose par kg", "Gouttes nasales selon prescription (Nesivine, Néobacitracine)"], "stage": ["Désobstruction nasale : sérum physiologique, mouchage dès **2 ans**", "Lavage de nez au sérum physiologique ; aspiration naso-pharyngée si nécessaire", "Soins du nez pour le confort, lors du tour de salle", "Fièvre : signaler immédiatement T° **> 37,8 °C** ; recontrôle 30 min après la 1re prise ; découvrir l'enfant", "Si T° **> 38 °C** : antipyrétique, hémoculture si nécessaire, recontrôle d'office 1 h plus tard"], "retenir": ["Rhinite allergique (atopique) ou infectieuse (rhume)", "Rhume : soutien et lavage de nez, pas d'antibiotique", "Rhinite aussi présente dans bronchiolite et laryngite"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : ORL et bouche", "title": "Conjonctivite", "d": {"id": "p2-conjonctivite", "titre": "Conjonctivite", "groupe": "ORL et bouche", "bref": "Inflammation ou infection de la conjonctive (virale, bactérienne, allergique ou toxique).", "signes": ["**Virale** : prurit, larmoiement, infection respiratoire récente, follicules, adénopathie prétragienne douloureuse", "**Bactérienne** : rougeur, sensation de corps étranger, yeux collés le matin, sécrétions blanc-jaune purulentes", "**Allergique** : démangeaisons, brûlures, larmoiement, paupières œdématiées, papilles, sans adénopathie"], "alerte": ["**Contagieuse ++**", "Gravité (forme bactérienne) : sécrétions purulentes importantes, chémosis ou œdème palpébral, larmoiement important, photophobie ou baisse de l'acuité visuelle", "Nourrisson avec récidive : rechercher une imperforation du canal lacrymal", "Ophtalmologue : douleur modérée à sévère, perte de vision, atteinte cornéenne, sécrétions purulentes sévères, récidives, absence de réponse"], "causes": ["**Virale** ≈ 80 % des conjonctivites aiguës ; adénovirus 65 à 90 % des cas viraux", "Bactérienne (enfant) : Haemophilus influenzae, pneumocoque, Moraxella catarrhalis", "Néonatale (jusqu'à 10 % des nouveau-nés) : Chlamydia trachomatis, gonocoque, HSV-2"], "complications": ["Herpès : ≈ 38 % de complications cornéennes, 19 % d'uvéite", "Chlamydia néonatale : pneumonie, otite moyenne"], "examens": ["Biologie rarement indiquée", "**Culture** si récidive, résistance au traitement, suspicion de gonocoque ou Chlamydia, forme néonatale", "Test rapide adénovirus : sensibilité 89 %, spécificité jusqu'à 94 %", "Durée : virale 2 à 3 semaines au total, bactérienne 7 à 10 jours"], "traitement": ["Selon la cause : antiseptiques locaux, sérum physiologique ou camomille, avec antibiotique ou antihistaminique", "**Virale (adénovirus)** : résolution spontanée, compresses froides, larmes artificielles ; antiviral si herpès", "**Bactérienne** : antibiotique local toutes les **2 à 6 h** pendant **5 à 7 jours**", "**Allergique** : éviction, larmes artificielles, compresses froides, antihistaminiques ou stabilisateurs des mastocytes locaux"], "stage": ["**Hygiène des mains** indispensable (solution hydro-alcoolique devant et dans chaque chambre)", "Éducation : ne pas se toucher les yeux", "Ne pas partager serviettes ou cosmétiques"], "retenir": ["Très contagieuse : hygiène des mains", "Virale la plus fréquente (≈ 80 %), souvent spontanément résolutive", "Signes de gravité ou douleur forte : ophtalmologue"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : ORL et bouche", "title": "Stomatite (gingivostomatite herpétique)", "d": {"id": "p2-stomatite-gingivostomatite-herptique", "titre": "Stomatite (gingivostomatite herpétique)", "groupe": "ORL et bouche", "bref": "Manifestation la plus fréquente de la primo-infection à HSV-1, surtout de 6 mois à 5 ans.", "signes": ["Prodrome : fièvre, perte d'appétit, malaise, céphalées", "**Vésicules douloureuses** (muqueuse buccale, langue, gencive, palais, pharynx, lèvres) → ulcères à centre jaune et halo rouge, saignent facilement", "Adénopathies sous-mandibulaires ou cervicales fréquentes", "L'enfant peut **refuser de boire**", "Guérison sans cicatrice en **10 à 14 jours**, jusqu'à 3 semaines si sévère"], "alerte": ["**Déshydratation** : principale cause d'hospitalisation", "⚠ Doses d'aciclovir (**10 mg/kg IV toutes les 8 h** chez l'immunodéprimé) et de réhydratation (**10 à 20 mL/kg en 1 h**) : à confirmer avec la prescription / le protocole"], "causes": ["HSV-1 : transmission par contact direct ou sécrétions orales", "Souvent à partir d'une personne qui excrète le virus sans symptôme", "≈ 90 % de la population mondiale séropositive pour HSV-1 à 35 ans"], "complications": ["**Déshydratation**", "Herpès labial, encéphalite herpétique, panaris herpétique, kératite herpétique, eczéma herpeticum"], "examens": [], "traitement": ["**Hydratation** : le point le plus important", "Peu ou pas déshydra ications": [], "examens": ["Placards qui ne partent pas à l'abaisse-langue (diagnostic clinique)"], "traitement": ["**Antimycotique local** : nystatine ou Daktarin gel oral"], "stage": ["**Désinfecter** tout ce que l'enfant met en bouche, en parallèle du traitement", "Y compris le mamelon maternel si allaitement"], "retenir": ["Placards blancs non détachables à l'abaisse-langue", "Différentiel : lait", "Traitement local + désinfection des objets en bouche"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : ORL et bouche", "title": "Herpangine", "d": {"id": "p2-herpangine", "titre": "Herpangine", "groupe": "ORL et bouche", "bref": "Infection virale à **coxsackievirus A** (entérovirus) avec vésicules du fond de la gorge, chez le jeune enfant.", "signes": ["**Début brutal** : fièvre et mal de gorge", "Petites vésicules ou ulcérations du fond de la gorge : voile du palais, piliers des amygdales", "Avant de la bouche en général épargné", "Incubation **4 à 14 jours**", "Surtout avant 10 ans, été et début d'automne"], "alerte": ["Complications rares (surtout entérovirus A71) : paralysie flasque aiguë, méningite aseptique, encéphalite, myocardite", "Fièvre : signaler toute T° > **37,8 °C** (au service S 51)", "Doses de paracétamol et d'ibuprofène : suivre la prescription"], "causes": ["Coxsackievirus A", "Autres entérovirus non poliomyélitiques", "Voisine de la maladie pieds-mains-bouche"], "complications": ["Paralysie flasque aiguë (rare)", "Méningite aseptique", "Encéphalite", "Myocardite"], "examens": [], "traitement": ["Guérison spontanée en ± 10 jours ; **pas d'antiviral spécifique**", "Traitement symptomatique : **paracétamol** (Dafalgan®) ou **ibuprofène** (Nurofen®)", "Connaître la dose par kg de poids", "Hydratation"], "stage": ["Douleur : EVENDOL (0 à 4-6 ans), EVA ou échelle numérique", "Réévaluer la douleur **30 min** après l'antalgique", "Diurèse ≥ **2 mL/kg/h** ; bilan hydrique à maîtriser", "Fièvre > 37,8 °C : signaler tout de suite", "Recontrôler la ois et 5 ans, jusqu'à 4 % des enfants ; crise souvent pendant l'élévation de T°", "Seuil convulsivant variable selon l'enfant", "Méningite, méningo-encéphalite", "Sans fièvre : traumatisme crânien, enfant secoué, intoxication", "Déshydratation aiguë, troubles métaboliques, anoxie-ischémie cérébrale"], "complications": ["Récidive : ± **30 %**", "Risque d'épilepsie légèrement augmenté", "État de mal fébrile (> 30 min) : sclérose mésiale temporale", "Paralysie de Todd (résolutive en heures ou jours)"], "examens": ["Toujours **T°** et **glycémie** (dextro)", "Glycémie au service S 51 : 70-140 mg/dl à jeun ; 70-180 mg/dl postprandial", "Simple : aucun examen complémentaire", "Complexe : bilan approfondi, imagerie, **EEG**", "EEG aussi si récupération retardée", "**Ponction lombaire** : non si simple + récupération rapide", "PL si infection du système nerveux central suspectée ou nourrisson < 12 mois", "Biologie si déshydratation, vomissements, diarrhée, mauvaise prise alimentaire", "Si méningite suspectée : T°, pulsations, saturation, PA, Glasgow"], "traitement": ["Simple : traiter la fièvre et la cause, pas de traitement spécifique", "Complexe : examens + traitement", "**Urgence** : **Valium** intra-rectal **0,5 mg/kg**, ou **Temesta** intra-buccal, ou **Dormicum** intra-nasal", "Oxygène si besoin : lunettes nasales **max 3 l/min**, humidifier (Aquapack®)", "Objectif SaO2 ≥ 92 % (sauf certaines pathologies)", "**Paracétamol** (Dafalgan®) pour la fièvre, **pas d'aspirine** ; connaître la dose par kg", "Les antipyrétiques ne préviennent pas la récidive", "Benzodiazépines en prévention : non recommandées", "Nourrisson fébrile : bilan complet + triple ATB (Clamoxyl®, Céfotaxim®, Amukin®)"], "stage": ["Sécuriser l'enfant (barres remontées, surtout lits cages)", "Dextro + T° d'emblée", "Fièvre > 37,8 °C : signaler tout de suite", "Si T° > 38 °C : antipyrétique, hémoculture si nécessaire", "Recontrôler la T° 30 min après la 1re prise, puis d'office 1 h plus tard", "Découvrir l ut chez l'enfant)", "Médicaments < 10 % : AINS, antiépileptiques, antibiotiques"], "complications": ["Enfant : formes récidivantes, prédominance masculine, plus d'hospitalisations, réponse moindre aux immunosuppresseurs que chez l'adulte"], "examens": ["Diagnostic sur l'aspect des lésions en cible"], "traitement": ["Selon la gravité et la cause", "Forme aiguë : **corticoïdes topiques** ou **antihistaminiques**", "Récidives liées à l'herpès : **aciclovir 400 mg 2 fois par jour pendant 6 mois** (à confirmer avec la prescription)", "Zovirax® = aciclovir"], "stage": ["Pathologie de dermatologie rencontrée en salle 51"], "retenir": ["Lésions en cible à 3 zones", "Cause surtout infectieuse (HSV-1, Mycoplasma)", "Ne pas confondre avec Stevens-Johnson (bulles étendues)"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Impétigo", "d": {"id": "p2-imptigo", "titre": "Impétigo", "groupe": "Peau", "bref": "Infection cutanée contagieuse des couches superficielles de l'épiderme, due au streptocoque A ou au staphylocoque doré.", "signes": ["Trois formes : **non bulleux**, **bulleux**, **ecthyma**", "**Non bulleux** : vésicules ou pustules qui se rompent, **croûte jaune miel** sur base rouge", "Non bulleux : adénopathie régionale légère, pas de fièvre", "**Bulleux** : bulles flasques à contenu clair ou jaune, sans croûte jaune miel ; fièvre plus fréquente", "**Ecthyma** : ulcération profonde « en coup de poinçon », bords violacés"], "alerte": ["**Glomérulonéphrite** possible : atteinte rénale 7 à 14 jours après l'infection", "**SARM communautaire** en augmentation : faire une culture si suspecté"], "causes": ["Streptocoque A ou staphylocoque doré : S. aureus 80 %, strepto A 10 %, association 10 %", "Impétigo bulleux : presque toujours S. aureus", "Contagion par contact ; la rupture de la barrière cutanée est la porte d'entrée", "Facteurs de risque : malnutrition, immunodépression, crèche, mauvaise hygiène, diabète, varicelle"], "complications": ["**Glomérulonéphrite** (environ 5 %)", "Arthrite septique, sepsis", "Scarlatine", "Syndrome d'échaudure staphylococcique", "Ecthyma"], "examens": ["Diagnostic **clinique**, pas de sérologie", "Culture pour confirmer ou si SARM suspecté"], "traitement": ["1re intention : antiseptique + antibiotique local (sauf si forme sévère)", "Formes localisées non bulleuses : retirer les croûtes à l'eau et au savon, puis **mupirocine**, **rétapamuline** ou **acide fusidique** local", "Voie orale : bêtalactamines résistantes aux bêtalactamases (céphalosporines, amoxicilline-clavulanate, dicloxacilline)", "Si SARM : **clindamycine** ou **doxycycline**", "Correspondances : Augmentin® = amoxiclav ; Dalacin® = clindamycine", "Évolution : guérison en 14 à 21 jours sans traitement, environ 10 jours avec"], "stage": ["Pathologie rencontrée en salle 51", "**Hygiène des mains** et du linge", "**Éviction** 24 à 48 h après le début des antibiotiques"], "retenir": ["Croûte **jaune miel** = impétigo non bulleux", "Contagieux : hygiène des mains, linge, éviction 24 à 48 h sous ATB", "Complication rénale : **glomérulonéphrite**", "Diagnostic clinique ; culture si SARM suspecté"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Gale", "d": {"id": "p2-gale", "titre": "Gale", "groupe": "Peau", "bref": "Infestation cutanée très contagieuse par l'acarien Sarcoptes scabiei var. hominis.", "signes": ["**Prurit surtout nocturne**", "Lésions papulo-vésiculeuses, parfois nodules", "**Sillons** : courtes lignes blanches ondulées, avec vésicule ou érosion au bout", "Nourrisson : cuir chevelu, visage, paumes et plantes possibles"], "alerte": ["⚠ Lavage du linge à **60 °C** ou **75 °C** : valeur à confirmer avec le service", "⚠ Incubation de **4 à 6 semaines** ou **4 à 10 semaines** : valeur à confirmer avec le service", "⚠ Dose d'ivermectine : à confirmer avec la prescription"], "causes": ["Parasite obligatoire de la peau humaine ; la femelle pond 2 à 4 œufs par jour", "Contact **prolongé et ation seule", "Zinc + changes réguliers"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Maladies éruptives (rougeole, roséole, 5e maladie, varicelle…)", "d": {"id": "p2-maladies-ruptives-rougeole-rubole-rosole-5e-maladie-pieds-mains-bouche", "titre": "Maladies éruptives (rougeole, roséole, 5e maladie, varicelle…)", "groupe": "Peau", "bref": "Maladies infectieuses avec éruption : rougeole, rubéole, roséole, 5e maladie, varicelle, scarlatine, pieds-mains-bouche.", "signes": ["**Rougeole** : taches de Koplik, maculopapules confluentes", "**Roséole** (6 mois à 6 ans) : fièvre élevée **3 à 5 jours**, éruption quand la fièvre tombe, état général conservé", "**5e maladie** (parvovirus B19) : joues « giflées », éruption en carte géographique ou dentelle, parfois arthralgies", "**Varicelle** : boutons de tailles inégales, rouges, prurigineux", "Varicelle : température, prurit, refus alimentaire"], "alerte": ["Varicelle : **PAS DE NUROFEN** (risque de fascite nécrosante)", "Varicelle extrêmement contagieuse"], "causes": ["Varicelle : virus de la famille de l'herpès", "5e maladie : parvovirus B19"], "complications": ["Varicelle surinfectée", "5e maladie : parfois récidive pendant 3 semaines"], "examens": [], "traitement": ["Varicelle : assécher les boutons (**Diaceptyl**)", "Corticoïde local si boutons surinfectés (**Fucidin**)", "Antidouleurs, antihistaminiques"], "stage": ["Varicelle : **isolement aérien** (feuille blanche), masque **FFP2**, tablier, gants", "**Peser** tous les jours", "Varicelle surinfectée et scarlatine : pathologies fréquentes du service"], "retenir": ["Varicelle : isolement aérien + FFP2", "Varicelle : jamais de Nurofen", "Roséole : éruption à la chute de la fièvre"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Orthopédie", "title": "Arthrite septique", "d": {"id": "p2-arthrite-septique", "titre": "Arthrite septique", "groupe": "Orthopédie", "bref": "Inflammation d'une articulation d'origine infectieuse, le plus VA **≥ 4** : plus de **50 %** d'échec au 1er essai", "Aucune aiguille en chambre, matériel jamais à portée de l'enfant", "Maximum **3 soignants** dans la salle de soins", "Interdit de préparer ou d'administrer sans l'infirmier de référence"], "enfant": ["Nourrisson **< 3 mois** : solution sucrée avec succion ou allaitement", "Plus grand : **Emla** (**60 minutes**), **MEOPA**, jeu, distraction", "Au service S 51 : Emla®, MEOPA, glucosé **30 %**", "Distraction, jeux, chansons, vidéos, doudou/tétine, histoires", "Présence des parents", "Bandage pour que l'enfant ne touche pas le cathéter"], "surveillance": ["Avant : identité, site, antalgie, état de l'enfant", "Pendant : le rinçage confirme le placement", "Après : rougeur, chaleur, gonflement, douleur (enfants craintifs !), pansement", "Perméabilité : injecter au moins **2 ml** de LP", "Déballer régulièrement le site ; **obligatoire** avant toute injection IV", "Refaire le pansement seulement s'il est décollé ou souillé", "Contrôle du site : **toutes les heures** (soins intensifs, médicaments à risque)", "Contrôle du site : **toutes les 4 heures** (perfusions simples)", "Contrôle du site : avant et après chaque perfusion intermittente", "Rinçage pulsé (poussée-pause) au NaCl 0,9 % prescrit, seringue **10 ml**", "Désinfecter l'embout **15 secondes**, laisser sécher", "Contrôler T°, pouls, respiration, TA, poids, diurèse, faciès, coloration, éveil", "Évaluer la douleur ; réévaluer **30 min** après antalgie"], "alerte": ["Retirer le KTP dès qu'il n'est plus nécessaire ou au 1er signe de complication", "**Phlébite** : gonflement, rougeur, chaleur, induration, pus, cordon veineux, douleur", "**Infiltration/extravasation** : douleur, gonflement, érythème, induration, phlyctènes, pâleur, cathéter qui dysfonctionne", "**Ponction artérielle** accidentelle : reflux rouge vif et pulsatile", "Autres complications : septicémie, choc, surcharge circulatoire, embolie gazeuse, allergie, embol du cathéter, infection du site", "Reflux :
