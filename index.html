<style>
/* Concept : un syllabus relié. Une page à la fois, bandeau de couleur par partie, encadrés constants (Attention / En stage / À retenir). */
:root{
  --bg:#e9edf2; --paper:#ffffff; --ink:#1a2330; --muted:#586577; --line:#d6dce4; --soft:#f3f6f9;
  --c-ess:#b23a2a; --c-add:#3d5a80; --c-normes:#9a6208; --c-patho:#0a6c75; --c-proc:#2b7a47; --c-drug:#5648bd;
  --alert:#a9231b; --alert-bg:#fdeceb; --stage-bg:#e5f3e8; --stage:#1f6b3a; --ret-bg:#fff2bf; --ret:#6b5300;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif; --sans:'Atkinson Hyperlegible',system-ui,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --paper:#161d26; --ink:#e7ecf2; --muted:#9aa7b8; --line:#2b3644; --soft:#1d2733;
  --c-ess:#ff9a86; --c-add:#9db8dc; --c-normes:#e0a53f; --c-patho:#4cc2cc; --c-proc:#6cc88a; --c-drug:#a69cff;
  --alert:#ff8f86; --alert-bg:#3a1d1c; --stage-bg:#17301f; --stage:#8fdcaa; --ret-bg:#3a3210; --ret:#f2d36b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --paper:#161d26; --ink:#e7ecf2; --muted:#9aa7b8; --line:#2b3644; --soft:#1d2733;
  --c-ess:#ff9a86; --c-add:#9db8dc; --c-normes:#e0a53f; --c-patho:#4cc2cc; --c-proc:#6cc88a; --c-drug:#a69cff;
  --alert:#ff8f86; --alert-bg:#3a1d1c; --stage-bg:#17301f; --stage:#8fdcaa; --ret-bg:#3a3210; --ret:#f2d36b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.app{min-height:100%;display:flex;flex-direction:column}
/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:.5rem;padding:.55rem 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.top .brand{font-family:var(--serif);font-weight:700;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.74rem;color:var(--muted)}
.ib{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:.4rem .7rem;font-size:.9rem;white-space:nowrap}
.ib:focus-visible,.nb:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--c-patho);outline-offset:2px}
/* feuille */
main{flex:1;padding:18px 16px 96px;display:flex;justify-content:center}
.sheet{width:100%;max-width:880px;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 0 var(--line),0 12px 30px -18px rgba(10,20,40,.35);overflow:hidden;--c:var(--c-patho)}
.sheet.p-ess{--c:var(--c-ess)}.sheet.p-add{--c:var(--c-add)}.sheet.p-normes{--c:var(--c-normes)}.sheet.p-patho{--c:var(--c-patho)}.sheet.p-proc{--c:var(--c-proc)}.sheet.p-drug{--c:var(--c-drug)}
.band{display:flex;justify-content:space-between;gap:1rem;padding:.55rem clamp(16px,4vw,36px);background:var(--c);color:#fff;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
[data-theme="dark"] .band{color:#0d1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .band{color:#0d1218}}
.body{padding:clamp(18px,4vw,34px) clamp(16px,4vw,36px) 20px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.55rem,4.6vw,2.15rem);line-height:1.15;margin:.1rem 0 .5rem;text-wrap:balance;color:var(--c)}
.lead{font-size:1.08rem;margin:.2rem 0 1.1rem;color:var(--ink)}
.kick{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1.1rem 1.8rem;margin-top:1rem}
.blk{min-width:0;margin-top:1rem}
.grid .blk{margin-top:0}
.blk h2{font-family:var(--sans);font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--c);margin:0 0 .35rem;padding-top:.5rem;border-top:2px solid var(--c)}
ul.l,ol.l{margin:0;padding-left:1.15rem}
ul.l li,ol.l li{margin:.28rem 0;padding-left:.15rem}
ul.l li::marker{color:var(--c)}
ol.l{counter-reset:s;list-style:none;padding-left:0}
ol.l li{counter-increment:s;position:relative;padding-left:2.2rem;margin:.45rem 0}
ol.l li::before{content:counter(s);position:absolute;left:0;top:.05rem;width:1.55rem;height:1.55rem;border-radius:50%;background:var(--c);color:#fff;font-size:.82rem;font-weight:700;display:grid;place-items:center}
[data-theme="dark"] ol.l li::before{color:#0d1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) ol.l li::before{color:#0d1218}}
ul.chk{list-style:none;padding-left:0}
ul.chk li{padding-left:1.5rem;position:relative}
ul.chk li::before{content:"";position:absolute;left:0;top:.38rem;width:.85rem;height:.85rem;border:2px solid var(--c);border-radius:3px}
.box{border-radius:8px;padding:.7rem 1rem .8rem;margin-top:1.1rem}
.box h2{margin:0 0 .3rem;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;border:0;padding:0;color:inherit}
.box ul.l li::marker{color:currentColor}
.alert{background:var(--alert-bg);color:var(--alert)}
.alert ul{color:var(--ink)}
.stage{background:var(--stage-bg);color:var(--stage)}
.stage ul{color:var(--ink)}
.ret{background:var(--ret-bg);color:var(--ret)}
.ret ul{color:var(--ink);font-weight:700}
.dose{background:var(--soft);border:1px solid var(--line)}
.dose h2{color:var(--c)}
dl.id{display:grid;grid-template-columns:max-content 1fr;gap:.3rem 1rem;margin:.9rem 0 .2rem;padding:.7rem 1rem;background:var(--soft);border:1px solid var(--line);border-radius:8px}
dl.id dt{font-weight:700;color:var(--c)}
dl.id dd{margin:0;min-width:0}
@media(max-width:520px){dl.id{grid-template-columns:1fr}dl.id dt{margin-top:.25rem}}
.tw{overflow-x:auto;margin-top:.8rem;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.95rem}
th,td{padding:.5rem .7rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--c);color:#fff;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
[data-theme="dark"] thead th{color:#0d1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) thead th{color:#0d1218}}
tbody tr:nth-child(even){background:var(--soft)}
tbody td:first-child{font-weight:700}
strong{font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem clamp(16px,4vw,36px);border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.done{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:.3rem .9rem;font-size:.85rem}
.done[aria-pressed="true"]{background:var(--stage-bg);color:var(--stage);border-color:var(--stage);font-weight:700}
/* sommaire / chapitres */
.toc h3{font-family:var(--serif);font-size:1.25rem;margin:1.4rem 0 .3rem;color:var(--c)}
.toc .ch{margin:.15rem 0 .6rem}
.toc a.row,.chap a.row{display:flex;align-items:baseline;gap:.6rem;padding:.38rem .3rem;border-bottom:1px dotted var(--line);text-decoration:none}
.toc a.row:hover,.chap a.row:hover{background:var(--soft)}
.row .t{flex:1;min-width:0}
.row .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.row .d{display:block;font-size:.85rem;color:var(--muted)}
.row .ok{color:var(--stage);font-weight:700}
.toc .chn{font-weight:700}
.chap h1{font-size:clamp(1.8rem,6vw,2.6rem)}
.cover{text-align:left;padding-block:clamp(26px,8vw,70px)}
.cover h1{font-size:clamp(2rem,7vw,3.3rem);color:var(--ink)}
.cover .sub{font-size:1.15rem;color:var(--muted);margin:.2rem 0 1.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.2rem 0}
.chip{border-radius:999px;padding:.25rem .8rem;color:#fff;font-size:.88rem;font-weight:700}
[data-theme="dark"] .chip{color:#0d1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:#0d1218}}
.btn{display:inline-block;margin:.3rem .4rem .3rem 0;padding:.6rem 1.1rem;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700}
.btn.o{background:transparent;color:var(--ink)}
/* barre du bas */
.bot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:.6rem;justify-content:center;align-items:center;padding:.55rem 16px calc(.55rem + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.nb{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:.5rem .9rem;font-weight:700;white-space:nowrap}
.nb:disabled{opacity:.35}
.pg{min-width:5.5rem;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
/* recherche */
.ov{position:fixed;inset:0;z-index:10;background:rgba(10,16,24,.55);display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px}
.pan{width:100%;max-width:680px;max-height:100%;overflow:auto;background:var(--paper);border-radius:10px;border:1px solid var(--line);padding:1rem}
.pan input{width:100%;padding:.7rem .9rem;font:inherit;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.pan .res a{display:block;padding:.55rem .3rem;border-bottom:1px solid var(--line);text-decoration:none}
.pan .res small{display:block;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.sheet{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}}
/* accueil, logo, sommaire */
.top .logo{display:block;flex:none;line-height:0;border-radius:9px;overflow:hidden}
.top .logo img{width:36px;height:36px}
.home .hero{display:flex;align-items:center;gap:clamp(14px,4vw,28px);margin-bottom:1rem}
.home .logo-big{width:clamp(88px,26vw,130px);height:auto;border-radius:22%;flex:none;box-shadow:0 6px 18px -8px rgba(10,20,40,.45)}
.home h1{color:var(--ink);margin:.1rem 0 .2rem}
.home .sub{color:var(--muted);margin:0}
.home .ok,.part .ok{color:var(--stage);font-weight:700}
.somt{font-family:var(--serif);font-size:1.35rem;margin:1.4rem 0 .5rem}
details.part{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;margin:.55rem 0;background:var(--paper)}
details.part summary{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.75rem 1rem;cursor:pointer;list-style:none}
details.part summary::-webkit-details-marker{display:none}
details.part summary::after{content:"›";font-size:1.4rem;line-height:1;color:var(--c);transition:transform .15s}
details.part[open] summary::after{transform:rotate(90deg)}
details.part .pn{font-weight:700;font-size:1.08rem;color:var(--c);flex:1}
details.part .pc{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
details.theme{border-top:1px solid var(--line)}
details.theme summary{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.6rem 1rem .6rem 1.4rem;cursor:pointer;list-style:none}
details.theme summary::-webkit-details-marker{display:none}
details.theme summary::after{content:"›";font-size:1.2rem;line-height:1;color:var(--c);transition:transform .15s}
details.theme[open] summary::after{transform:rotate(90deg)}
details.theme .tn{flex:1;font-weight:700}
details.theme[open]{background:var(--soft)}
details.theme a.row{padding-left:2.2rem;background:var(--paper)}
details.part a.row{display:flex;gap:.6rem;align-items:baseline;padding:.5rem 1rem;border-top:1px dotted var(--line);text-decoration:none}
details.part a.row:hover{background:var(--soft)}
.home .note{font-size:.88rem;color:var(--muted);margin-top:1.4rem}
h3.tt{font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--c);margin:1.2rem 0 0}
</style>
</head>
<body>
<div class="app" id="app">
 <div class="top"><a class="logo" href="#p0" aria-label="Accueil"><img src="logo.svg" alt="" width="36" height="36"></a><div class="brand" id="brand">Stage de pédiatrie<small>Fiches · Service S 51</small></div>
  <button class="ib" id="bSearch" type="button">Rechercher</button><button class="ib" id="bToc" type="button">Sommaire</button></div>
 <main><article class="sheet" id="sheet" aria-live="polite"></article></main>

<script>
var PAGES=[{"k": "home"}, {"k": "fiche", "part": "ess", "chap": "Essentiels : Urgences", "title": "Reconnaître l'enfant qui va mal", "d": {"groupe": "Urgences", "bref": "Repérer en quelques secondes un enfant qui se dégrade (respiratoire, circulatoire, neurologique, infectieux) et savoir quand et comment alerter l'infirmier(ère) référent(e) ou le médecin.", "sections": [{"k": "list", "h": "COUP D'ŒIL INITIAL : LE TRIANGLE D'ÉVALUATION PÉDIATRIQUE", "items": ["À faire en quelques secondes, sans toucher l'enfant, avant toute prise de paramètres.", "**Apparence** : tonus, interaction avec l'entourage, consolabilité, regard, cri ou voix. Un enfant apathique, hypotonique, geignard ou « qui ne regarde plus » est inquiétant.", "**Respiration (travail respiratoire)** : bruits anormaux, position, tirage, battements des ailes du nez, polypnée.", "**Circulation cutanée** : pâleur, marbrures, cyanose, teint grisâtre.", "Un seul côté du triangle anormal suffit à justifier une évaluation immédiate et une alerte."]}, {"k": "list", "h": "APPROCHE ABCDE : TRAITER D'ABORD CE QUI TUE", "items": ["**A** (voies aériennes) : libres ? risque en cas d'altération de la conscience, de sécrétions ou de corps étranger.", "**B** (respiration) : fréquence respiratoire, saturation, signes de lutte, bruits (stridor, wheezing, grunting).", "**C** (circulation) : fréquence cardiaque, pouls, temps de recoloration, marbrures, tension, diurèse, hémorragie.", "**D** (neurologie) : état de conscience (AVPU), pupilles, convulsions, glycémie (dextro).", "**E** (exposition) : température, éruption (pétéchies, purpura), douleur, lésions, brûlures.", "Corriger chaque étape avant de passer à la suivante ; réévaluer régulièrement."]}, {"k": "list", "h": "SIGNES DE GRAVITÉ RESPIRATOIRES", "items": ["Critères de gravité d'une détresse respiratoire : **tachypnée** (FR > 60/min chez le nourrisson ; au-delà de la tranche d'âge du tableau des normes : alerter), tachycardie, irrégularité du rythme respiratoire, importance des signes de lutte, cyanose, pâleur, sueurs, altération de la conscience.", "**Détresse haute** : dyspnée inspiratoire, **stridor**, toux aboyante, voix rauque, tirage sus-sternal.", "**Détresse basse** : polypnée, dyspnée expiratoire, wheezing, gémissements (grunting), tirage intercostal et sous-costal.", "Une **bradypnée ou une bradycardie** chez un enfant en détresse signe l'épuisement : urgence vitale.", "Saturation : > 95 % normale ; 90-95 % à surveiller ; **< 90 % grave** ; oxygène si saturation < 92 % ; objectif ≥ 92 % (sauf pathologies particulières).", "La détresse respiratoire n'est pas toujours d'origine pulmonaire : première cause infectieuse, mais penser aussi à la cardiopathie."]}, {"k": "list", "h": "SIGNES DE GRAVITÉ CIRCULATOIRES : DÉSHYDRATATION ET CHOC", "items": ["Déshydratation (perte de poids) : **légère ≈ 5 %** (à surveiller) ; **modérée à grave ≈ 5-9 %** ; **sévère ≥ 10-15 %** (risque de choc) : seuils indicatifs, à confirmer avec le service. Peser l'enfant et calculer le pourcentage.", "Signes visibles : apathie, irritabilité, fontanelle déprimée, pli cutané paresseux, yeux cernés, muqueuses sèches, peu de larmes, soif, teint grisâtre.", "Signes de choc : **temps de recoloration > 2 s**, marbrures, froideur des extrémités avec « frontière chaud/froid », pouls périphériques faibles ou absents, tachycardie puis bradycardie, hypotension (signe tardif), oligurie ou anurie, sueurs, cyanose, trouble de la conscience.", "Types de choc : hypovolémique, distributif, cardiogénique, obstructif ou mixte. Choc anaphylactique : adrénaline IM.", "**Bradycardie** chez l'enfant : souvent un signe de souffrance extracardiaque grave (penser d'abord à une cause respiratoire) ; urgence si elle s'associe à une décompensation vasculaire."]}, {"k": "list", "h": "SIGNES DE GRAVITÉ NEUROLOGIQUES", "items": ["Échelle **AVPU** : Alerte, réponse à la stimulation Verbale, réponse à la douleur (Pain), Pas de réponse (Unresponsive).", "Évaluer aussi le score de Glasgow, les pupilles (mydriase = suspicion d'hypertension intracrânienne ; myosis) et le comportement.", "Alarmes : céphalées, vomissements en jet, troubles du comportement, irritabilité, difficulté à s'exprimer, **fontanelle bombante** (ne pas banaliser).", "Hypertension intracrânienne : hypertension artérielle, respiration irrégulière, bradycardie.", "Convulsion : toujours prendre la **température** et la **glycémie** ; oxygène si nécessaire. Convulsions fébriles complexes (durée ≥ 5 min, focalisées, déficit post-critique) : toujours bilan.", "Syndrome méningé : nourrisson (irritabilité, hypotonie, fontanelle bombante), grand enfant (céphalées, vomissements, raideur de nuque)."]}, {"k": "list", "h": "FIÈVRE ET INFECTION GRAVE", "items": ["**Purpura fébrile = urgence** : penser septicémie ou méningite (méningocoque), choc associé possible, antibiothérapie d'emblée.", "Nourrisson **< 1 mois** fébrile : toujours hospitalisé (seuil exact, 1 mois ou 6 semaines, à confirmer avec le service). Nourrisson **< 3 mois** : bilan aux urgences.", "Fièvre : signaler toute température > 37,8 °C ; contrôler 30 min après la première prise ; si > 38 °C, antipyrétique et hémoculture si nécessaire ; recontrôler 1 h plus tard.", "Signaler aussi : dégradation clinique, brûlure, vomissements incoercibles (penser à la glycémie)."]}, {"k": "list", "h": "CONSTANTES ET SEUILS D'ALERTE À CONNAÎTRE", "items": ["Valeurs de référence ci-dessous. Présenter les paramètres à l'IR et signaler **immédiatement** toute valeur anormale.", "Tendance : une constante qui évolue en quelques heures compte autant qu'une valeur isolée.", "Fièvre, douleur et pleurs modifient fréquence cardiaque et respiratoire : prendre les paramètres calme si possible, et réévaluer."]}, {"k": "list", "h": "ALERTER : QUAND ET COMMENT", "items": ["**Alerter tout de suite** : altération de la conscience, détresse respiratoire, cyanose, saturation < 92 %, marbrures ou temps de recoloration allongé, bradycardie, hypotension, convulsion, purpura, fontanelle bombante.", "Ne pas attendre de refaire la mesure ni de « finir le soin » si l'enfant se dégrade : rester près de l'enfant et faire appeler.", "Message structuré : identité, âge, motif d'hospitalisation, ce qui a changé, valeurs mesurées avec l'heure, traitement en cours.", "Avant tout geste médicamenteux (adrénaline, antiépileptique), vérifier la prescription et le poids."]}, {"k": "table", "h": "VALEURS DE RÉFÉRENCE PAR ÂGE", "cols": ["ÂGE", "TA (MMHG)", "POULS (/MIN)", "FRÉQUENCE RESPIRATOIRE (/MIN)"], "rows": [["**< 1 mois**", "75/45", "120 - 160", "40 - 60"], ["**1 mois - 2 ans**", "85/45", "100 - 160", "30 - 60"], ["**2 - 12 ans**", "110/60", "70 - 140", "20 - 30"], ["**> 12 ans**", "120/80", "60 - 100", "12 - 20"]]}, {"k": "table", "h": "SEUILS D'ALERTE À SIGNALER", "cols": ["PARAMÈTRE", "SEUIL"], "rows": [["**Saturation**", "< 92 % (grave < 90 %)"], ["**Température**", "> 37,8 °C : signaler immédiatement"], ["**Fréquence respiratoire**", "> 60/min chez le nourrisson = critère de gravité ; au-delà de la tranche d'âge du tableau des normes : alerter"], ["**Temps de recoloration**", "> 2 s"], ["**Perte de poids (déshydratation)**", "légère ≈ 5 % ; modérée à grave ≈ 5-9 % ; sévère ≥ 10-15 % (seuils indicatifs, à confirmer avec le service)"]]}], "alerte": ["Bradycardie ou bradypnée chez un enfant malade = signe tardif et grave, pas une amélioration.", "L'hypotension est un signe tardif du choc : un enfant peut être compensé avec une tension normale.", "Purpura fébrile ou fontanelle bombante : ne jamais banaliser, alerter immédiatement.", "Un enfant calme et apathique est plus inquiétant qu'un enfant qui pleure et proteste.", "Les valeurs normales varient avec l'âge : toujours comparer à la bonne tranche d'âge."], "stage": ["Observer l'enfant (triangle) avant de le toucher, puis prendre pouls, fréquence respiratoire, saturation, température et tension.", "Présenter les paramètres à l'IR et signaler immédiatement toute valeur anormale.", "Mettre en place le monitorage (électrodes, capteur de saturation) sur demande et changer le capteur de saturation chaque pause.", "Vérifier le temps de recoloration, les marbrures, l'état de conscience (AVPU) et la présence de signes de lutte respiratoire.", "Peser l'enfant, noter la diurèse et calculer le pourcentage de perte de poids en cas de gastro-entérite.", "Contrôler température, glycémie et état de conscience lors d'une convulsion ; rester auprès de l'enfant.", "Chez l'enfant perfusé, surveiller température, pouls, respiration, tension, poids, diurèse, faciès, coloration et état d'éveil.", "Rapporter par écrit les valeurs, l'heure et l'évolution."], "retenir": ["Triangle : apparence, respiration, circulation cutanée ; puis ABCDE.", "Saturation < 92 %, FR > 60/min chez le nourrisson (au-delà de la tranche d'âge du tableau : alerter), temps de recoloration > 2 s, température > 37,8 °C : alerter.", "Purpura fébrile, altération de la conscience, bradycardie : urgence.", "Nourrisson fébrile < 1 mois : hospitalisation (seuil exact, 1 mois ou 6 semaines, à confirmer avec le service) ; < 3 mois : bilan aux urgences."]}}, {"k": "fiche", "part": "ess", "chap": "Essentiels : Urgences", "title": "Réanimation de base de l'enfant (RCP)", "d": {"groupe": "Urgences", "bref": "Enchaînement des gestes à connaître par cœur devant un enfant inconscient qui ne respire pas normalement : les voies aériennes et les insufflations passent avant les compressions, car l'arrêt est le plus souvent d'origine respiratoire.", "sections": [{"k": "list", "h": "RECONNAÎTRE L'ARRÊT ET ALERTER", "items": ["**Quick look** : apparence (tonus, interaction, consolable, cri ou parole), puis séquence **Sécurité - Stimuler - Secours** (crier « à l'aide »).", "**Enfant qui ne réagit pas et ne respire pas normalement** = arrêt cardio-respiratoire à traiter comme tel, sans perdre de temps à chercher le pouls.", "**Alerter immédiatement** : à l'hôpital, déclencher l'alarme / l'appel d'urgence du service et demander le chariot d'urgence et le défibrillateur ; hors hôpital, 112 avec haut-parleur activé.", "Chez l'enfant, le cœur est le plus souvent sain : l'arrêt est la **conséquence d'une insuffisance respiratoire ou circulatoire** (asystolie, activité électrique sans pouls, bradycardie extrême ; plus rarement FV / TV)."]}, {"k": "list", "h": "SÉQUENCE DE BASE (A - B - C)", "items": ["**A** : poser l'enfant sur un plan dur, **ouvrir les voies aériennes** (tête en position neutre chez le nourrisson, légère extension chez l'enfant, élévation du menton) et libérer la bouche.", "**B** : donner **5 insufflations initiales** efficaces (soulèvement du thorax) ; d'abord ventiler l'enfant.", "**C** : après les 5 insufflations, enchaîner sur les **compressions thoraciques** (15 compressions pour 2 insufflations).", "Poursuivre en alternance **15 compressions : 2 insufflations** (soignants, avec devoir d'intervention) ; limiter au maximum les interruptions.", "Brancher le **moniteur / DEA dès qu'il arrive** et suivre ses instructions ; ne pas arrêter la RCP en attendant."]}, {"k": "list", "h": "COMPRESSIONS : QUALITÉ", "items": ["**Fréquence 100 à 120 par minute**.", "**Profondeur** : au moins **1/3 de l'épaisseur du thorax** (environ 4 cm chez le nourrisson, 5 cm chez l'enfant).", "**Lieu** : moitié inférieure du sternum ; laisser le thorax **se relâcher complètement** entre deux compressions.", "Se relayer environ toutes les **2 minutes** pour garder des compressions efficaces."]}, {"k": "list", "h": "DÉFIBRILLATEUR (DEA) ET OXYGÈNE", "items": ["Utiliser le DEA dès qu'il est disponible ; **mode ou électrodes pédiatriques si l'enfant pèse moins de 25 kg** (ou moins de 8 ans).", "Électrodes de moins de 25 kg : position **antéro-postérieure** (une au centre du thorax, une dans le dos entre les omoplates) ; au-delà : antéro-latérale ou antéro-postérieure.", "**Oxygène à 100 %** dès que possible, ventilation au ballon-masque.", "**Voie intra-osseuse = voie de choix** dans l'arrêt cardiaque (tout peut y être injecté) ; médicaments uniquement sur prescription médicale.", "**Adrénaline** (prescription médicale) : 0,01 mg/kg ; ampoule 1 mg = 1 mL, diluer 1 mL + 9 mL de NaCl 0,9 % (1:10 000), soit **0,1 mL/kg** de la solution diluée.", "**Estimer le poids** si inconnu : (2 x âge en années) + 8, de 1 à 10 ans ; environ 10 kg à 1 an."]}, {"k": "list", "h": "BRADYCARDIE MAL TOLÉRÉE (AVANT L'ARRÊT)", "items": ["Seuils de bradycardie : **moins de 80/min avant 2 ans ; moins de 60/min entre 2 et 5 ans ; moins de 50/min dès 5 ans**.", "Si signes d'hypoperfusion : libérer les voies aériennes, O2, monitorage, rechercher la cause (hypoxie, hypotension, hypothermie, troubles ioniques, intoxication, acidose).", "Si toujours mal tolérée après **30 secondes de ventilation efficace en O2 à 100 %** : **démarrer les compressions thoraciques** et appeler l'équipe médicale."]}, {"k": "list", "h": "RÔLE DE L'ÉQUIPE ET CHARIOT D'URGENCE", "items": ["Répartir les rôles : chef d'équipe (médecin), ventilation, compressions, accès vasculaire / médicaments, scribe qui note les heures.", "L'infirmier(ère) prépare le matériel, pose le monitorage, assure l'accès IV / IO et prépare les médicaments prescrits (vérifier le poids, la dilution, la voie).", "Connaître **l'emplacement et le contenu du chariot d'urgence** du service (aspiration, ballons-masques et masques par taille, oxygène, DEA / défibrillateur) : à vérifier avec l'équipe dès le premier jour.", "Nouveau-né en salle de naissance : algorithme de réanimation néonatale distinct, non repris ici (à voir avec le service)."]}, {"k": "table", "h": "COMPRESSIONS : NOURRISSON ET ENFANT", "cols": ["POINT", "NOURRISSON (MOINS DE 1 AN)", "ENFANT (PLUS DE 1 AN)"], "rows": [["**Technique**", "**2 pouces** encerclant le thorax (mains autour du thorax)", "**1 ou 2 mains**, talon de la main sur la moitié inférieure du sternum, selon la qualité obtenue"], ["**Fréquence**", "100 à 120 / min", "100 à 120 / min"], ["**Profondeur**", "au moins 1/3 de l'épaisseur du thorax (environ 4 cm)", "au moins 1/3 de l'épaisseur du thorax (environ 5 cm)"], ["**Rapport (soignants)**", "15 : 2", "15 : 2"], ["**Insufflation initiale**", "5 insufflations, bouche sur bouche et nez", "5 insufflations, bouche à bouche, nez pincé"]]}], "alerte": ["Ne pas commencer par les compressions : chez l'enfant, **ventiler d'abord** (5 insufflations) puis comprimer.", "**Délai d'appel** : appeler immédiatement (haut-parleur) ; si seul sans moyen d'appel, 1 minute de RCP avant d'aller chercher de l'aide. Règle exacte à confirmer avec le service. En milieu hospitalier, ne jamais rester seul : déclencher l'alarme.", "**Interruptions** des compressions les plus courtes possibles ; ne pas perdre de temps à chercher un pouls.", "**Technique à 2 doigts** chez le nourrisson : n'est plus la technique de référence, privilégier les 2 pouces encerclants.", "Aucune dose médicamenteuse sans **prescription médicale** et vérification du poids."], "stage": ["Repérer vite l'enfant qui se dégrade (quick look, saturation, fréquence cardiaque, vigilance) et prévenir l'infirmier(ère) responsable.", "Déclencher l'alarme du service, crier à l'aide et demander le chariot d'urgence.", "Ouvrir les voies aériennes, aspirer si besoin et ventiler au ballon-masque en O2 à 100 %.", "Démarrer ou relayer les compressions de qualité (fréquence, profondeur, relâchement).", "Brancher le monitorage et le DEA, appliquer les électrodes pédiatriques et suivre les instructions.", "Préparer l'accès IO / IV et les médicaments prescrits ; noter les heures et les gestes.", "Vérifier avec l'équipe le contenu et l'emplacement du chariot d'urgence du service."], "retenir": ["5 insufflations d'abord, puis compressions 15 : 2 (soignants).", "Compressions : 100 à 120 / min, au moins 1/3 de l'épaisseur du thorax (environ 4 cm nourrisson, 5 cm enfant), relâchement complet.", "Nourrisson : 2 pouces encerclants ; enfant : 1 ou 2 mains.", "DEA : électrodes pédiatriques sous 25 kg ; O2 à 100 % ; voie IO si pas d'IV."]}}, {"k": "fiche", "part": "ess", "chap": "Essentiels : Urgences", "title": "Anaphylaxie (choc allergique)", "d": {"groupe": "Urgences", "bref": "Reconnaître une anaphylaxie en quelques secondes et agir sans retard : adrénaline IM d'abord. Sert aussi de repère pour les auto-injecteurs et l'éducation de la famille.", "sections": [{"k": "list", "h": "DÉFINITION ET MÉCANISME", "items": ["**Forme la plus grave de l'allergie : urgence vitale.** Réaction d'hypersensibilité immédiate (type 1, médiée par les IgE), dans les minutes qui suivent le contact avec l'allergène.", "Elle suppose un contact antérieur avec l'allergène (sensibilisation) : la première exposition connue peut déjà être la bonne.", "L'atteinte est **multisystémique** : peau, voies respiratoires, circulation, digestif.", "Évolution possible vers un choc de type distributif : manque d'apport en oxygène aux cellules."]}, {"k": "list", "h": "CAUSES FRÉQUENTES CHEZ L'ENFANT", "items": ["**Aliments** : cause la plus fréquente chez l'enfant (lait, œuf, arachide, fruits à coque, entre autres).", "**Médicaments** : notamment antibiotiques et anti-inflammatoires ; après injection ou prise orale.", "**Venins** : piqûre d'insecte (guêpe, abeille).", "Entrée de l'allergène souvent par voie parentérale (injection, piqûre) ou digestive.", "Parfois **aucune cause identifiée** : traiter de la même façon."]}, {"k": "list", "h": "RECONNAÎTRE : SIGNES PAR SYSTÈME", "items": ["**Peau et muqueuses** : urticaire, rougeur, démangeaisons, œdème de Quincke (visage, lèvres, paupières ; gorge, larynx). Peuvent manquer ou apparaître tard.", "**Voies respiratoires / respiration** : gêne ou œdème de la gorge, voix modifiée, stridor, toux, sifflements, bronchospasme, difficulté respiratoire, saturation basse.", "**Circulation** : tachycardie (puis bradycardie), hypotension, pâleur, marbrures, extrémités froides, malaise, oligurie.", "**Neurologique** : agitation puis trouble de la conscience, enfant « mou ».", "**Digestif** : nausées, vomissements, diarrhée, crampes abdominales.", "**Critère de reconnaissance** : début brutal d'un problème Voies aériennes et/ou Respiration et/ou Circulation, habituellement avec des signes cutanés, après exposition à un allergène possible."]}, {"k": "list", "h": "GRAVITÉ", "items": ["Toute atteinte respiratoire ou circulatoire = anaphylaxie **grave** : adrénaline immédiate.", "Signes cutanés isolés (urticaire seule) : pas d'anaphylaxie, mais surveillance rapprochée de l'évolution.", "Facteurs de risque d'évolution grave : asthme associé, allergie alimentaire connue, antécédent de réaction sévère."]}, {"k": "list", "h": "CONDUITE À TENIR IMMÉDIATE", "items": ["**1. Appeler à l'aide** (équipe médicale, chariot d'urgence) sans quitter l'enfant.", "**2. Arrêter l'allergène** : stopper la perfusion ou le médicament suspect, retirer le dard, ne pas poursuivre l'aliment.", "**3. Adrénaline IM sans attendre : 0,01 mg/kg**, face antérolatérale du tiers moyen de la cuisse. Solution 1 mg/mL (1:1000) : 0,01 mL/kg ; **voie IM, solution NON diluée**.", "**4. Position** : allongé, jambes surélevées ; assis si détresse respiratoire ; sur le côté si inconscient ou vomissements. Ne pas redresser brusquement l'enfant.", "**5. Oxygène à haut débit**, monitoring FC, TA, saturation.", "**6. Voie veineuse (ou intra-osseuse) et remplissage** si signes de choc : **10 mL/kg (jusqu'à 20 mL/kg selon la prescription) de NaCl 0,9 %** en bolus, à réévaluer (10 mL/kg ou 20 mL/kg selon les recommandations : à confirmer avec la prescription).", "**7. Répéter l'adrénaline après 5 minutes** si pas d'amélioration.", "Adrénaline = traitement de première ligne : elle ouvre les voies aériennes, augmente la tension artérielle et accélère le rythme cardiaque. Antihistaminiques et corticoïdes ne la remplacent jamais."]}, {"k": "list", "h": "SURVEILLANCE ET OBSERVATION", "items": ["Surveillance continue : FC, TA, saturation, fréquence respiratoire, conscience, peau, ECG si possible.", "Une récidive de symptômes (réaction biphasique) reste possible après une première amélioration : **ne jamais renvoyer l'enfant rapidement**.", "Durée d'observation après adrénaline : **à confirmer avec le service / la prescription**.", "Toute anaphylaxie traitée par adrénaline : avis médical et bilan allergologique de suivi."]}, {"k": "list", "h": "AUTO-INJECTEURS ET ÉDUCATION", "items": ["En Belgique : **EpiPen** et **Jext** (stylos préremplis IM) ; deux dosages fixes : **0,15 mg** (enfant) et **0,3 mg** (adulte) ; l'adrénaline reste une injection **IM, solution NON diluée**. Emerade : disponibilité et dosages à confirmer.", "Dosage à choisir selon le poids : **0,15 mg de 15 à 30 kg**, **0,3 mg au-delà de 30 kg** ; en dessous de 15 kg : à confirmer avec la prescription. Seuils exacts par produit : à confirmer avec la prescription.", "Dose fixe : pas d'adaptation possible. Chez le petit nourrisson, dose adaptée au poids : à confirmer avec la prescription.", "Injection à travers les vêtements dans la face externe de la cuisse ; **tenir le temps indiqué par le dispositif**, appeler les secours, rester auprès de l'enfant.", "Prévoir **2 auto-injecteurs** sur soi en permanence ; vérifier la date de péremption et la conservation (< 25 °C, ne pas congeler).", "Éducation de l'enfant, de la famille et de l'école : éviction de l'allergène, lecture des étiquettes, **plan d'action écrit**, démonstration avec un dispositif d'entraînement, reformulation par la famille."]}, {"k": "table", "h": "ADRÉNALINE IM (SOLUTION 1 MG/ML, NON DILUÉE) : REPÈRES PAR ÂGE", "cols": ["ÂGE / POIDS", "DOSE IM", "VOLUME (1 MG/ML)"], "rows": [["**Règle générale** (les lignes par âge ne sont que des repères ; en cas de doute, la dose en mg/kg fait foi)", "0,01 mg/kg = 0,01 mL/kg de la solution à 1 mg/mL, non diluée, voie IM", "0,01 mL/kg"], ["**< 6 mois (repère)**", "100 à 150 microgrammes", "0,1 à 0,15 mL"], ["**6 mois à 6 ans (repère)**", "150 microgrammes", "0,15 mL"], ["**6 à 12 ans (repère)**", "300 microgrammes", "0,3 mL"], ["**> 12 ans (repère)**", "500 microgrammes", "0,5 mL"], ["**Auto-injecteur (selon le poids)**", "0,15 mg de 15 à 30 kg ; 0,3 mg au-delà de 30 kg ; en dessous de 15 kg : à confirmer avec la prescription", "dose fixe"]]}], "alerte": ["**Ne jamais retarder l'adrénaline** : en cas de doute, l'injecter. Le retard est le principal facteur de gravité.", "Absence d'urticaire ne l'exclut pas : un problème respiratoire ou circulatoire brutal après exposition suffit.", "Voie **IM** (cuisse), pas sous-cutanée : l'aiguille courte d'un auto-injecteur peut déposer l'adrénaline dans la graisse sous-cutanée (absorption plus lente).", "Œdème de la gorge, stridor ou voix modifiée : risque d'obstruction rapide, appel urgent d'un médecin expérimenté.", "Doses ci-dessus (repères par âge) à contrôler sur la prescription médicale avant toute administration."], "stage": ["Appeler immédiatement à l'aide et déclencher l'alerte du service ; rester auprès de l'enfant.", "Stopper toute perfusion ou médicament suspect et conserver le matériel (étiquette, poche) pour l'analyse.", "Préparer ou administrer l'adrénaline IM sur ordre médical : vérifier le poids, la dose en mg et en mL, la voie (IM, solution NON diluée) et le site.", "Installer l'enfant en bonne position, appliquer l'oxygène et brancher le monitoring (FC, TA, saturation).", "Poser une voie d'accès (ou aider à l'intra-osseuse) et préparer le remplissage (NaCl 0,9 %).", "Noter l'heure de l'injection pour pouvoir répéter à 5 minutes, et tracer constantes et évolution.", "Après l'épisode, expliquer à l'enfant et aux parents l'auto-injecteur et le plan d'action ; vérifier qu'ils savent s'en servir."], "retenir": ["Adrénaline IM 0,01 mg/kg en face externe de cuisse, répétable après 5 minutes.", "Dose fixe d'auto-injecteur : 0,15 mg de 15 à 30 kg, 0,3 mg au-delà de 30 kg (< 15 kg : à confirmer avec la prescription) ; adrénaline IM, solution NON diluée.", "Atteinte Voies aériennes / Respiration / Circulation après exposition = anaphylaxie jusqu'à preuve du contraire.", "Ni antihistaminique ni corticoïde ne remplacent l'adrénaline."]}}, {"k": "fiche", "part": "ess", "chap": "Essentiels : Hydratation", "title": "Besoins en eau et perfusion d'entretien", "d": {"groupe": "Hydratation", "bref": "Calculer les besoins hydriques de base, reconnaître et chiffrer une déshydratation, réhydrater, puis surveiller et régler correctement une perfusion pédiatrique.", "sections": [{"k": "list", "h": "BESOINS HYDRIQUES DE BASE (24 H)", "items": ["Règle des **100 / 50 / 20** : **100 ml/kg** pour les 10 premiers kg, **+ 50 ml/kg** pour les 10 kg suivants, **+ 20 ml/kg** par kg au-delà de 20 kg.", "Version horaire (**4-2-1**) : **4 ml/kg/h** (10 premiers kg), **2 ml/kg/h** (10 kg suivants), **1 ml/kg/h** par kg au-delà de 20 kg.", "Le volume réellement prescrit peut différer (restriction, pertes à compenser, apports oraux) : **toujours se référer à la prescription médicale**.", "Nourrisson nourri au lait : environ **160 ml/kg/j** (120 à 180) en 5 à 8 repas.", "Nouveau-né (moins de 28 jours) et prématuré : besoins et soluté **spécifiques**, fixés par le médecin ; ne jamais extrapoler la règle ci-dessus."]}, {"k": "list", "h": "SOLUTÉ D'ENTRETIEN : EAU, GLUCOSE, ÉLECTROLYTES", "items": ["Un soluté d'entretien apporte **eau + glucose + sodium (+ potassium)**. Le glucose évite l'hypoglycémie et la cétose (acétone) chez l'enfant à jeun.", "Soluté **isotonique** à privilégier (sodium 131 à 154 mmol/l, ex. NaCl 0,9 %) avec glucose et potassium, pour limiter le risque d'**hyponatrémie** ; solutés hypotoniques utilisés dans certains services : à confirmer avec la prescription.", "Exemples rencontrés en service : **½ G5 % + ½ NaCl 0,45 %** (ou « ½ salin ½ glucosé ») ; **Lactate de Ringer / LP** pour le remplissage initial ; **KCl** ajouté selon l'ionogramme (ex. 8 mEq).", "Ces solutés ½-½ sont hypotoniques : ce choix est à **confirmer avec la prescription et le service**.", "Ionogramme et glycémie au départ, puis au moins **toutes les 24 h** ; le médecin réévalue la prescription environ toutes les 12 h.", "Enfant « encombré » (ex. pneumologie) : le médecin peut **restreindre** le volume ; ne jamais le modifier soi-même."]}, {"k": "list", "h": "PERTES SUPPLÉMENTAIRES", "items": ["**Fièvre, transpiration, tachypnée, chaleur, diarrhée, vomissements** augmentent les besoins : l'enfant se déshydrate vite.", "Le supplément à perfuser n'est pas calculé par l'infirmier : **à confirmer avec la prescription** (le médecin adapte le volume).", "Diarrhée avec réhydratation orale : **10 ml/kg** de solution de réhydratation après chaque selle liquide ; vomissements : environ **2 ml/kg** par épisode."]}, {"k": "list", "h": "DÉSHYDRATATION : ÉVALUER", "items": ["**% de perte = (poids récent − poids actuel) / poids récent × 100.** Peser l'enfant à l'admission, puis tous les jours.", "**Avant 18 mois**, ajouter le poids non pris depuis la dernière pesée (≈ 30 à 35 g/j de 0 à 3 mois, 20 à 30 g/j de 3 à 6 mois, 15 à 20 g/j de 6 à 9 mois). Exemple : poids idéal 7,5 kg, poids actuel 6,5 kg, perte 1 kg = **13,3 %**.", "Ce qu'on **voit** : fontanelle déprimée, pli cutané paresseux, yeux cernés, muqueuses sèches, peu de larmes, soif, irritabilité ou apathie. Ce qu'on **mesure** : poids, diurèse, pouls, fréquence respiratoire, T°, TA.", "**Gravité / choc** : temps de recoloration > 2 s, marbrures, extrémités froides, pouls faibles, tachycardie puis bradycardie, hypotension, trouble de conscience, anurie : **urgence**.", "Seuils indicatifs, à confirmer avec le service : **légère ≈ 5 %** ; **modérée à grave ≈ 5-9 %** ; **sévère ≥ 10-15 %** (risque de choc, hospitalisation)."]}, {"k": "list", "h": "RÉHYDRATER : VOIE ORALE D'ABORD", "items": ["Première intention si l'enfant boit : **solution de réhydratation orale** (ORS, Soparyx, Gastrolyte), **par petites quantités rapprochées** (cuillère, seringue), même s'il vomit.", "Volume de réhydratation proposé : **50 à 100 ml/kg en 3 à 4 h** pour une déshydratation légère à modérée, puis compensation des pertes (10 ml/kg par selle) : à confirmer avec la prescription.", "**Poursuivre l'allaitement et l'alimentation** dès que possible ; ne pas mettre à jeun.", "Sonde nasogastrique (gavage de ORS) si l'enfant refuse de boire mais ne vomit pas de façon incoercible.", "**Perfusion** si refus ou échec de la voie orale, vomissements incoercibles, déshydratation grave, trouble de conscience ou choc : soluté isotonique et volume **selon prescription** (ex. remplissage initial de LP, puis perfusion d'entretien)."]}, {"k": "list", "h": "SURVEILLANCE D'UNE PERFUSION PÉDIATRIQUE", "items": ["Contrôler **à chaque passage** : identité de l'enfant, soluté et débit prescrits, pompe (alarmes, débit affiché), **tubulure sans coudure**, clamps ouverts, niveau de la burette et réserve de produit.", "**Point de ponction** : déballer et comparer à l'autre membre (rougeur, chaleur, gonflement, douleur, œdème). Pas de recherche de reflux sur voie périphérique : tester la perméabilité avec **au moins 2 ml de LP**. En cas de doute, ne pas injecter.", "Toutes les perfusions passent **sur pompe** ; le pansement du cathéter fin (22 à 26 G) n'est refait que s'il est décollé ou souillé. Limiter le volume de la burette à la quantité utile.", "Paramètres : T°, pouls, FR, TA, **poids**, diurèse, faciès, coloration, éveil.", "**Bilan entrées-sorties** : noter tout ce qui entre (perfusion, médicaments dilués, rinçages, lait, boissons) et tout ce qui sort (urines, selles, vomissements). Diurèse du nourrisson : peser les langes ou poser un urinocol (max 24 h) ; la **sonde vésicale** est un acte médical.", "**Diurèse normale : ≥ 2 ml/kg/h** (norme du service) ; en dessous : alerter (nouveau-né 1-2 ml/kg/h).", "Poids en hausse, œdème (paupières), dyspnée : **surcharge** (débit trop rapide ou élimination insuffisante). Poids en baisse, signes de déshydratation : débit trop lent.", "Risque d'**hyponatrémie** surtout avec un soluté hypotonique : prévenir si vomissements, céphalées, léthargie, irritabilité ou convulsions."]}, {"k": "list", "h": "CALCULER UN DÉBIT", "items": ["**Débit (ml/h) = volume (ml) / durée (h).** Exemple : 60 ml en 30 min = 120 ml/h ; en 1 h = 60 ml/h ; en 2 h = 30 ml/h.", "**Gouttes/min = débit (ml/h) × nombre de gouttes par ml / 60.** Avec une trousse de **20 gouttes/ml** : ml/h ÷ 3. Avec un **microgoutteur de 60 gouttes/ml** : gouttes/min = ml/h. Vérifier le facteur inscrit sur la trousse.", "Exemple : 50 ml/h = 16,7 gouttes/min (20 gtt/ml) ou 50 gouttes/min (60 gtt/ml).", "Médicament en burette : diluer dans **20 ml si < 18 mois**, **50 ml si > 18 mois**, injecter souvent en 30 min et prévoir **20 ml de rinçage**."]}, {"k": "table", "h": "EXEMPLES DE BESOINS D'ENTRETIEN (RÈGLE 100/50/20)", "cols": ["POIDS", "CALCUL SUR 24 H", "VOLUME / 24 H", "DÉBIT MOYEN (÷ 24)", "DÉBIT 4-2-1"], "rows": [["**8 kg**", "8 × 100", "800 ml", "33 ml/h", "8 × 4 = 32 ml/h"], ["**15 kg**", "1000 + (5 × 50)", "1250 ml", "52 ml/h", "40 + 10 = 50 ml/h"], ["**25 kg**", "1000 + 500 + (5 × 20)", "1600 ml", "67 ml/h", "40 + 20 + 5 = 65 ml/h"]]}], "alerte": ["Choc hypovolémique : temps de recoloration > 2 s, marbrures, pouls faibles, trouble de conscience, anurie. Prévenir immédiatement.", "Surcharge : prise de poids rapide, œdème des paupières, dyspnée. Vérifier le débit et la pompe, et prévenir.", "Hyponatrémie : vomissements, céphalées, léthargie ou convulsions sous perfusion. Prévenir, ne pas attendre.", "Avant 18 mois, oublier d'ajouter le poids non pris fait sous-estimer la déshydratation.", "Confondre ml/h (pompe) et gouttes/min, ou oublier de compter les rinçages et dilutions dans le bilan entrées-sorties."], "stage": ["Peser l'enfant à l'admission puis chaque jour, et calculer le % de perte avec le poids récent.", "Vérifier prescription, soluté, débit et programmation de la pompe, avec double contrôle du calcul.", "Déballer et inspecter le point de ponction à chaque soin ; tester la perméabilité avant toute injection.", "Tenir à jour la feuille d'alimentation et le bilan entrées-sorties ; mesurer la diurèse (langes pesés).", "Proposer la solution de réhydratation par petites quantités, à la cuillère ou à la seringue.", "Relever T°, pouls, FR, TA, éveil, et alerter l'infirmier(ère) dès qu'un signe de gravité apparaît.", "Rassurer l'enfant et les parents, et expliquer pourquoi on ne donne pas à boire sans limite à un enfant qui vomit."], "retenir": ["Entretien : 100 ml/kg (10 premiers kg), 50 ml/kg (10 suivants), 20 ml/kg au-delà ; horaire 4-2-1.", "% de déshydratation = (poids récent − poids actuel) / poids récent × 100, avec le poids non pris avant 18 mois.", "Diurèse normale : ≥ 2 ml/kg/h (norme du service ; en dessous : alerter ; nouveau-né 1-2 ml/kg/h) ; réhydratation orale en premier, 10 ml/kg après chaque selle liquide.", "Débit ml/h = volume / durée ; gouttes/min = ml/h × gtt/ml / 60."]}}, {"k": "fiche", "part": "ess", "chap": "Essentiels : Sécurité des soins", "title": "Médicaments : les 5 B en pédiatrie", "d": {"groupe": "Sécurité des soins", "bref": "Check-list de sécurité avant toute administration : bon patient, bon médicament, bonne dose, bonne voie, bon moment, avec les points propres à l'enfant (poids, petites doses, dilutions, refus).", "sections": [{"k": "list", "h": "BON PATIENT : IDENTITOVIGILANCE", "items": ["**Vérifier le bracelet d'identité** de l'enfant, qui doit être porté en permanence.", "Poser une **question ouverte** à l'enfant ou aux parents (« comment s'appelle l'enfant ? ») : ne jamais suggérer le nom.", "Comparer **nom, prénom et date de naissance** avec la prescription ; **jamais le numéro de chambre** (changements de lit, chambres doubles).", "L'enfant ne sait pas relever une erreur de traitement : la vérification repose entièrement sur l'infirmier(ère)."]}, {"k": "list", "h": "BON MÉDICAMENT", "items": ["Comparer **nom de la molécule, forme et dosage** du produit avec la prescription (déballer et comparer).", "Connaître le produit avant de le donner : action, effets indésirables possibles, dilution, mode d'administration, compatibilité, conservation.", "On n'est pas obligé de tout connaître, mais **on est obligé de se renseigner** : en cas de doute, ne pas administrer.", "Un même médicament existe en plusieurs dosages (suppositoires, sirops) : choisir la présentation adaptée.", "Vérifier les **allergies** connues avant toute première prise."]}, {"k": "list", "h": "BONNE DOSE : CALCUL AU POIDS", "items": ["La dose est calculée selon le **poids** (mg/kg), la surface corporelle, rarement l'âge ; elle est souvent très faible.", "Vérifier le **poids récent** (en kg) et recalculer soi-même : **dose = mg/kg × poids**, puis volume = dose ÷ concentration.", "Comparer la dose calculée à la **dose maximale** (par prise et par jour) ; un résultat qui sort de la fourchette habituelle = vérifier avant d'agir.", "Exemples : paracétamol **15 mg/kg/dose, max 4x/j** ; ibuprofène **10 mg/kg/dose, max 3x/j** ; diazépam rectal **0,5 mg/kg, max 10 mg**. Ce sont des doses exemples ; limites d'âge (ex. ibuprofène non recommandé avant 3 mois) et cas du nouveau-né : à confirmer avec la prescription.", "Adrénaline : **0,01 mg/kg**, ampoule 1 mg = 1 mL (1:1000). **Arrêt cardiaque** : voie IV/IO, 0,01 mg/kg = **0,1 mL/kg de la solution diluée à 1:10 000** (1 mL + 9 mL de NaCl 0,9 %). **Anaphylaxie** : voie IM, **0,01 mL/kg de la solution non diluée à 1 mg/mL** (voir fiche Anaphylaxie) : **ne pas confondre**.", "Distinguer **mg (quantité de produit) et mL (volume)**, et vérifier la concentration (mg/mL) ; un doute sur une virgule ou une unité = refaire le calcul.", "Un surdosage peut causer une intoxication rapide ; un sous-dosage rend le traitement inefficace."]}, {"k": "list", "h": "PRÉPARATION, DILUTION, DOUBLE CONTRÔLE", "items": ["**Double contrôle par une 2e personne** (calcul, dilution, débit) pour les médicaments à risque ou en cas de doute (selon le service : à confirmer).", "Diluer avec de petites quantités de solvant ; un sirop en poudre se prépare avec **exactement** la quantité d'eau indiquée sur le flacon ou la notice.", "Noter sur le flacon la **date de dilution** et la date limite de validité (souvent 8 jours pour un sirop) ; respecter frigo ou température ambiante ; bien homogénéiser les suspensions.", "Utiliser une **seringue adaptée** au volume (seringue de 1 mL si < 1 mL), plus précise que la cuillère ; étiqueter toute seringue préparée.", "Tenir compte des **espaces morts** (canule rectale : prévoir 0,4 à 0,6 mL en plus ; prolongateur et burette lors d'une IV)."]}, {"k": "list", "h": "BONNE VOIE : POINTS PROPRES À L'ENFANT", "items": ["**Orale** : sirop à la seringue ou pipette ; gouttes avec le compte-gouttes du flacon ; comprimés rarement avalés avant 7-8 ans (demander une autre forme, ou écraser/ouvrir dans un peu d'eau ou de confiture).", "Ne **jamais mélanger le médicament au biberon** ni le donner après le repas : l'enfant risque de refuser et on ne sait pas quelle quantité il prend ; donner en début de repas sauf indication contraire.", "**Rectale** : couper un suppositoire dans le sens de la longueur ; serrer les fesses un moment ; à éviter sauf vomissements incoercibles et absence de voie veineuse ; canule lubrifiée pour une injection intrarectale.", "**IM** peu utilisée (douloureuse, risque pour le nerf sciatique) ; volume max **1 mL** (grand nourrisson, jeune enfant) et **0,5 mL** (nouveau-né, petit) ; avant la marche : quadriceps ; deux soignants.", "**IV** : IVD (produit parfois redilué, ex. 2 mL dans 5 à 10 mL), burette ( **20 mL avant 18 mois, 50 mL après**, rinçage d'au moins l'espace mort de 20 mL au même débit), pousse-seringue.", "Certains produits ne s'injectent pas en IVD ou doivent couler en un temps donné : suivre la prescription et le protocole de l'unité.", "Collyre, gouttes auriculaires et nasales : réchauffer si conservés au frigo ; **gouttes nasales adaptées à l'âge** (certaines gouttes adulte contiennent de l'éphédrine, dangereuse chez l'enfant)."]}, {"k": "list", "h": "BON MOMENT", "items": ["Vérifier **l'heure prévue**, l'intervalle depuis la dernière prise et la dose maximale journalière.", "Contrôler la **compatibilité** avec les autres médicaments et la solution perfusée ; tester et rincer entre deux produits.", "Respecter la **durée d'administration** (ex. IV burette souvent 30 min, rinçage compris).", "Planifier selon les repas, les examens, les prises de sang et les péremptions des produits préparés."]}, {"k": "list", "h": "ENFANT QUI REFUSE OU VOMIT", "items": ["Expliquer sans mentir, laisser choisir quand c'est possible (côté, boisson), encourager ; **faire preuve de fermeté** si le traitement est nécessaire.", "Après un vomissement, **ne pas redonner automatiquement** la dose : noter l'heure et le délai après la prise, puis **demander au médecin** (selon le service : à confirmer).", "Si l'enfant refuse malgré tout : ne pas forcer, prévenir l'équipe et noter le refus."]}, {"k": "list", "h": "INFORMATION ET TRAÇABILITÉ", "items": ["Informer l'enfant (langage adapté à l'âge) et les parents : médicament, but, effets attendus.", "Surveiller l'enfant **pendant et après** : effets attendus et indésirables ; les petits ne savent pas exprimer leur ressenti.", "**Cocher le soin** et noter ses observations (heure, dose, voie, réaction, refus).", "Toute erreur, incident ou presque-erreur : prévenir immédiatement l'infirmier(ère) responsable et le médecin, puis **déclarer l'événement indésirable** selon la procédure de l'institution (selon le service : à confirmer)."]}, {"k": "table", "h": "CHOIX DE L'IM SELON L'ÂGE", "cols": ["SITUATION", "SITE / VOLUME / AIGUILLE"], "rows": [["**Avant la marche**", "Face antérieure du quadriceps, ligne médiane, mi-hauteur ; piquer perpendiculairement"], ["**Après acquisition de la marche**", "Dorso-fessier, cadran supéro-externe ; contre-indiqué si l'enfant ne marche plus depuis un an ou plus"], ["**Volume maximal**", "0,5 mL nouveau-né et petit ; 1 mL grand nourrisson et jeune enfant"], ["**Aiguille**", "25 G 1'' jusqu'à environ 3 mois ; 23 G 1'' petit enfant ; 22 G 1½'' enfant plus grand"]]}], "alerte": ["**Erreur ×10** (virgule décalée, mg confondus avec mL, mauvaise concentration) : refaire le calcul et le faire contrôler.", "Ne jamais se fier au numéro de chambre : identité = bracelet + question ouverte + date de naissance.", "Ne pas injecter en cas de doute (dose, dilution, point de ponction, compatibilité) ; pas de contrôle par reflux sur le cathéter d'un petit enfant : observer le site et tester au soluté.", "Gouttes nasales pour adulte (éphédrine) : convulsions, pâleur, choc possibles chez l'enfant.", "Ne pas redonner une dose après un vomissement sans avis médical (selon le service : à confirmer)."], "stage": ["Identifier l'enfant avec le bracelet et une question ouverte avant chaque médicament.", "Relire la prescription, vérifier le poids et recalculer la dose en mg/kg ; comparer à la dose maximale.", "Faire contrôler par un(e) collègue les calculs, dilutions et médicaments à risque (selon le service : à confirmer).", "Préparer avec la bonne seringue, étiqueter, dater les dilutions et purger avant d'injecter.", "Choisir la technique d'administration adaptée à l'âge, expliquer à l'enfant et aux parents.", "Surveiller les effets, cocher le soin et noter les observations.", "Signaler tout doute ou toute erreur immédiatement et participer à la déclaration."], "retenir": ["Bon patient (bracelet + nom, prénom, date de naissance), bon médicament, bonne dose, bonne voie, bon moment.", "Dose = mg/kg × poids ; toujours vérifier la dose max et la concentration (mg vs mL).", "Dilutions IV : burette 20 mL avant 18 mois, 50 mL après, avec rinçage.", "Un doute : ne pas administrer, demander."]}}, {"k": "fiche", "part": "ess", "chap": "Essentiels : Sécurité des soins", "title": "Hygiène des mains et précautions standard", "d": {"groupe": "Sécurité des soins", "bref": "Fiche de poche pour savoir quand et comment désinfecter ou laver les mains, quel équipement porter selon le soin, et quel isolement appliquer aux maladies infectieuses fréquentes en pédiatrie.", "sections": [{"k": "list", "h": "LES 5 INDICATIONS DE L'HYGIÈNE DES MAINS", "items": ["**1. Avant de toucher l'enfant** (entrée en chambre, avant un examen, un change, un biberon).", "**2. Avant un geste propre ou aseptique** (aspiration, perfusion, prélèvement, préparation de médicaments, soin de plaie ou de cordon).", "**3. Après un risque d'exposition à un liquide biologique** (selles, urines, vomi, sang, sécrétions) : aussi après retrait des gants.", "**4. Après avoir touché l'enfant.**", "**5. Après avoir touché l'environnement de l'enfant** (lit, barrières, table, jouets, matériel) même sans avoir touché l'enfant.", "Les gants ne remplacent jamais l'hygiène des mains : désinfecter avant de les mettre et immédiatement après les avoir retirés."]}, {"k": "list", "h": "FRICTION HYDRO-ALCOOLIQUE OU LAVAGE : LEQUEL CHOISIR", "items": ["**Friction hydro-alcoolique (SHA) = geste par défaut** quand les mains sont visiblement propres : plus rapide, plus efficace, mieux tolérée par la peau.", "**Durée de la friction : 20 à 30 secondes**, jusqu'à ce que les mains soient parfaitement sèches (ne pas essuyer, ne pas souffler).", "**Lavage à l'eau et au savon** : mains visiblement souillées ou mouillées de sang ou de liquides biologiques, après être allé aux toilettes, avant de manger.", "**Lavage obligatoire (la friction ne suffit pas)** en cas de gastro-entérite à Clostridium difficile ou norovirus : les spores résistent à l'alcool.", "**Durée du lavage : 40 à 60 secondes** : mouiller, savonner, frotter toutes les faces, rincer, sécher par tamponnement avec un essuie à usage unique, fermer le robinet avec l'essuie.", "Ne jamais enchaîner friction et lavage sans raison : ça abîme la peau. Les distributeurs de SHA sont devant et dans chaque chambre : s'en servir à chaque entrée et sortie."]}, {"k": "list", "h": "TECHNIQUE DE FRICTION (TOUTES LES FACES)", "items": ["Quantité suffisante dans le creux de la main pour couvrir toute la surface.", "Paume contre paume, puis dos de chaque main avec les doigts entrelacés.", "Paume contre paume doigts entrelacés, puis dos des doigts contre la paume opposée (doigts verrouillés).", "Frotter chaque pouce en rotation dans la paume opposée.", "Frotter le bout des doigts en rotation dans la paume opposée, puis les poignets.", "Zones souvent oubliées : **pouces, bouts des doigts, espaces entre les doigts, plis des poignets**."]}, {"k": "list", "h": "PRÉPARATION DE LA PEAU ET DE LA TENUE", "items": ["**Ongles courts, naturels et propres**, sans faux ongles ni résine.", "**Pas de vernis, pas de bijoux aux mains ni aux poignets** (bagues, bracelets, montre) : ils retiennent les germes et empêchent un bon nettoyage.", "Cheveux attachés, badge visible, pas de téléphone personnel dans la tenue.", "Plaie ou lésion de la main : la couvrir par un pansement imperméable et en parler à l'infirmier(ère) responsable.", "Soigner la peau (crème des mains hors du soin) : une peau abîmée est une porte d'entrée et un réservoir de germes."]}, {"k": "list", "h": "PRÉCAUTIONS STANDARD : POUR TOUS LES ENFANTS, TOUT LE TEMPS", "items": ["**Gants à usage unique** : dès qu'un contact avec sang, liquides biologiques, muqueuses ou peau lésée est possible (prélèvement, change, toilette intime, aspiration). Un soin = une paire ; changer entre deux enfants et entre deux gestes sur un même enfant.", "**Tablier ou surblouse** : si risque d'éclaboussure ou de contact avec les vêtements (change de selles liquides, vomissements, aspiration).", "**Masque chirurgical et lunettes ou visière** : si risque de projection au visage (aspiration, toux, vomissement, saignement).", "**Hygiène respiratoire** : se couvrir la bouche et le nez dans le coude ou un mouchoir à usage unique, le jeter, puis se désinfecter les mains ; apprendre ce geste à l'enfant et aux parents.", "**Piquants et tranchants** : ne jamais recapuchonner, ne jamais plier ni casser une aiguille, jeter immédiatement dans le **collecteur à aiguilles**, ne pas le remplir au-delà de la ligne de remplissage. Aucune aiguille n'entre dans la chambre d'un enfant.", "**Déchets** : tri selon les filières du service (déchets de soins vs déchets ménagers) ; sacs fermés, jamais tassés à la main.", "**Linge** : manipuler sans le secouer ni le serrer contre soi ; sac fermé dès la chambre ; linge souillé en sac spécifique.", "**Surfaces et matériel** : désinfecter entre chaque enfant ce qui est partagé (balance, thermomètre, stéthoscope, plan de change, baignoire) ; nettoyer tout produit biologique renversé avec gants et produit adapté."]}, {"k": "list", "h": "ACCIDENT D'EXPOSITION AU SANG (PIQÛRE, COUPURE, ÉCLABOUSSURE)", "items": ["**1. Ne pas faire saigner activement ni frotter** : laisser couler, rincer abondamment à l'eau et au savon pour une plaie ; rincer longuement à l'eau claire pour une muqueuse ou un œil.", "**2. Désinfecter** la plaie avec l'antiseptique du service (selon la procédure).", "**3. Prévenir immédiatement** l'infirmier(ère) responsable et la maître de stage / l'école.", "**4. Consulter sans attendre** (médecine du travail ou urgences selon l'heure) : évaluation du risque et décision d'une éventuelle prophylaxie, qui doit être débutée vite. Le délai exact est à confirmer avec le service.", "**5. Déclarer l'accident** par écrit (procédure de l'institution) ; l'enfant source peut faire l'objet d'un bilan sanguin avec l'accord des parents."]}, {"k": "list", "h": "PRÉCAUTIONS COMPLÉMENTAIRES : RAPPEL", "items": ["Elles s'ajoutent aux précautions standard, selon le mode de transmission. Une **affiche sur la porte** indique le type d'isolement et un **chariot** regroupe le matériel.", "**Contact (feuille verte)** : tablier + gants. Pour les infections transmises par les mains, selles et surfaces.", "**Gouttelettes (feuille rose)** : masque + tablier + gants. Pour les sécrétions respiratoires projetées à moins d'un mètre environ.", "**Aérien (feuille blanche)** : **masque FFP2** + tablier + gants. Pour les particules qui restent en suspension dans l'air.", "**Protecteur** : masque + tablier + gants. Pour protéger l'enfant fragile (immunodéprimé).", "Ordre d'habillage : hygiène des mains, tablier, masque, (lunettes), gants. Retrait : gants, tablier, hygiène des mains, lunettes, masque (FFP2 retiré **après** être sorti de la chambre, porte fermée), puis hygiène des mains.", "Chambre individuelle si possible ; matériel (thermomètre, stéthoscope) dédié à la chambre ; limiter les déplacements de l'enfant et lui mettre un masque s'il doit sortir (âge permettant)."]}, {"k": "list", "h": "APPLICATION EN PÉDIATRIE (SERVICE S 51)", "items": ["**Bronchiolite / VRS** : isolement **gouttelettes (feuille rose)** au service S 51 ; contact en plus selon d'autres recommandations : à confirmer avec le service ; lavage de nez, hygiène des mains rigoureuse avant et après chaque contact. Le virus survit sur les surfaces et les jouets.", "**Gastro-entérite** : isolement de **contact (feuille verte)** ; **lavage au savon** si Clostridium difficile ou norovirus ; surfaces et matelas à désinfecter, linge souillé en sac fermé.", "**Varicelle** : isolement **aérien (feuille blanche)** ; contagieuse jusqu'à ce que toutes les lésions soient en croûtes ; ne pas affecter une soignante enceinte ou non immunisée à cet enfant.", "**Tuberculose** : isolement **aérien (feuille blanche)** avec **masque FFP2** pour l'équipe ; l'enfant reste en chambre.", "**Rougeole** : isolement aérien (masque FFP2) ; ne pas entrer sans immunité contre la rougeole. Absente du livret : à confirmer avec le service.", "**Méningite** : isolement gouttelettes (feuille rose) dès la suspicion, sans attendre la confirmation ; à confirmer selon le germe.", "**Infection respiratoire** (laryngite, mucoviscidose, asthme surinfecté…) : gouttelettes selon le service.", "Enfant contagieux avec **éviction scolaire** : prévenir les parents des règles de retour en collectivité (voir prescription médicale)."]}, {"k": "list", "h": "INFORMATION À L'ENFANT, AUX PARENTS ET JEUX", "items": ["**Expliquer l'isolement** avec des mots simples : « on met un masque pour que les microbes restent dans la chambre ». Montrer le masque, le laisser le toucher, jouer avec un doudou « masqué ».", "**Apprendre aux parents** : frictionner les mains à chaque entrée et sortie, ne pas partager les couverts, ne pas aller dans la chambre d'un autre enfant, porter l'équipement demandé, tousser dans le coude.", "**Visites** : limiter, refuser toute personne malade (fièvre, rhume, gastro) ; frères et sœurs selon l'avis de l'équipe.", "**Apprendre à l'enfant** (selon l'âge) à se laver les mains avec une comptine ou une chanson de 20 à 30 secondes, avant de manger et après les toilettes.", "**Salle de jeux** : les enfants en isolement n'y vont pas. Jouets lavables à désinfecter après chaque usage ; jouets en tissu ou en peluche non lavables à éviter en chambre d'isolement.", "**Jouets partagés** : ne jamais passer un jouet d'une chambre à l'autre sans désinfection ; un jouet utilisé en isolement reste dans la chambre ; à la sortie, il est désinfecté ou éliminé selon le protocole du service."]}, {"k": "table", "h": "QUEL ISOLEMENT POUR QUELLE MALADIE (SERVICE S 51)", "cols": ["MALADIE", "ISOLEMENT", "ÉQUIPEMENT"], "rows": [["**Bronchiolite / VRS**", "Gouttelettes (feuille rose) au service S 51 ; contact en plus selon d'autres recommandations : à confirmer avec le service", "Masque, tablier, gants"], ["**Gastro-entérite**", "Contact (feuille verte)", "Tablier, gants (+ lavage au savon si C. difficile / norovirus)"], ["**Varicelle**", "Aérien (feuille blanche)", "Masque FFP2, tablier, gants"], ["**Tuberculose**", "Aérien (feuille blanche)", "Masque FFP2, tablier, gants"], ["**Rougeole**", "Aérien (à confirmer avec le service)", "Masque FFP2, tablier, gants"], ["**Méningite**", "Gouttelettes (feuille rose) ; à confirmer selon le germe", "Masque, tablier, gants"]]}, {"k": "table", "h": "FRICTION OU LAVAGE", "cols": ["SITUATION", "GESTE", "DURÉE"], "rows": [["**Mains visiblement propres**", "Friction hydro-alcoolique", "20 à 30 secondes"], ["**Mains souillées ou mouillées de sang / liquides**", "Lavage eau et savon", "40 à 60 secondes"], ["**Après toilettes, avant de manger**", "Lavage eau et savon", "40 à 60 secondes"], ["**Gastro-entérite à Clostridium difficile / norovirus**", "Lavage eau et savon", "40 à 60 secondes"]]}], "alerte": ["Les gants ne remplacent pas le lavage des mains : on se désinfecte avant de les mettre et après les avoir retirés.", "Une solution hydro-alcoolique ne détruit pas les spores : lavage obligatoire en cas de Clostridium difficile ou norovirus.", "Ne jamais recapuchonner une aiguille ; une piqûre = rincer, désinfecter, prévenir, consulter sans attendre.", "Varicelle, rougeole, tuberculose : ne pas entrer sans masque FFP2 ; soignante enceinte ou non immunisée : ne pas prendre en charge.", "Vernis, bijoux, montre, faux ongles : interdits en stage."], "stage": ["Frictionner les mains à chaque entrée et sortie de chambre et aux 5 moments clés.", "Vérifier la feuille de couleur sur la porte avant d'entrer et prendre le matériel du chariot d'isolement.", "Mettre l'équipement dans le bon ordre et le retirer avant de sortir de la chambre (FFP2 retiré dehors).", "Désinfecter le matériel partagé (thermomètre, stéthoscope, balance) entre deux enfants.", "Jeter les aiguilles dans le collecteur, jamais dans la chambre, et trier les déchets selon la filière.", "Expliquer à l'enfant et aux parents pourquoi on met le masque et comment se désinfecter les mains.", "En cas de doute sur un isolement, demander à l'infirmier(ère) plutôt qu'improviser."], "retenir": ["5 moments : avant contact, avant geste propre, après liquide biologique, après contact, après environnement.", "Friction 20 à 30 secondes ; lavage 40 à 60 secondes, obligatoire si mains souillées ou C. difficile / norovirus.", "Contact = tablier + gants ; gouttelettes = + masque ; aérien = FFP2.", "Piqûre : rincer, désinfecter, prévenir, consulter sans attendre."]}}, {"k": "fiche", "part": "normes", "chap": "Normes : Constantes vitales", "title": "Fréquence respiratoire par âge (/min, compter 1 min)", "d": {"groupe": "Constantes vitales", "bref": "Compter sur **1 minute complète**, enfant calme, en regardant le thorax et le ventre.", "tables": [{"t": null, "cols": ["Âge", "Valeur habituelle A", "Valeur habituelle B", "Valeur habituelle C (max)", "Au service S 51"], "rows": [["Naissance / < 1 mois", "30-50 (40)", "50", "60", "40-60"], ["Nourrisson", "30", "—", "40 à 6 mois", "1 mois-2 ans : 30-60"], ["1 an", "25 (1 à 5 ans)", "36", "36", "1 mois-2 ans : 30-60"], ["5 ans", "20 (5 à 10 ans)", "25", "25", "2-12 ans : 20-30"], ["10 ans", "15", "—", "—", "2-12 ans : 20-30"], ["Adolescent", "—", "18-22", "20 à 16 ans", "> 12 ans : 12-20"]]}], "blocks": [], "alerte": ["À confirmer avec le service (IR) : les séries habituelles diffèrent entre elles et avec le service. Au service S 51, ce sont les valeurs de la dernière colonne qui sont demandées. Autre valeur (médianes, pas des limites) : 44/min à la naissance, 26/min à 2 ans. Gravité : tachypnée > 60/min. Fièvre, sommeil, cris, effort modifient la FR."], "stage": ["Compter **avant** de toucher l'enfant : les pleurs accélèrent la FR", "Noter aussi les signes de lutte (tirage, ailes du nez, geignement)"], "retenir": ["Au S 51 : < 1 mois **40-60** ; 1 mois-2 ans **30-60** ; 2-12 ans **20-30** ; > 12 ans **12-20**", "Tachypnée **> 60/min** = gravité"]}}, {"k": "fiche", "part": "normes", "chap": "Normes : Constantes vitales", "title": "Fréquence cardiaque par âge (/min)", "d": {"groupe": "Constantes vitales", "bref": "La fréquence cardiaque est plus rapide chez le petit et diminue avec l'âge.", "tables": [{"t": null, "cols": ["Âge", "Valeur habituelle", "Au service S 51", "Autre valeur (médiane)"], "rows": [["Naissance / < 1 mois", "Nouveau-né plutôt 160 ; nourrisson 80-180", "120-160", "127 à la naissance ; max 145 à 1 mois"], ["1 mois - 2 ans", "Nourrisson 80-180", "100-160", "113 à 2 ans"], ["2 - 12 ans", "Enfant 60-160 (déjà tachycarde à 120)", "70-140", "—"], ["> 12 ans", "—", "60-100", "—"]]}], "blocks": [["FC : bradycardie et tachycardie", ["Bradycardie : **< 80** avant 2 ans ; **< 60** de 2 à 5 ans ; **< 50** dès 5 ans", "Tachycardie sinusale : variable, progressive, **< 200/min**, avec une cause", "Tachycardie supraventriculaire : fixe, brutale, **> 200/min**, sans cause", "Tachycardie « fixée » = trouble du rythme"]]], "alerte": ["À confirmer avec le service (IR) : valeurs différentes. Bradycardie (valeur habituelle) : **< 80** avant 2 ans ; **< 60** de 2 à 5 ans ; **< 50** dès 5 ans (plus basse chez les sportifs). Les médianes de la colonne « Autre valeur » ne sont pas des seuils."], "stage": ["Mesurer au repos et noter si l'enfant pleure, a de la fièvre ou vient de bouger"], "retenir": ["Au S 51 : < 1 mois **120-160** ; 1 mois-2 ans **100-160** ; 2-12 ans **70-140** ; > 12 ans **60-100**", "Tachycardie fixe, brutale, **> 200/min** = trouble du rythme"]}}, {"k": "fiche", "part": "normes", "chap": "Normes : Constantes vitales", "title": "Détresse respiratoire : repères chiffrés", "d": {"groupe": "Constantes vitales", "bref": "Reconnaître une détresse respiratoire, son origine (haute ou basse) et sa gravité.", "tables": [{"t": "Score de Silverman (nouveau-né)", "cols": ["Signe", "0", "1", "2"], "rows": [["Battement des ailes du nez", "Absent", "Modéré", "Intense"], ["Tirage intercostal", "Absent", "Modéré", "Intense"], ["Entonnoir xiphoïdien", "Absent", "Modéré", "Intense"], ["Geignement expiratoire", "Absent", "Audible au stéthoscope", "Audible à l'oreille"], ["Balancement thoraco-abdominal", "Absent (respiration synchrone)", "Thorax immobile", "Respiration paradoxale"]]}], "blocks": [["À connaître", ["Gravité : tachypnée **> 60/min**, tachycardie, cyanose, pâleur, sueurs, conscience altérée", "Haute : inspiratoire, stridor, tirage sus/sous-sternal, toux aboyante", "Basse : expiratoire, wheezing, grunting, tirage intercostal/sous-costal", "Asthme sévère : FC **> 120** (grand) ; **> 160** (petit)", "Tachypnée = 1er signe d'insuffisance cardiaque (surtout < 1 an)", "Nez : désobstruer (sérum physiologique, mouche-bébé) ; respiration nasale avant 4 mois", "Position proclive **30°** ; O2 si saturation basse"]]], "alerte": [], "stage": [], "retenir": ["Haute = **inspiratoire** (stridor, toux aboyante) ; basse = **expiratoire** (sifflements)", "Tachypnée > 60/min + signes de lutte : appeler", "Silverman : de 0 (normal) à 10 ; un score qui monte = aggravation"]}}, {"k": "fiche", "part": "normes", "chap": "Normes : Constantes vitales", "title": "Tension artérielle par âge (mmHg)", "d": {"groupe": "Constantes vitales", "bref": "Une bonne mesure dépend surtout de la **taille du brassard** et du **calme** de l'enfant.", "tables": [{"t": null, "cols": ["Âge", "Valeur habituelle : TA systolique normale", "Valeur habituelle : limite inférieure", "Au service S 51"], "rows": [["0 à 1 mois", "60", "50", "< 1 mois : 75/45"], ["1 à 12 mois", "80", "70", "1 mois-2 ans : 85/45"], ["1 à 10 ans", "90 + (2 × âge)", "70 + (2 × âge)", "2-12 ans : 110/60"], ["> 10 ans", "120", "90", "> 12 ans : 120/80"]]}], "blocks": [["HTA chez l'enfant", ["Tables selon sexe, taille, âge", "Limite : entre P97 et **+ 10 mmHg**", "Confirmée : **+ 10 à 30 mmHg** au-dessus du P97", "Menaçante : **> 30 mmHg**", "Confirmer sur **3 consultations** (sauf HTA sévère)", "Coarctation : comparer bras droit et un membre inférieur"]]], "alerte": ["À confirmer avec le service (IR) : valeurs différentes (au service S 51, systolique/diastolique). Brassard : **2/3 de la longueur du bras** ; trop étroit = TA surestimée. Enfant calme, 10 min de repos, appareil automatique, 3 prises."], "stage": [], "retenir": ["Au S 51 : < 1 mois **75/45** ; 1 mois-2 ans **85/45** ; 2-12 ans **110/60** ; > 12 ans **120/80**", "Brassard = **2/3 de
