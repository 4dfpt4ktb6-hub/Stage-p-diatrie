<style>
/* Concept : un syllabus relié. Une page à la fois, bandeau de couleur par partie, encadrés constants (Attention / En stage / À retenir). */
:root{
  --bg:#e9edf2; --paper:#ffffff; --ink:#1a2330; --muted:#586577; --line:#d6dce4; --soft:#f3f6f9;
  --c-service:#4a5c76; --c-normes:#9a6208; --c-patho:#0a6c75; --c-proc:#2b7a47; --c-drug:#5648bd;
  --alert:#a9231b; --alert-bg:#fdeceb; --stage-bg:#e5f3e8; --stage:#1f6b3a; --ret-bg:#fff2bf; --ret:#6b5300;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif; --sans:'Atkinson Hyperlegible',system-ui,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --paper:#161d26; --ink:#e7ecf2; --muted:#9aa7b8; --line:#2b3644; --soft:#1d2733;
  --c-service:#8ea3c2; --c-normes:#e0a53f; --c-patho:#4cc2cc; --c-proc:#6cc88a; --c-drug:#a69cff;
  --alert:#ff8f86; --alert-bg:#3a1d1c; --stage-bg:#17301f; --stage:#8fdcaa; --ret-bg:#3a3210; --ret:#f2d36b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --paper:#161d26; --ink:#e7ecf2; --muted:#9aa7b8; --line:#2b3644; --soft:#1d2733;
  --c-service:#8ea3c2; --c-normes:#e0a53f; --c-patho:#4cc2cc; --c-proc:#6cc88a; --c-drug:#a69cff;
  --alert:#ff8f86; --alert-bg:#3a1d1c; --stage-bg:#17301f; --stage:#8fdcaa; --ret-bg:#3a3210; --ret:#f2d36b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.app{min-height:100%;display:flex;flex-direction:column}
/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:.5rem;padding:.55rem 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.top .brand{font-family:var(--serif);font-weight:700;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.74rem;color:var(--muted)}
.ib{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:.4rem .7rem;font-size:.9rem;white-space:nowrap}
.ib:focus-visible,.nb:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--c-patho);outline-offset:2px}
/* feuille */
main{flex:1;padding:18px 16px 96px;display:flex;justify-content:center}
.sheet{width:100%;max-width:880px;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 0 var(--line),0 12px 30px -18px rgba(10,20,40,.35);overflow:hidden;--c:var(--c-patho)}
.sheet.p-service{--c:var(--c-service)}.sheet.p-normes{--c:var(--c-normes)}.sheet.p-patho{--c:var(--c-patho)}.sheet.p-proc{--c:var(--c-proc)}.sheet.p-drug{--c:var(--c-drug)}
.band{display:flex;justify-content:space-between;gap:1rem;padding:.55rem clamp(16px,4vw,36px);background:var(--c);color:#fff;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
[data-theme="dark"] .band{color:#0d1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .band{color:#0d1218}}
.body{padding:clamp(18px,4vw,34px) clamp(16px,4vw,36px) 20px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.55rem,4.6vw,2.15rem);line-height:1.15;margin:.1rem 0 .5rem;text-wrap:balance;color:var(--c)}
.lead{font-size:1.08rem;margin:.2rem 0 1.1rem;color:var(--ink)}
.kick{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1.1rem 1.8rem;margin-top:1rem}
.blk{min-width:0;margin-top:1rem}
.grid .blk{margin-top:0}
.blk h2{font-family:var(--sans);font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--c);margin:0 0 .35rem;padding-top:.5rem;border-top:2px solid var(--c)}
ul.l,ol.l{margin:0;padding-left:1.15rem}
ul.l li,ol.l li{margin:.28rem 0;padding-left:.15rem}
ul.l li::marker{color:var(--c)}
ol.l{counter-reset:s;list-style:none;padding-left:0}
ol.l li{counter-increment:s;position:relative;padding-left:2.2rem;margin:.45rem 0}
ol.l li::before{content:counter(s);position:absolute;left:0;top:.05rem;width:1.55rem;height:1.55rem;border-radius:50%;background:var(--c);color:#fff;font-size:.82rem;font-weight:700;display:grid;place-items:center}
[data-theme="dark"] ol.l li::before{color:#0d1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) ol.l li::before{color:#0d1218}}
ul.chk{list-style:none;padding-left:0}
ul.chk li{padding-left:1.5rem;position:relative}
ul.chk li::before{content:"";position:absolute;left:0;top:.38rem;width:.85rem;height:.85rem;border:2px solid var(--c);border-radius:3px}
.box{border-radius:8px;padding:.7rem 1rem .8rem;margin-top:1.1rem}
.box h2{margin:0 0 .3rem;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;border:0;padding:0;color:inherit}
.box ul.l li::marker{color:currentColor}
.alert{background:var(--alert-bg);color:var(--alert)}
.alert ul{color:var(--ink)}
.stage{background:var(--stage-bg);color:var(--stage)}
.stage ul{color:var(--ink)}
.ret{background:var(--ret-bg);color:var(--ret)}
.ret ul{color:var(--ink);font-weight:700}
.dose{background:var(--soft);border:1px solid var(--line)}
.dose h2{color:var(--c)}
dl.id{display:grid;grid-template-columns:max-content 1fr;gap:.3rem 1rem;margin:.9rem 0 .2rem;padding:.7rem 1rem;background:var(--soft);border:1px solid var(--line);border-radius:8px}
dl.id dt{font-weight:700;color:var(--c)}
dl.id dd{margin:0;min-width:0}
@media(max-width:520px){dl.id{grid-template-columns:1fr}dl.id dt{margin-top:.25rem}}
.tw{overflow-x:auto;margin-top:.8rem;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.95rem}
th,td{padding:.5rem .7rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--c);color:#fff;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
[data-theme="dark"] thead th{color:#0d1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) thead th{color:#0d1218}}
tbody tr:nth-child(even){background:var(--soft)}
tbody td:first-child{font-weight:700}
strong{font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem clamp(16px,4vw,36px);border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.done{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:.3rem .9rem;font-size:.85rem}
.done[aria-pressed="true"]{background:var(--stage-bg);color:var(--stage);border-color:var(--stage);font-weight:700}
/* sommaire / chapitres */
.toc h3{font-family:var(--serif);font-size:1.25rem;margin:1.4rem 0 .3rem;color:var(--c)}
.toc .ch{margin:.15rem 0 .6rem}
.toc a.row,.chap a.row{display:flex;align-items:baseline;gap:.6rem;padding:.38rem .3rem;border-bottom:1px dotted var(--line);text-decoration:none}
.toc a.row:hover,.chap a.row:hover{background:var(--soft)}
.row .t{flex:1;min-width:0}
.row .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.row .d{display:block;font-size:.85rem;color:var(--muted)}
.row .ok{color:var(--stage);font-weight:700}
.toc .chn{font-weight:700}
.chap h1{font-size:clamp(1.8rem,6vw,2.6rem)}
.cover{text-align:left;padding-block:clamp(26px,8vw,70px)}
.cover h1{font-size:clamp(2rem,7vw,3.3rem);color:var(--ink)}
.cover .sub{font-size:1.15rem;color:var(--muted);margin:.2rem 0 1.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.2rem 0}
.chip{border-radius:999px;padding:.25rem .8rem;color:#fff;font-size:.88rem;font-weight:700}
[data-theme="dark"] .chip{color:#0d1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:#0d1218}}
.btn{display:inline-block;margin:.3rem .4rem .3rem 0;padding:.6rem 1.1rem;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700}
.btn.o{background:transparent;color:var(--ink)}
/* barre du bas */
.bot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:.6rem;justify-content:center;align-items:center;padding:.55rem 16px calc(.55rem + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.nb{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:.5rem .9rem;font-weight:700;white-space:nowrap}
.nb:disabled{opacity:.35}
.pg{min-width:5.5rem;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
/* recherche */
.ov{position:fixed;inset:0;z-index:10;background:rgba(10,16,24,.55);display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px}
.pan{width:100%;max-width:680px;max-height:100%;overflow:auto;background:var(--paper);border-radius:10px;border:1px solid var(--line);padding:1rem}
.pan input{width:100%;padding:.7rem .9rem;font:inherit;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.pan .res a{display:block;padding:.55rem .3rem;border-bottom:1px solid var(--line);text-decoration:none}
.pan .res small{display:block;color:var(--muted)}
@media(prefers-reduced-motion:no-preference){.sheet{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
</head>

rie générale), Dr Hoyoux (infectiologie, drépanocytose, pédiatrie générale), Dr Depuis et Dr Léonard (pédiatrie générale)", "2 assistants pédiatres (6 mois) et des stagiaires médecins (1 mois)"]], ["Équipe soignante", ["Infirmière en chef : **Marie Delruelle**", "**18 infirmiers**, 2 aides-soignantes, 1 puéricultrice, 3 aides logistiques, 4 éducateurs"]]]}, {"k": "serv", "part": "service", "chap": "Le service S 51", "title": "Une journée au service", "lead": "Horaires types et répartition de l'équipe.", "blocks": [["Répartition de jour", ["3 infirmiers : **Bleu** (ch. 321-411), **Rouge** (ch. 111-152), **Vert** (ch. 171-212)", "Un éducateur et une assistante logistique", "De nuit : 2 infirmières"]], ["Matin", ["**6h30** rapport inter-équipe", "**7h30** début des soins · **8h** déjeuner des patients", "**9h** rapport médical · **9h30** tour de salle des médecins", "**11h30** second tour infirmier, tour de lit, dîner des enfants", "**14h** rapport inter-équipe"]], ["Après-midi", ["**14h** rapport inter-équipe · **15h** début des soins", "**18h** souper des patients", "**19h30** second tour infirmier", "**21h45** rapport inter-équipe"]], ["Nuit", ["**21h40** arrivée en salle · **21h45** rapport inter-équipe", "**22h** dossiers et plans de soins, nouvelles feuilles de traitement, cahier de biberonnerie, facturation de la pharmacie, admissions des urgences", "**0h** premier tour infirmier · **4h** second tour", "**6h30** rapport inter-équipe"]]]}, {"k": "serv", "part": "service", "chap": "Le service S 51", "title": "Ce qui est attendu de toi", "lead": "Tu es sous la responsabilité d'un infirmier de référence (IR). Sois acteur de ta formation.", "blocks": [["À l'arrivée", ["Lire la **farde de répartition**", "Un livret de stage t'est fourni : objectifs, évaluations journalières, entrevues hebdomadaires, calculs de dosage, feuille de cotation finale", "Accès au dossier informatisé : contacter le **7323** (encoder paramètres, plans de soins, transmissions écrites)"]], ["Apr  ; se mettre au niveau de l'enfant ; mots simples ; s'intéresser à ce qu'il aime", "Expliquer plus en détail aux parents ; ils font partie de la relation de soin", "Si tu ne sais pas : dire que tu es stagiaire et revenir avec la réponse", "Respecter le sommeil de l'enfant (siestes comprises) selon la priorité des soins"]], ["Objectifs de stage", ["Nursing global simple", "Répondre aux questions sur les traitements (indication, dosage, débit) et les préparer sous supervision ; maîtriser le **bilan hydrique**", "Prendre des initiatives dans la limite de tes compétences ; participer aux soins (distraction, matériel, préparation de l'enfant)", "**Dernière semaine** : prendre en charge le côté comme l'infirmier responsable, avec l'équipe à tes côtés", "Entrevues hebdomadaires avec un infirmier référent étudiant ; note finale mise par la chef de service"]]]}, {"k": "chapter", "part": "normes", "chap": "Normes et repères", "title": "Normes et repères", "items": [["Mesures et croissance", ""], ["Fréquence respiratoire par âge (/min, compter 1 min)", ""], ["Fréquence cardiaque par âge (/min)", ""], ["FC : bradycardie et tachycardie", ""], ["Détresse respiratoire : repères chiffrés", ""], ["Tension artérielle par âge (mmHg)", ""], ["HTA chez l'enfant", ""], ["Température : seuils et conduite", ""], ["Fièvre du nourrisson < 1 mois / 6 semaines", ""], ["Saturation et oxygène", ""], ["Diurèse, glycémie, hydratation", ""], ["Biologie pédiatrique", ""], ["Températures utiles", ""], ["Développement psychomoteur de 0 à 3 ans", ""], ["Repères de 3 à 5 ans", ""], ["Convulsions et neuro", ""], ["Termes selon l'âge", ""], ["Sommeil selon l'âge", ""], ["Biberons selon le poids", ""], ["Rythme du nourrisson", ""], ["Nouveau-né : adaptation et repères", ""], ["Score d'Apgar (1, 5, 10 min)", ""], ["Dentition, propreté, hospitalisation", ""], ["Doses de référence", ""], ["Calculs de dosage et dilution", ""], ["Règles d'administration", ""], ["Débit d'une nutrition entérale (60 ml)", ""], ["S x)", "Au service S 51"], "rows": [["Naissance / < 1 mois", "30-50 (40)", "50", "60", "40-60"], ["Nourrisson", "30", "—", "40 à 6 mois", "1 mois-2 ans : 30-60"], ["1 an", "25 (1 à 5 ans)", "36", "36", "1 mois-2 ans : 30-60"], ["5 ans", "20 (5 à 10 ans)", "25", "25", "2-12 ans : 20-30"], ["10 ans", "15", "—", "—", "2-12 ans : 20-30"], ["Adolescent", "—", "18-22", "20 à 16 ans", "> 12 ans : 12-20"]], "note": "À confirmer avec le service (IR) : les séries habituelles diffèrent entre elles et avec le service. Au service S 51, ce sont les valeurs de la dernière colonne qui sont demandées. Autre valeur (médianes, pas des limites) : 44/min à la naissance, 26/min à 2 ans. Gravité : tachypnée > 60/min. Fièvre, sommeil, cris, effort modifient la FR."}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Fréquence cardiaque par âge (/min)", "cols": ["Âge", "Valeur habituelle", "Au service S 51", "Autre valeur (médiane)"], "rows": [["Naissance / < 1 mois", "Nouveau-né plutôt 160 ; nourrisson 80-180", "120-160", "127 à la naissance ; max 145 à 1 mois"], ["1 mois - 2 ans", "Nourrisson 80-180", "100-160", "113 à 2 ans"], ["2 - 12 ans", "Enfant 60-160 (déjà tachycarde à 120)", "70-140", "—"], ["> 12 ans", "—", "60-100", "—"]], "note": "À confirmer avec le service (IR) : valeurs différentes. Bradycardie (valeur habituelle) : **< 80** avant 2 ans ; **< 60** de 2 à 5 ans ; **< 50** dès 5 ans (plus basse chez les sportifs). Les médianes de la colonne « Autre valeur » ne sont pas des seuils."}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "FC : bradycardie et tachycardie", "items": ["Bradycardie : **< 80** avant 2 ans ; **< 60** de 2 à 5 ans ; **< 50** dès 5 ans", "Tachycardie sinusale : variable, progressive, **< 200/min**, avec une cause", "Tachycardie supraventriculaire : fixe, brutale, **> 200/min**, sans cause", "Tachycardie « fixée » = trouble du rythme"], "alerte": []}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Détresse respiratoire : repères chiffrés", "items": ["Gravité : tachypnée **> 60/min**, tachycardie, cyanose, pâleur, sueurs, conscience altérée", "Haute : inspiratoire, stridor, tirage sus/sous-sternal, toux aboyante", "Basse : expiratoire, wheezing, grunting, tirage intercostal/sous-costal", "Asthme sévère : FC **> 120** (grand) ; **> 160** (petit)", "Tachypnée = 1er signe d'insuffisance cardiaque (surtout < 1 an)", "Nez : désobstruer (sérum physiologique, mouche-bébé) ; respiration nasale avant 4 mois", "Position proclive **30°** ; O2 si saturation basse"], "alerte": []}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Tension artérielle par âge (mmHg)", "cols": ["Âge", "Valeur habituelle : TA systolique normale", "Valeur habituelle : limite inférieure", "Au service S 51"], "rows": [["0 à 1 mois", "60", "50", "< 1 mois : 75/45"], ["1 à 12 mois", "80", "70", "1 mois-2 ans : 85/45"], ["1 à 10 ans", "90 + (2 × âge)", "70 + (2 × âge)", "2-12 ans : 110/60"], ["> 10 ans", "120", "90", "> 12 ans : 120/80"]], "note": "À confirmer avec le service (IR) : valeurs différentes (au service S 51, systolique/diastolique). Brassard : **2/3 de la longueur du bras** ; trop étroit = TA surestimée. Enfant calme, 10 min de repos, appareil automatique, 3 prises."}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "HTA chez l'enfant", "items": ["Tables selon sexe, taille, âge", "Limite : entre P97 et **+ 10 mmHg**", "Confirmée : **+ 10 à 30 mmHg** au-dessus du P97", "Menaçante : **> 30 mmHg**", "Confirmer sur **3 consultations** (sauf HTA sévère)", "Coarctation : comparer bras droit et un membre inférieur"], "alerte": []}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Température : seuils et conduite", "cols": ["Situation", "Valeur habituelle", "Au service S 51"], "rows": [["Seuil à signaler", "Hyperthermie **> 38 °C**", "Signaler immédiatement **> 37,8 °C**"], ["Entre 38 et 38,5 °C", "Moyens physiques (découvrir, aérer sans courant d'air, hydrater, traiter la cause)", "Moyens non médicamenteux ; si > 38 °C : antipyrétique + hémoculture si nécessaire"], ["> 38,5 °C", "Moyens physiques + surveillance étroite (courbe) + antipyrétique prescrit", "Antipyrétique (dès > 38 °C)"], ["Recontrôle", "—", "**30 min** après la 1re prise ; **1 h** après antipyrétique (d'office)"], ["Hypothermie", "Température intra-rectale", "—"]], "note": "À confirmer avec le service (IR) : seuils différents (37,8 / 38 / 38,5 °C)."}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Fièvre du nourrisson < 1 mois / 6 semaines", "items": ["Jusqu'à 1 mois (au service S 51) : un seul pic **≥ 38 °C** = bilan complet probable", "Bilan : biologie, hémoculture, RUSUCU, PL, aspiration nasopharyngée", "Hospitalisation d'emblée **48 h**", "Triple antibiothérapie : **Clamoxyl, Céfotaxim, Amukin** jusqu'aux cultures", "Fièvre < 1 mois : **toujours hospitalisé** ; < 3 mois : bilan aux urgences", "Fièvre + purpura = urgence (septicémie, méningite)"], "alerte": ["⚠ Seuil et durée de prise en charge : valeur à confirmer avec la prescription / le service (IR)."]}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Saturation et oxygène", "items": ["Signaler toute saturation **< 92 %** (au service S 51)", "Oxygène si **< 92 %** ; objectif **≥ 92 %** (au service S 51), sauf certaines pathologies", "Bronchiolite : viser **≥ 93 %**", "Asthme : **> 95 %** légère ; **90-95 %** modérée ; **< 90 %** sévère ; O2 si **< 92-93 %**", "Lunettes nasales : 3 tailles pédiatriques + 1 adulte ; **max 3 l/min** (irritant) ; humidifier (Aquapack)", "Signes de gravité : cyanose centrale visible si sat **< 80 %** ; recoloration **> 2 s**"], "alerte": ["⚠ Seuil **92 %** (au service S 51) ou **93 %** (valeur habituelle) : valeur à viser à confirmer avec la prescription / le service."]}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Diurèse, glycémie, hydratation", "items": ["**Diurèse** : **1 à 2 ml/kg/h** (valeur habituelle) ; normale si **≥ 2 ml/kg/h** (au service S 51)", "1re miction dans les **12-24 h** ; urines jaune pâle, limpides, pH 6", "**Glycémie** au service S 51 : **70-140 mg/dl** à jeun ; **70-180 mg/dl** après le repas", "Convulsion : toujours contrôler température et glycémie (dextro)", "**Déshydratation** : **5 %** légère/modérée ; **10 %** grave ; **15 %** sévère (choc)", "Calcul : (poids récent − poids actuel) ÷ poids récent × 100", "Avant 18 mois : ajouter le poids non pris à la perte", "Exemple : 7,2 kg → 6,5 kg + 300 g non pris = 1 kg sur 7,5 kg = **13,3 %**", "Signes : fontanelles déprimées, pli cutané, yeux cernés, muqueuses sèches, peu de larmes", "Signes de choc : tachycardie, recoloration > 2 s, marbrures, pouls faibles, conscience altérée", "Lait : **160 ml/kg/jour** (120-180)", "Règle d'Appert : poids (g) ÷ 10 + 250 = ml de lait/jour (4 kg → 650 ml)", "Diversification : toujours **500 ml** de lait/jour"], "alerte": ["⚠ Diurèse : **1 à 2 ml/kg/h** ou **≥ 2 ml/kg/h** (au service S 51) : valeur à confirmer avec la prescription / le service.", "⚠ Seuils de déshydratation différents (5 / 10 / 15 %) : classification à confirmer avec le service (IR)."]}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Biologie pédiatrique", "cols": ["Paramètre", "Valeur"], "rows": [["Hb naissance", "14,5 à 21,5 g/dl"], ["Hb 2 semaines", "13,4 à 19,8"], ["Hb 2 mois", "9,4 à 13,0"], ["Hb 1 an", "11,3 à 14,1"], ["Hb 2-6 ans", "11,5 à 13,5"], ["Hb 6-12 ans", "11,5 à 15,5"], ["Hb 12-18 ans", "Garçon 13,0-16,0 ; fille 12,0-16,0"], ["Neutropénie", "PNN **< 1 500/mm³** après 1 an ; **< 1 000** de 2 à 12 mois ; risque important **< 500**"], ["Plaquettes", "**150 000-450 000/mm³** ; risque hémorragique **< 50 000** ; sévère **< 10 000**"], ["Bilirubine nouveau-né", "0,2-1,4 mg/ml ; ictère visible > 5 mg/ml"]], "note": "L'unité de la bilirubine semble erronée : à confirmer avec l'enseignante."}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Températures utiles", "cols": ["Situation", "Valeur"], "rows": [["Pièce de vie / chambre", "**18-20 °C** (humidité 45-60 %)"], ["Pièce du bain", "**22 °C**"], ["Eau du bain", "**36,6-37 °C**"], ["Salle de naissance", "**24 °C**"], ["Lavement", "**37 °C**"], ["Brûlure", "Refroidir **20 min**, à **20 cm**, à **20 °C**, avec antalgique ; 1 % de surface = la main de l'enfant"]], "note": ""}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Développement psychomoteur de 0 à 3 ans", "cols": ["Âge", "Motricité", "Préhension", "Langage", "Compréhension"], "rows": [["0-1 mois", "Hypertonie des membres, hypotonie axiale ; ventral : position fœtale", "Grasping très présent", "Attentif aux sons", "—"], ["2 mois", "Tient la tête un instant ; ventral : avant-bras, tête à 45°", "Grasping plus discret", "Vocalises (E, A)", "Sourire social"], ["3 mois", "Assis : tête droite, nuque ferme ; ventral : tête 45-90°", "Grasping disparu ; retient un hochet", "Gazouillis, cris de plaisir", "—"], ["4 mois", "Tient sa tête ; roule dos-côté ; ventral : coudes, tête 90°", "Mains au centre, atteint les objets", "Rit aux éclats", "Enlève une serviette sur son visage"], ["5 mois", "Pédalage ; « fait l'avion » ; essaie ventre-dos", "Préhension cubito-palmaire, objets à la bouche", "« Agueu »", "Sourit au miroir"], ["6 mois", "Assis en trépied ; saisit ses pieds ; dos-ventre ; stade du sauteur", "Préhension globale, tient 2 cubes", "Lallations", "Permanence de l'objet"], ["7 mois", "Assis : parachutiste ; pieds à la bouche", "Début pince inférieure", "ba, da, ka", "Imite, répond à son prénom"], ["8 mois", "Assis seul ; « fait l'ours » ; retournements", "Pince inférieure, index délié", "dada, baba", "Comprend « non » ; cherche jouets jetés ; angoisse du 8e mois"], ["9 mois", "Pivote assis ; rampe ; debout aux meubles", "Pince supérieure", "papa-mama non différenciés", "Notion d'outil"], ["10 mois", "Quatre pattes ; chevalier servant", "Pince supérieure fine", "papa-maman différenciés", "« Au revoir », « bravo »"], ["11-12 mois", "Premiers pas, marche le long des meubles ; marche instable à 12 mois", "Pointe l'index", "Mots-phrases, 2 mots", "Emboîte, comprend phrases simples"], ["15 mois", "Marche seul ; escalier à 4 pattes", "Tient sa cuillère, gribouille", "4-6 mots", "Demande en pointant ; tour de 2 cubes"], ["18 mois", "Escaliers à la rampe ; début de course ; saut 2 pieds", "Lance une balle, mange seul", "7-10 mots", "Désigne 1-2 images, 2-3 parties du corps"], ["2 ans", "Escaliers sans alterner ; court vite ; tape dans un ballon", "Dévisse un couvercle", "Phrases, « je-moi-tu »", "Compte jusqu'à 3-4 ; propreté de jour (18-24 mois)"], ["3 ans", "Escaliers en alternant ; saute sur un pied ; tricycle", "Bonhomme têtard, croix, s'habille seul", "Questions « pourquoi ? »", "Compte jusqu'à 10 ; nomme 8 images"]], "note": "Âges indicatifs, ordre identique pour tous : de la tête aux pieds, du centre vers la périphérie. Quelques acquisitions sont placées plus tard dans le tableau suivant : à confirmer avec l'enseignante."}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Repères de 3 à 5 ans", "cols": ["Âge", "Repères"], "rows": [["3 ans", "Se calme en < 10 min après le départ du parent ; conversation 2 échanges ; pose des questions ; dit son prénom ; dessine un cercle ; enfile des perles ; utilise une fourchette"], ["4 ans", "Jeu symbolique ; phrases d'au moins 4 mots ; nomme des couleurs ; dessine une personne (3 parties) ; attrape un gros ballon ; déboutonne"], ["5 ans", "Respecte les règles, attend son tour ; raconte une histoire ; compte jusqu'à 10 ; attention 5-10 min ; boutonne ; saute à cloche-pied"]], "note": "Différences avec le tableau précédent : compter jusqu'à 10 = 3 ans ou 5 ans ; bonhomme = 3 ans ou 4 ans ; saut sur un pied = 3 ans ou 5 ans. À confirmer avec le service (IR) : quel âge utiliser."}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Convulsions et neuro", "items": ["Fébrile simple : **6 mois-5 ans**, **< 5 min**, généralisée, sans déficit", "Un critère manque = complexe", "Urgence : Valium IR, Temesta intra-buccal, Dormicum intra-nasal", "AVPU : Alerte, Verbale, Pain, Unresponsive", "Mydriase = HTIC", "Méningite nourrisson : irritabilité, hypotonie, fontanelle bombante"], "alerte": []}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Termes selon l'âge", "cols": ["Terme", "Âge"], "rows": [["Nouveau-né", "0 à 28 jours"], ["Nourrisson", "28 jours à 1 an"], ["Trottineur", "1 à 3 ans"], ["Préscolaire", "3 à 6 ans"], ["Scolaire", "dès 6 ans"], ["Adolescent", "dès 12 ans"]], "note": ""}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Sommeil selon l'âge", "cols": ["Âge", "Durée"], "rows": [["Nouveau-né", "20 h"], ["1 an", "15 h"], ["3-4 ans", "12 h"], ["5-11 ans", "9 à 13 h"], ["Adolescent", "12 à 14 h"], ["Adulte", "8 à 10 h"]], "note": "Le 12-14 h de l'adolescent est supérieur à celui des 5-11 ans : à confirmer avec l'enseignante."}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Biberons selon le poids", "cols": ["Poids", "Âge", "Eau/biberon", "Mesurettes", "Biberons/24 h"], "rows": [["3,3 kg", "0-1 mois", "90 ml", "3", "6"], ["4,2 kg", "1-2 mois", "120 ml", "4", "6"], ["5 kg", "2-3 mois", "150 ml", "5", "5"], ["5,6 kg", "3-4 mois", "180 ml", "6", "5"], ["6,3 kg", "4-5 mois", "210 ml", "7", "4"], ["6,9 kg", "5-6 mois", "240 ml", "8", "4"]], "note": "1 mesurette rase pour 30 ml d'eau. Lait total : 160 ml/kg/jour (120-180)."}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Rythme du nourrisson", "items": ["Repas toutes les **3-4 h** ; **6 repas** jusqu'à 2 mois, puis **5**, puis **4**", "Tétée : **90 %** des besoins en 5 min ; 15 min par sein suffisent", "Selles quotidiennes au lait artificiel", "Poids : **+ 150-200 g/semaine** ou **30-35 g/j**", "Sommeil : cycles de **1 h 30** ; jour/nuit distingués vers **2-3 mois**", "Couchage : dos, matelas ferme, sans oreiller, sac de couchage, chambre 18-20 °C", "Chambre parentale jusqu'à **6 mois**", "Toilette 1 fois/jour ; au service S 51, pesée quotidienne des < 2 ans", "Diversification dès **4-6 mois** (ou **5-6 mois**) ; pas de miel avant **1 an**", "Prématuré : aliments 1 mois plus tard", "Respiration nasale avant **4 mois** (ou jusqu'à environ **6 mois**)"], "alerte": ["⚠ Diversification **4-6 mois** ou **5-6 mois** ; prise de poids ; respiration nasale avant **4 mois** ou jusqu'à **6 mois** : valeur à confirmer avec la prescription / le service (IR)."]}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Nouveau-né : adaptation et repères", "items": ["Respiration : nasale, abdominale, **30-50/min**, régulière après 1 min", "Cri vigoureux ; **gémissement = souffrance**", "Thermolabile : sécher, couvrir, peau à peau, bonnet, pièce **24 °C**", "Méconium dans les **24-48 h** ; selles de transition > J3 ; selles de lait > J5", "1re miction dans les **12-24 h**", "Cordon : clampé à 3 cm, tombe entre **J5 et J10**", "Fontanelle antérieure : se ferme à **12-18 mois** ; postérieure vers **2 mois**", "Fontanelle bombante : jamais banale sans bilan", "Ictère physiologique : pic **J3-J4**, normal vers **J10** ; photothérapie"], "alerte": []}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Score d'Apgar (1, 5, 10 min)", "cols": ["Critère", "0", "1", "2"], "rows": [["Fréquence cardiaque", "Nulle", "< 100", "> 100"], ["Respiration", "Absente", "Lente", "Vigoureuse"], ["Tonus", "Nul", "Faible", "Fort"], ["Réactivité", "Nulle", "Grimace", "Vive (cri, toux)"], ["Coloration", "Pâle/cyanosée", "Cyanose localisée", "Rose"]], "note": "Parfaitement adapté = 10/10."}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Dentition, propreté, hospitalisation", "items": ["Incisives **6-12 mois** ; ~**20 dents** à 3 ans", "Brossage dès **1 an** ; aide jusqu'à 5 ans ; brosse  = 5 mg = 5 ml (dilution 1 mg/ml)", "Adrénaline : 10 kg × 0,1 ml/kg = 1 ml (1/10 000)", "Augmentin IV : dose **< 500 mg** : IV directe lente (LP jusqu'à 20 ml) ; **> 500 mg** : burette 30 min", "Éliot 12 mois 350 mg : IV directe lente ; Lou 6 ans 850 mg : burette 30 min", "Durée IV burette = administration + rinçage", "Biberon : 90 ml + 3 mesurettes = 99 ml"], "alerte": ["⚠ Erreur de calcul = surdosage vite : toujours vérifier avec l'IR. Interdit de préparer ou d'administrer sans surveillance de l'IR."]}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Règles d'administration", "items": ["Identifier l'enfant : bracelet, questions ouvertes", "Suivre la prescription et les protocoles de l'unité", "Vérifier compatibilité, dilution, conservation", "Sirops : seringue graduée ; poudre à diluer : noter la date de dilution, souvent **8 jours**", "Gouttes : compte-gouttes du flacon", "Comprimés rarement avalés avant **7-8 ans** ; donner en début de repas, pas dans le biberon", "Suppositoire : couper dans le sens de la longueur ; fesses serrées", "Gouttes auriculaires : < 3 ans pavillon vers le bas et l'arrière ; > 3 ans vers le haut et l'arrière", "Gouttes nasales adaptées à l'âge (éphédrine = danger)", "IM : max **1 ml** (grand nourrisson, jeune enfant) ; **0,5 ml** (nouveau-né, petit)", "IM aiguille : 25 G 1\" (≤ 3 mois) ; 23 G 1\" (petit) ; 22 G 1½\" (plus grand)", "IM site : quadriceps avant la marche ; dorso-fessier après", "IV burette : diluer dans **20 ml** (< 18 mois) ; **50 ml** (> 18 mois) ; rincer ≥ 20 ml", "IVD : redilution possible (2 ml dans 5-10 ml de LP)", "Avant injection : purger, étiqueter, rincer au LP ; après : rincer (sauf restriction hydrique)", "Pompe pour toutes les perfusions ; KT **22 G à 26 G**", "Pas de reflux sauf voie centrale : tester avec ≥ **2 ml** de LP", "Surveiller site, débit, circuit, état général", "Complications : infiltration, thrombophlébite, surcharge, embolie gazeuse, allergie"], "alerte": ["⚠ Ne pas injecter en cas de doute."]}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Débit d'une nutrition entérale (60 ml)", "cols": ["Durée", "Débit"], "rows": [["15 min", "240 ml/h"], ["20 min", "180 ml/h"], ["30 min", "120 ml/h"], ["1 h", "60 ml/h"], ["1 h 30", "40 ml/h"], ["2 h", "30 ml/h"], ["3 h", "20 ml/h"]], "note": "Débit = volume ÷ durée."}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Sonde, biberon, inhalation", "items": ["Sonde : vérifier position + résidu avant chaque nutrition", "Résidu : on tolère en général **la moitié** de la quantité", "Médicaments écrasés dans **5-10 ml** d'eau, avant le lait ; seringues mauves", "Biberon : eau d'abord, puis poudre ; ne pas secouer ; tester au poignet", "Validité du biberon prêt : **1 h** ; eau ouverte : **24 h** au frigo", "Complément : 30 ml d'eau + 1 mesurette ; jamais de poudre en plus", "Inhalation < 3 ans : chambre + masque ; 3-6 ans : chambre + embout ; > 6 ans : chambre ou poudre sèche", "Nébuliseur en dernier recours : dépôt **2-10 %** (chambre 20-40 %)", "Lavement : sonde 8, 10 ou 12 ; sérum isotonique **37 °C**", "Volume du lavement : nourrisson 150-200 ml ; trottineur 250-300 ml ; scolaire 300-500 ml ; ado 500-1 000 ml"], "alerte": []}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Isolements : équipement et feuilles", "cols": ["Isolement", "Équipement", "Feuille", "Exemples"], "rows": [["Contact", "Tablier, gants", "Verte", "Gastro-entérite"], ["Gouttelettes", "Masque, tablier, gants", "Rose", "Bronchiolite, bronchopneumonie, asthme, mucoviscidose, méningite"], ["Aérien", "Masque FFP2, tablier, gants", "Blanche", "Tuberculose, varicelle"], ["Protecteur", "Masque, tablier, gants", "—", "—"]], "note": "Affiches sur les portes et chariot de matériel. En cas de doute, demander à l'infirmier."}, {"k": "table", "part": "normes", "chap": "Normes et repères", "title": "Échelles de douleur par âge", "cols": ["Âge / situation", "Échelle ou moyen"], "rows": [["0 à 4-6 ans", "Hétéro-évaluation : **EVENDOL**"], ["Enfant qui comprend", "Auto-évaluation : **EVA** (échelle visuelle analogique) ou **EN** (numérique)"], ["Échelle des 6 visages", "Évaluation de la douleur"], ["Avant un soin", "**Glucose 30 %** sur la langue (Babycalmine avant 4 mois), **EMLA**, **MEOPA** (50 % O2 / 50 % protoxyde d'azote)"], ["Non médicamenteux", "Distraction, jeux, chansons, vidéos, doudou/tétine, histoires, présence des parents"], ["Réévaluation", "**30 min** après une analgésie"]], "note": "La douleur est un paramètre : évaluation régulière."}, {"k": "list", "part": "normes", "chap": "Normes et repères", "title": "Rappels du service S 51", "items": ["Présenter les paramètres à l'IR ; signaler tout de suite les anormaux", "Température **> 37,8 °C** : à signaler", "Saturation **< 92 %** : à signaler", "Diurèse **≥ 2 ml/kg/h**", "Glycémie **70-140** à jeun", "Lait ouvert : boîte < 1 mois", "Varicelle : **pas de Nurofen** (risque de fascite nécrosante)", "Max **3 soignants** dans la salle de soin"], "alerte": ["⚠ Au service S 51, ces valeurs sont celles demandées : toute différence avec les valeurs habituelles est à confirmer avec le service (IR)."]}, {"k": "chapter", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Pathologies : Respiratoire", "items": [["Bronchiolite", "Infection virale des voies respiratoires inférieures du **nourrisson de moins de 2 ans**, avec œdème et obstruction des bronches distales."], ["Bronchite et bronchite spastique", "Atteinte bronchique avec toux ; la bronchite spastique = **sifflements (wheezing) récidivants** du jeune enfant de 0 à 4 ans, souvent viraux."], ["Bronchopneumonie et pneumonie", "Atteinte **infectieuse et inflammatoire** des poumons (bronchioles et alvéoles), avec liquide dans le parenchyme ; due à une bactérie, un virus ou un mycoplasme."], ["Laryngite (spasmodique aiguë et croup)", "Maladie **virale** avec inflammation du larynx et des cordes vocales, donnant une **toux aboyante** et un **stridor inspiratoire**."], ["Asthme", "Maladie **inflammatoire chronique** des voies aériennes avec crises : dyspnée, oppression, sifflements, toux ; obstruction variable et hyperréactivité bronchique."], ["Mucoviscidose", "Maladie **génétique héréditaire** (autosomique récessive, gène CFTR) : mucus épais et collant, atteinte respiratoire, digestive et génitale."], ["Tuberculose", "Maladie infectieuse **très contagieuse** due au bacille de Koch (Mycobacterium tuberculosis), transmise par gouttelettes en suspension dans l'air."], ["Épanchement pleural (parapneumonique et empyème)", "Épanchement pleural **exsudatif** associé à une infection pulmonaire du même côté, le plus souvent une pneumonie."], ["Coqueluche", "Infection due à Bordetella pertussis, dangereuse chez le nourrisson surtout non vacciné."], ["Inhalation de corps étranger et pneumothorax", "Corps étranger inhalé dans les voies aériennes ; pneumothorax = air dans l'espace pleural."]], "sub": "Définition, signes, traitement, rôle infirmier"}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Bronchiolite", "d": {"id": "p2-bronchiolite", "titre": "Bronchiolite", "groupe": "Respiratoire", "bref": "Infection virale des voies respiratoires inférieures du **nourrisson de moins de 2 ans**, avec œdème et obstruction des bronches distales.", "signes": ["Début : toux, congestion, rhinorrhée, avec ou sans **fièvre**", "Toux **quinteuse**, auscultation « typique »", "Ensuite : **polypnée**, **cyanose** des lèvres et des ongles", "Geignement, battements des ailes du nez, tirage intercostal, respiration abdominale", "Sibilants diffus aux deux temps respiratoires", "Manque d'appétit, difficultés à s'alimenter, perte de poids", "Vomissements glaireux sur quinte de toux, selles glaireuses", "FR normale : < 1 mois **40 à 60/min** ; 1 mois à 2 ans **30 à 60/min**"], "alerte": ["**Cyanose**, détresse respiratoire, apnée : signaler tout de suite", "Signaler toute **saturation < 92 %** et toute **T° > 37,8 °C**", "⚠ Seuil d'O2 : débuter sous **92 %** et viser ≥ **92 %** au service S 51 ; valeur habituelle : saturation ≥ 93 %, ou O2 sous 92 % en air ambiant. À confirmer avec la prescription / le service", "⚠ Âge : « moins de 2 ans » au service S 51 ; « 2 ans ou moins » valeur habituelle (écart minime)", "⚠ Gouttes nasales (Nesivine) utilisées au service S 51 ; les vasoconstricteurs nasaux sont déconseillés chez l'enfant : seulement sur prescription, demander à l'infirmier(e) de référence"], "causes": ["Origine **virale** : **VRS** (cause principale, jusqu'à 2/3 des cas)", "Autres : métapneumovirus, parainfluenza 3, adénovirus, bocavirus, coronavirus, entérovirus, influenza, rougeole, rhinovirus", "Facteur favorisant : **crèche** ; facteur aggravant : **tabagisme passif**", "Chez le petit : calibre étroit, débris cellulaires et mucus obstruent facilement"], "complications": ["Aiguës : aspiration, insuffisance respiratoire, **apnée**, surinfection bactérienne, décès", "Tardives : wheezing récidivant, bronchiolite oblitérante"], "examens": ["Diagnostic **clinique** (histoire + signes)", "**Saturation** : aide à décider O2 et hospitalisation", "Radio du thorax en général non recommandée (images non spécifiques)", "Tests viraux rapides sur prélèvement nasopharyngé", "Diagnostic différentiel : coqueluche"], "traitement": ["**!! NEZ !!** : lavage au sérum physiologique, aspiration naso-pharyngée si besoin", "Gouttes nasales selon prescription (Nesivine, Néobacitracine)", "**O2** si sat < 92 % : lunettes nasales, **max 3 l/min**, humidifié (Aquapack®)", "Assistance ventilatoire si besoin", "Repas fractionnés (petites quantités, plus fréquentes)", "**SNG** si l'enfant ne s'alimente pas (gavage ou voie IV)", "Hydratation IV si trop encombré pour tolérer la SG", "Salbutamol en aérosol : essai possible si détresse sévère (bénéfice des aérosols incertain)", "Glucocorticoïdes et épinéphrine racémique : non recommandés", "**ATB** seulement si surinfection bactérienne", "Si T° > 38 °C : antipyrétique + hémoculture si nécessaire", "Kiné respiratoire en phase sécrétoire ou si atélectasie", "Prévention VRS : palivizumab, nirsevimab, vaccin maternel pendant la grossesse"], "stage": ["Surveillance continue de la **saturation**", "Recontrôler 30 min après la première prise de paramètres", "Fièvre : découvrir l'enfant (moyen non médicamenteux) ; recontrôle d'office 1 h après l'antipyrétique", "Position **proclive 30°**, anti-reflux", "**Isolement gouttelettes** (feuille rose) : masque, tablier, gants ; attention aux mains", "Fractionner les repas, hydrater", "Repos en phase aiguë", "Présenter les paramètres à ton IR, signaler tout paramètre anormal"], "retenir": ["Nourrisson < 2 ans, **VRS**, 2/3 des cas avant 6 mois", "**Nez d'abord** : lavage + aspiration", "O2 si sat < 92 %, lunettes max 3 l/min", "Isolement gouttelettes, repas fractionnés"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Bronchite et bronchite spastique", "d": {"id": "p2-bronchite-et-bronchite-spastique", "titre": "Bronchite et bronchite spastique", "groupe": "Respiratoire", "bref": "Atteinte bronchique avec toux ; la bronchite spastique = **sifflements (wheezing) récidivants** du jeune enfant de 0 à 4 ans, souvent viraux.", "signes": ["Toux, fièvre, dyspnée variables", "Râles ou **sibilances** à l'auscultation", "Sibilances récurrentes, surtout déclenchées par des **virus**", "Wheezing récidivant : au moins **3 épisodes** de plus de 24 h dans l'année"], "alerte": ["Si **3 bronchites « asthmatiformes »** : penser à l'**asthme**", "Un wheezing ne veut pas forcément dire asthme ; l'absence de signes n'exclut pas l'asthme", "Premier épisode sévère ou mauvaise réponse **avant 12 mois** : avis pneumologue (risque d'anomalie anatomique)", "Signaler toute **saturation < 92 %** à ton IR"], "causes": ["Origine souvent **virale** (rhinovirus, VRS) quel que soit le statut asthmatique", "Autres déclencheurs si profil asthmatique : effort, rire, pleurs, fumée de tabac"], "complications": ["Évolution vers l'**asthme** à rechercher"], "examens": ["Anamnèse, examen clinique, tests (même démarche que pour l'asthme)", "Résistances de 3 à 6 ans, bilan allergologique", "Scores de risque : mAPI (antécédents familiaux, eczéma, profil des sifflements, sensibilisation allergique) et PARS", "Profil atopique : sensibilisation aux aéroallergènes, éosinophilie ≥ 300/µL"], "traitement": ["Traitement symptomatique ; si asthme : voir « Asthme »", "**Crise** : bronchodilatateur courte durée (**SABA**), corticoïdes oraux selon gravité", "**Fond**, un choix parmi : corticoïde inhalé quotidien faible dose, corticoïde inhalé forte dose intermittent, **montélukast** (efficacité équivalente dans le profil non atopique)", "**Hospitalisation** : premier épisode sévère (soins intensifs ou nébulisation continue), hypoxémie ou détresse non améliorée, hospitalisations multiples", "O2 si besoin : objectif sat ≥ 92 %, lunettes nasales max 3 l/min, humidifiées (Aquapack®)"], "stage": ["Surveiller la saturation, signaler < 92 %", "O2 : lunettes nasales max 3 l/min (irritant pour les muqueuses), Aquapack®", "Observer le profil des épisodes (récidives, déclencheurs)"], "retenir": ["Wheezing récidivant 0-4 ans, souvent viral", "3 épisodes : penser asthme", "Crise : SABA ; sat cible ≥ 92 %"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Bronchopneumonie et pneumonie", "d": {"id": "p2-bronchopneumonie-et-pneumonie", "titre": "Bronchopneumonie et pneumonie", "groupe": "Respiratoire", "bref": "Atteinte **infectieuse et inflammatoire** des poumons (bronchioles et alvéoles), avec liquide dans le parenchyme ; due à une bactérie, un virus ou un mycoplasme.", "signes": ["Forme bactérienne : début **brutal**, altération de l'état général, frissons", "**Fièvre 39-40 °C**, toux, dyspnée", "Respiration saccadée", "**Crépitants localisés** (attention chez le nourrisson), systématisation lobaire, parfois épanchement", "Douleur thoracique ou abdominale (le jeune enfant peut avoir mal au ventre)", "Plaintes peu spécifiques : toux, fièvre, tachypnée, difficulté respiratoire", "Nouveau-né : geignement, apnée, intolérance alimentaire", "FR normale : < 1 mois 40-60/min ; 1 mois-2 ans 30-60/min ; 2-12 ans 20-30/min"], "alerte": ["Détresse : tachypnée, battements des ailes du nez, tirage, **hypoxie**", "Aucun signe isolé de l'examen ne permet de poser le diagnostic", "Signaler **sat < 92 %** et **T° > 37,8 °C**", "**Hospitalisation** : nourrissons < 90 jours, immunodéprimés, maladie chronique (drépanocytose, mucoviscidose), échec du traitement ambulatoire, **sat < 90 %**", "Doses d'ATB : suivre la prescription"], "causes": ["Virus, bactéries, mycoplasme, Chlamydia pneumoniae, parfois champignons", "Nouveau-né : streptocoque B, Klebsiella, E. coli, Listeria", "30 jours-2 ans : surtout virale", "2-5 ans : virus, puis pneumocoque et Haemophilus influenzae", "5-13 ans : Mycoplasma pneumoniae, pneumocoque le plus fréquent", "1re cause de maladie et de décès < 5 ans dans le monde"], "complications": ["Parfois **épanchement pleural**"], "examens": ["Biologie : syndrome inflammatoire, hyperleucocytose à neutrophiles", "Marqueurs inflammatoires : ne distinguent pas virale et bactérienne", "Prélèvement nasopharyngé (grippe, VRS, métapneumovirus)", "Hémocultures et bilan si forme sévère", "Radio réservée à : aspect toxique, maladie prolongée malgré traitement, nourrisson 0-3 mois fébrile, suspicion de corps étranger, < 5 ans fébrile avec hyperleucocytose sans foyer"], "traitement": ["**Antibiotiques** IV, parfois per os (exemple : enfant de 12 mois, Augmentin IV 350 mg × 4/jour)", "Nouveau-né : ampicilline + aminoside ou céphalosporine 3e génération", "> 3 mois : amoxicilline forte dose ou autre bêtalactamine (pneumocoque)", "> 5 ans : macrolide en général en 1re intention", "Correspondances : Augmentin® = Amoxiclav ; Clamoxyl® = Amoxicilline ; Amukin® = Amikacine ; Claforan® = Cefotaxime", "O2 si hypoxie : sat ≥ 92 %, lunettes max 3 l/min, Aquapack®", "Hydratation ; antipyrétique (Dafalgan®/paracétamol, Nurofen®/ibuprofène : connaître la dose/poids)", "Bronchodilatateurs", "Antitussifs : non recommandés", "Douleur : EVENDOL 0 à 4-6 ans ; EVA ou échelle numérique en auto-évaluation"], "stage": ["Paramètres : signaler sat < 92 % et T° > 37,8 °C", "Recontrôle 30 min après la 1re prise", "Si T° > 38 °C : antipyrétique + hémoculture si nécessaire, recontrôle d'office 1 h plus tard ; découvrir l'enfant", "Position **proclive**", "**Isolement gouttelettes** (feuille rose) : masque, tablier, gants", "Évaluer la douleur, **réévaluer 30 min après analgésie**", "Hydratation, observer la détresse et ausculter"], "retenir": ["Début brutal, fièvre 39-40 °C, crépitants localisés", "Germe selon l'âge (nouveau-né, < 5 ans viral, 5-13 ans mycoplasme)", "ATB IV + O2 si hypoxie + proclive", "Isolement gouttelettes"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Laryngite (spasmodique aiguë et croup)", "d": {"id": "p2-laryngite-laryngite-spasmodique-aigu-et-croup", "titre": "Laryngite (spasmodique aiguë et croup)", "groupe": "Respiratoire", "bref": "Maladie **virale** avec inflammation du larynx et des cordes vocales, donnant une **toux aboyante** et un **stridor inspiratoire**.", "signes": ["**Toux aboyante**, **stridor inspiratoire**, dyspnée inspiratoire", "Voix enrouée / rauque, rhinite", "Dyspnée obstructive haute : stridor, tirage sus-sternal, voix rauque", "Laryngite spasmodique : prodromes minimes et brefs, début **brutal nocturne**, résolution rapide, bon état général, **pas de fièvre**", "Croup : fièvre souvent légère (non nécessaire au diagnostic), pic des symptômes entre **24 et 48 h**", "FR normale 2-12 ans : 20 à 30/min"], "alerte": ["L'**épiglottite** fait partie des causes de dyspnée obstructive haute", "**Score de Westley** : léger ≤ 2 ; modéré 3-7 ; sévère 8-11 ; insuffisance respiratoire imminente ≥ 12", "⚠ Corticoïde : aérosols de Pulmicort / Solumédrol au service S 51 ; valeur habituelle : dexaméthasone et adrénaline nébulisée. À confirmer avec la prescription", "Humidification proposée, mais une méta-analyse ne montre pas d'effet sur le croup modéré"], "causes": ["Virus **parainfluenza** 1 à 3 (~75 %, type 1 le plus fréquent)", "Aussi influenza, adénovirus, VRS, rhinovirus, entérovirus", "Œdème des voies aériennes supérieures sous la glotte"], "complications": ["Mortalité < 0,5 %, même chez les enfants intubés"], "examens": ["Diagnostic **clinique** (toux aboyante nocturne brutale, bon état général)", "Imagerie et biologie rarement nécessaires", "« Signe du clocher » à la radio : ni sensible ni spécifique"], "traitement": ["**Corticoïdes** : aérosols de Pulmicort et Solumédrol (traitement principal au service S 51)", "Dexaméthasone **0,6 mg/kg** dose unique PO, IM ou IV, toute gravité (à confirmer avec la prescription)", "**Adrénaline** (épinéphrine racémique) nébulisée si forme modérée à sévère : 0,05 mL/kg de solution à 2,25 % (à confirmer avec la prescription)", "Humidification", "Douleur : EVENDOL 0 à 4-6 ans ; EVA ou échelle numérique ; réévaluer 30 min après analgésie"], "stage": ["Surveiller la respiration (stridor, tirage, FR)", "Évaluer la douleur et la réévaluer 30 min après analgésie", "Appliquer la prescription et le protocole du service"], "retenir": ["Toux aboyante + stridor inspiratoire", "Spasmodique : 3 mois-3 ans, nocturne, sans fièvre ; croup : 6 mois-3 ans, parfois jusqu'à 6 ans", "Corticoïde = traitement principal", "Westley pour la gravité"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Asthme", "d": {"id": "p2-asthme", "titre": "Asthme", "groupe": "Respiratoire", "bref": "Maladie **inflammatoire chronique** des voies aériennes avec crises : dyspnée, oppression, sifflements, toux ; obstruction variable et hyperréactivité bronchique.", "signes": ["Toux, **sifflements**, oppression thoracique, essoufflement, souvent épisodiques, pires la **nuit** ou après un déclencheur", "Tableaux : crise, bronchites spastiques à répétition, toux chronique, toux nocturne, symptômes à l'effort", "Détresse à évaluer : tirage sus-sternal/intercostal/sous-costal, battements des ailes du nez, wheezing (sifflement expiratoire), grunting, coloration péri-buccale, stridor (bruit inspiratoire)", "Conscience : normale (légère) ; anxiété ; agitation ; altérée (sévère)", "Dyspnée : éloquence normale (légère) ; phrases (modérée) ; mots (sévère)", "Saturation : > 95 % (légère) ; 90-95 % (modérée) ; < 90 % (sévère)"], "alerte": ["**Exacerbation grave** : tachycardie > 120/min (grand) ou > 160/min (petit), tachypnée, ne parle plus en longues phrases, muscles accessoires", "**Signes de danger** : agitation ou baisse de conscience, épuisement, **cyanose**, entrée d'air quasi nulle (bradypnée et bradycardie en « danger »)", "L'absence de signes n'exclut pas l'asthme ; un wheezing n'est pas forcément un asthme", "⚠ Seuil d'O2 : < 92 % au service S 51 ; valeur habituelle : < 92-93 % ou 90-92 %. À confirmer avec la prescription / l'équipe", "⚠ Âge de la spirométrie : 6 ans ou 5 ans. À confirmer avec le service", "⚠ Doses de crise : deux séries de valeurs (voir traitement). À confirmer avec la prescription", "Nesivine : confirmer la prescription avec l'équipe"], "causes": ["Facteurs déclenchants : infections virales, allergènes, exercice, irritants, médicaments, air froid, facteurs émotionnels", "Animaux, poussière, moisissures, fumée de tabac, aérosols", "Origine multifactorielle (génétique + environnement) ; antécédents familiaux augmentent le risque", "3 mécanismes : œdème de l'épithélium bronchique, bronchospasme, hyperactivité bronchique"], "complications": ["Asthme non contrôlé et exacerbations : insuffisance respiratoire, décès"], "examens": ["Anamnèse, examen clinique, tests", "Spirométrie après 6 ans (ou 5 ans) ; résistances de 3 à 6 ans", "Réversibilité significative : VEMS +12 % ou +200 mL après bronchodilatateur", "Bilan allergologique", "Score de Wood modifié"], "traitement": ["**Crise** : « bronchodilater, et vite ! », sans négliger l'inflammation", "Salbutamol (Ventolin, Airomir), Atrovent, Combivent (nébulisation), Duovent", "Doses : salbutamol nébulisé 2,5-5 mg, répétable toutes les 20 min ; ipratropium 250-500 µg × 3 doses (crise modérée à sévère)", "Corticoïdes systémiques **1-2 mg/kg/jour** PO ou IV (prednisolone ou méthylprednisolone), sans dégression si < 5 jours ; ou dexaméthasone 0,6 mg/kg", "Soins intensifs : nébulisation continue de bêta-2, adrénaline, salbutamol IV, ventilation assistée", "**O2** si sat < 92 % ; objectif ≥ 92 % ; lunettes nasales max 3 l/min, Aquapack®", "**Fond** si contrôle insuffisant (bronchodilatateur > 2 fois/sem, symptômes diurnes, nocturnes ou à l'effort, attaque sévère récente)", "Corticoïdes inhalés : béclométasone (Qvar), budésonide (Pulmicort), fluticasone (Flixotide)", "Effets locaux : dysphagie, candidose buccale, dysphonie ; prévention : chambre + rinçage de bouche", "Autres : bêta-agonistes longue durée, associations fixes (Seretide, Symbicort, Relvar, Inuvair), antagonistes des leucotriènes", "Inhalation : < 3 ans chambre + masque ; 3-6 ans chambre + embout ; > 6 ans chambre + embout, poudre sèche ou aérosol-doseur", "Puffs avec chambre Optichamber", "Nébuliseur seulement si rien d'autre (dépôt 2-10 % ; chambre 20-40 % ; poudre 10-32 %)", "Plan d'action écrit avec l'enfant et la famille"], "stage": ["Électrodes + câble de saturation", "Paramètres : saturation, FR, pulsations", "Évaluer les signes de détresse", "Lavage de nez au sérum physiologique ; gouttes nasales selon prescription (Nesivine, Néobacitracine)", "Position **proclive 30°**", "**Isolement gouttelettes** (feuille rose) : masque, tablier, gants", "Kiné respiratoire parfois après la phase aiguë", "Après la phase aiguë : reprise du traitement de fond par puffs", "Éducation : chambre d'inhalation, rinçage de bouche, plan d'action"], "retenir": ["Crise : bronchodilater vite (salbutamol), puis corticoïdes", "Signes de danger : cyanose, épuisement, entrée d'air quasi nulle", "Corticoïdes inhalés : chambre + rinçage de bouche", "O2 si sat < 92 %, max 3 l/min"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Mucoviscidose", "d": {"id": "p2-mucoviscidose", "titre": "Mucoviscidose", "groupe": "Respiratoire", "bref": "Maladie **génétique héréditaire** (autosomique récessive, gène CFTR) : mucus épais et collant, atteinte respiratoire, digestive et génitale.", "signes": ["Respiratoire : toux chronique, expectorations matinales, exacerbations « faciles »", "Sinusite chronique, polypose nasale, atélectasies, bronchectasies", "Infections à répétition (Haemophilus, MSSA, MRSA, **Pseudomonas aeruginosa**, Cepacia, Candida)", "Exacerbation : toux persistante, dyspnée, expectorations plus abondantes, EFR perturbées", "Digestif (85 %) : insuffisance pancréatique exocrine, **selles grasses** volumineuses malodorantes, stagnation pondérale, douleurs abdominales", "Intestin : diarrhée, constipation, occlusion, prolapsus rectal ; RGO", "**Iléus méconial** chez 15-20 % des nouveau-nés atteints", "Pancréas : diabète, pancréatite ; foie : fibrose, cirrhose, ascite, lithiase biliaire", "Déficit en vitamines liposolubles (ADEK), anomalies électrolytiques", "Sueur salée, hippocratisme digital, ostéoporose précoce"], "alerte": ["Insuffisance respiratoire et **cœur pulmonaire**", "Un dépistage néonatal normal n'exclut pas la maladie", "Certains antibiotiques sont **toxiques** : dosages nécessaires ; hyperhydrater", "⚠ Incidence : 1/2 500 ou ~1/3 500 naissances ; mutations : plus de 1 500 ou plus de 2 000. Valeurs à confirmer avec le service", "Marques, chiffres et objectifs nutritionnels : suivre les protocoles du service"], "causes": ["Deux mutations du gène **CFTR** (canal chlorure) : sécrétions anormales", "Plus de 1 500 mutations (ou > 2 000) ; F508del : 70-90 % des cas aux États-Unis", "Portage : 1 personne sur 25 ; maladie : 1 naissance sur 2 500 (ou ~1/3 500)", "Mauvaise clairance mucociliaire : forte infection ; atteinte respiratoire = facteur n°1 de pronostic"], "complications": ["Insuffisance respiratoire, cœur pulmonaire", "Diabète lié à la mucoviscidose (~10 % des adolescents)", "Atteinte hépatobiliaire, syndrome d'obstruction intestinale distale", "Ostéoporose (malabsorption calcium/vitamine D, corticoïdes, inflammation)", "Dépression (19 %) et anxiété (32 %)", "Survie médiane prédite ~57 ans (nés 2018-2022, États-Unis)"], "examens": ["**Test de la sueur** (référence) : ≤ 29 mmol/L peu probable ; 30-59 tests complémentaires ; ≥ 60 diagnostic posé", "Diagnostic confirmé : test de la sueur pathologique (2 fois) ou 2 mutations", "Recherche de mutations", "Dépistage néonatal : trypsine immuno-réactive (IRT) + ADN ou 2e dosage", "EFR (perturbées en exacerbation)", "Classifications : mucoviscidose, CFTR-RD, CRMS/CFSPID"], "traitement": ["Kinésithérapie respiratoire, mucolytiques, lavage nasal (Lotta®)", "Aérosols : antibiotique, bronchodilatateur, corticoïde, mucolytique", "Dornase alfa, sérum salé hypertonique, percussions", "ATB IV : Glazidim, Obracin, Meronem… ; inhalés : tobramycine, aztréonam, amikacine ; azithromycine au long cours si Pseudomonas", "Antifongique", "Modulateurs CFTR : Kalydeco, Orkambi, Symdeko, Trikafta", "Enzymes pancréatiques : **Créon® 10 000 à 25 000 UI**", "Vitamines ADEK, antireflux, laxatif", "Nutrition hypercalorique et hypergraisseuse (poids/taille ou IMC ≥ 50e percentile)", "Prévention : nutrition, lutte contre le tabagisme, vaccinations, activité sportive, suivi"], "stage": ["**Isolement gouttelettes** (feuille rose) : masque, tablier, gants", "Prévenir les **infections croisées** : 2 enfants atteints non apparentés ne se côtoient pas (≥ 6 pieds, ~1,8 m)", "Kiné respiratoire, aérosols, lavage nasal", "Hyperhydratation PO/IV sous antibiotiques", "Surveiller les dosages des antibiotiques toxiques", "Alimentation hypercalorique, enzymes avec les repas"], "retenir": ["CFTR, autosomique récessive, mucus épais", "Poumons = pronostic ; digestif : selles grasses, enzymes (Créon)", "Test de la sueur ≥ 60 : diagnostic", "Isolement + éviter les infections croisées"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Tuberculose", "d": {"id": "p2-tuberculose", "titre": "Tuberculose", "groupe": "Respiratoire", "bref": "Maladie infectieuse **très contagieuse** due au bacille de Koch (Mycobacterium tuberculosis), transmise par gouttelettes en suspension dans l'air.", "signes": ["90 % des grands enfants nouvellement infectés : **asymptomatiques**", "Jusqu'à 50 % des nourrissons infectés : symptômes respiratoires ou généraux + anomalies radiologiques", "Adolescent : réactivation (fatigue, perte de poids, sueurs nocturnes, cavernes)", "Toux, fièvre, mauvais appétit, perte de poids, fatigue > **2 semaines**", "Extrapulmonaire : ganglionnaire (60 %), **méningée** (la plus grave), osseuse (mal de Pott, dactylite), abdominale, génito-urinaire, miliaire (< 1 %)"], "alerte": ["Isolement **aérien** (feuille blanche), FFP2", "Xpert MTB/RIF négatif n'exclut pas la tuberculose de l'enfant", "Méningite tuberculeuse : > 50 % des survivants ont des séquelles neurodéveloppementales", "⚠ Intradermo : confirme le diagnostic au service S 51 ; mais jusqu'à 40 % des enfants avec tuberculose prouvée n'avaient pas réagi au test", "⚠ Durée du traitement de la méningite : 12 mois ou 6 mois en alternative ; schéma court de 4 mois pour certaines formes. À confirmer avec la prescription", "⚠ Doses (isoniazide, rifampicine, pyrazinamide) : à confirmer avec la prescription"], "causes": ["Contact avec un cas contagieux (surtout pulmonaire à frottis ou culture positifs)", "Âge < 5 ans ; réponse immunitaire altérée chez le nourrisson", "Infection ≠ maladie : risque de maladie sans traitement 40-50 % nourrisson, 25 % trottineur, 10-15 % enfant d'âge scolaire", "En 2023 : 1,3 million de cas < 15 ans, ~250 000 décès"], "complications": ["Retard de diagnostic : hydrocéphalie, atteinte cérébro-vasculaire, mal de Pott avec paraplégie, occlusion intestinale, insuffisance rénale, dissémination miliaire", "Méningite tuberculeuse : séquelles neurodéveloppementales"], "examens": ["Contexte de contact, clinique, test cutané à la tuberculine (intradermo) ou IGRA, radio, microbiologie", "Radio : opacité persistante + adénopathies hilaires ou sous-carénaires", "< 5 ans : aspiration ou lavage gastrique ; au service S 51 : **3 tubages gastriques**", "Culture : 3 à 8 semaines", "Xpert MTB/RIF : résultat en < 2 h"], "traitement": ["Forme sensible : **2HRZE/4HR** (2 mois isoniazide + rifampicine + pyrazinamide + éthambutol, puis 4 mois isoniazide + rifampicine)", "Schéma de 4 mois (2HRZ(E)/2HR) : formes non sévères de 3 mois à 16 ans", "Méningite : 4 médicaments, 12 mois (ou 6 mois en alternative)", "Doses : isoniazide 10-15 mg/kg, rifampicine 15-20 mg/kg, pyrazinamide 30-40 mg/kg", "Traitement sous **observation directe**", "**BCG** : ~90 % de protection contre formes disséminées sévères la 1re année, pas contre la forme pulmonaire, contre-indiqué si immunodépression", "< 5 ans exposé : évaluation et traitement préventif"], "stage": ["Prise des paramètres", "**Isolement aérien** (feuille blanche) : masque **FFP2**, tablier, gants", "Affiche sur la porte de la chambre + chariot avec le matériel", "Préparer/assister : 3 tubages gastriques, intradermo"], "retenir": ["Isolement aérien, FFP2", "Souvent asymptomatique chez l'enfant ; < 5 ans à risque", "2HRZE puis 4HR", "Méningite = forme la plus grave"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Respiratoire", "title": "Épanchement pleural (parapneumonique et empyème)", "d": {"id": "p2-panchement-pleural-parapneumonique-et-empyme", "titre": "Épanchement pleural (parapneumonique et empyème)", "groupe": "Respiratoire", "bref": "Épanchement pleural **exsudatif** associé à une infection pulmonaire du même côté, le plus souvent une pneumonie.", "signes": ["Toux, fièvre, **douleur pleurale**, dyspnée, tachypnée, tachycardie", "**Matité** à la percussion, murmure vésiculaire diminué ou absent", "Dans la bronchopneumonie : douleur thoracique ou abdominale chez le jeune enfant"], "alerte": ["Classification : non compliqué (cultures négatives, glucose > 60 mg/dL, pH > 7,20) ; compliqué (pH < 7,20 ou glucose bas) ; **empyème** (pus franc, Gram ou culture positifs)", "Signaler **sat < 92 %** et **T° > 37,8 °C**"], "causes": ["Streptococcus pneumoniae et Staphylococcus aureus : ~70 % des cultures aérobies", "S. aureus après chirurgie", "Stades : exsudatif (2-5 j), fibropurulent (5-10 j), organisation (2-3 sem, « peau » pleurale)"], "complications": ["Épaississement pleural résiduel, fibrose, fistule broncho-pleurale", "La plupart des patients guérissent ; mortalité 10 %, surtout chez l'adulte"], "examens": ["Radio de face et **échographie** (liquide libre ou cloisonné ; guide ponction/drainage)", "Scanner non systématique chez l'enfant", "Hémocultures", "Liquide pleural : Gram, culture, comptage cellulaire, protéines, LDH, glucose, pH"], "traitement": ["**ATB IV** couvrant le pneumocoque pour tous les cas", "Spectre plus large si nosocomial, chirurgie, traumatisme ou inhalation", "Relais per os 1 à 4 semaines à la sortie", "**Drainage** sous échographie par personnel formé ; drain petit calibre (8-12 FG), système unidirectionnel sous eau", "Fibrinolytiques intrapleuraux : raccourcissent le séjour si compliqué", "Thoracoscopie si échec persistant", "Oxygène, position proclive, bronchodilatateurs, hydratation"], "stage": ["Paramètres, signaler sat < 92 %", "Fièvre : signaler T° > 37,8 °C ; antipyrétique si > 38 °C ; recontrôle 30 min après la 1re prise", "Hydratation, ATB, antidouleurs", "Douleur : EVENDOL 0 à 4-6 ans ; EVA ou échelle numérique ; réévaluer 30 min après analgésie", "**Isolement gouttelettes** (feuille rose) : masque, tablier, gants", "Position proclive, O2 si besoin"], "retenir": ["Complicat lence post-critique, qui disparaît en quelques minutes", "**Convulsion simple** : 6 mois à 5 ans, tonico-clonique généralisée, **brève**, sans récidive en 24 h", "Simple : sans déficit post-critique, examen neurologique normal", "**Convulsion complexe** : si un critère manque (crises multiples en 24 h, signes focaux, durée prolongée)", "À ne pas confondre : trémulations (disparaissent si on immobilise le membre)", "À ne pas confondre : malaise sur RGO (hypertonie, apnée, cyanose puis hypotonie, pâleur)", "À ne pas confondre : syncope vagale convulsivante, spasme du sanglot, myoclonies de sommeil (bénignes)"], "alerte": ["⚠ Durée d'une convulsion simple : < **5 min** ou < **15 min** : valeur à confirmer avec la prescription / le service", "⚠ Température : signaler > **37,8 °C** (au service S 51) ; fièvre de crise > 38 °C (valeur habituelle) : valeur à confirmer avec le service", "⚠ Nourrisson de moins de 1 mois ou de 6 semaines : valeur à confirmer avec le service", "Convulsion fébrile pathologique : toujours à bilanter", "Fièvre + convulsions : penser **méningite**, méningo-encéphalite", "Nourrisson < 12 mois : ponction lombaire à envisager", "Saturation < **92 %** : signaler", "Barres de lit **toujours remontées**"], "causes": ["Fièvre (toute cause) entre 6 mois et 5 ans, jusqu'à 4 % des enfants ; crise souvent pendant l'élévation de T°", "Seuil convulsivant variable selon l'enfant", "Méningite, méningo-encéphalite", "Sans fièvre : traumatisme crânien, enfant secoué, intoxication", "Déshydratation aiguë, troubles métaboliques, anoxie-ischémie cérébrale"], "complications": ["Récidive : ± **30 %**", "Risque d'épilepsie légèrement augmenté", "État de mal fébrile (> 30 min) : sclérose mésiale temporale", "Paralysie de Todd (résolutive en heures ou jours)"], "examens": ["Toujours **T°** et **glycémie** (dextro)", "Glycémie au service S 51 : 70-140 mg/dl à jeun ; 70-180 mg/dl postprandial", "Simple : aucun examen complémentaire", "Complexe : bilan approfondi, imagerie, *
