varicelle", "Varicelle : **pas de Nurofen**, isolement aérien, pesée quotidienne"]}}, {"k": "drug", "part": "drug", "chap": "Médicaments : Hématologie et dermatologie", "title": "Acide fusidique (Fucidin®)", "d": {"id": "p5-acide-fusidique-fucidin", "titre": "Acide fusidique (Fucidin®)", "noms": "Fucidin® (crème, pommade, 15 et 30 g), Affusine crème, Fusidine Teva crème ; avec corticoïde : Fucidin Hydrocortisone, Fucicort", "molecule": "Acide fusidique 2 %", "famille": "Antibiotique local", "groupe": "Hématologie et dermatologie", "sert": ["Impétigo à lésions limitées : **1er choix**", "Varicelle : boutons **surinfectés**", "Impétigo : pathologie dermatologique du service"], "dose": ["Impétigo : 1 application, **2 à 4 fois/jour**, **7 jours**"], "voie": ["Cutanée (application locale)", "Crème ou pommade selon la spécialité", "Fucidin Hydrocortisone : acide fusidique 20 mg/g + hydrocortisone 10 mg/g", "Fucicort : acide fusidique 20 mg/g + bétaméthasone 1 mg/g"], "effets": [], "precautions": ["Antibiotique local : risque de **résistances** et de **retard de cicatrisation**", "Associations avec corticoïde : efficacité non prouvée, diagnostic parfois plus difficile", "Grossesse et allaitement : données rassurantes, pas de signal de malformations"], "stage": ["Varicelle : pesée quotidienne", "Varicelle : isolement aérien (feuille blanche)", "Connaître **indication, dose et débit** ; préparer **sous supervision de l'IR** seulement", "**Interdit** de préparer ou d'administrer sans la surveillance de l'IR"], "alerte": ["⚠ Au service S 51 : « corticoïde local » ; valeur habituelle : **antibiotique local**", "Seuls Fucidin Hydrocortisone et Fucicort contiennent un corticoïde", "À confirmer avec le service / la prescription"], "retenir": ["Impétigo limité : acide fusidique 2 % en 1er choix", "1 application 2 à 4 x/jour pendant 7 jours", "Antibiotique local (pas un corticoïde)"]}}, {"k": "drug", "part": "drug", "chap": "Médicaments : Hématologie et dermatologie", "title": "Hydroxycarbamide (Hydrea)", "d": {"id": "p5-hydrea", "titre": "Hydroxycarbamide (Hydrea)", "noms": "Hydrea (gélules 500 mg) ; Siklos (comprimés pelliculés 100 mg)", "molecule": "Hydroxycarbamide", "famille": "Hydrea : autres antimétabolites (cytostatique) ; Siklos : médicament de l'hématopoïèse", "groupe": "Hématologie et dermatologie", "sert": ["**Drépanocytose** : prise en charge avec **acide folique et Hydrea**", "**Réservé aux formes graves**", "Siklos : **prévention des crises vaso-occlusives douloureuses** (adultes et enfants de plus de 2 ans)", "Augmente l'hémoglobine fœtale : moins de déformation des globules rouges", "Moins d'épisodes douloureux et d'hospitalisations que le placebo (adulte et enfant)", "Hydrea : surtout utilisée hors indication (off-label) pour des maladies hématologiques graves", "Pas d'alternative réalisable en pratique pour la drépanocytose", "Au service : paramètres, **pesée quotidienne**, hyperhydratation, antibiotique, antidouleurs, transfusion selon l'hémoglobine"], "dose": ["Prescription en **DCI avec dose journalière** du patient : suivre la prescription", "Durée maximale de prescription : 92 jours"], "voie": ["**Voie orale** : gélules 500 mg (Hydrea) ; comprimés pelliculés 100 mg (Siklos)"], "effets": ["**Troubles hématologiques**, surtout leucopénie", "**Troubles digestifs**", "**Ulcères cutanés**, atteintes mucocutanées", "Tumeur secondaire à long terme non exclue", "Risques importants à court et long terme"], "precautions": ["Hydrea 500 mg indisponible en Belgique jusqu'au 2 octobre 2023 ; importation par dérogation (boîtes de 100 gélules)", "Délivrance limitée à **1 boîte de 100 gélules par mois et par patient**", "Réserve stratégique depuis le 1er août 2023 : délivrance limitée à 1 mois par patient"], "stage": ["Connaître indication, dosage et débit ; savoir préparer, **toujours sous supervision de l'IR**", "**Interdit** de préparer ou d'administrer sans la surveillance de l'IR", "**Pesée quotidienne** en drépanocytose"], "alerte": ["⚠ La forme indiquée dans la drépanocytose est Siklos, alors que le service nomme Hydrea : à confirmer avec l'équipe ou le répertoire du service", "⚠ Pas de posologie pédiatrique précise : suivre la prescription"], "retenir": ["Drépanocytose : acide folique + Hydrea ; formes graves", "Effets : leucopénie, digestifs, ulcères cutanés", "Dose = sur prescription (DCI + dose journalière)"]}}, {"k": "fiche", "part": "add", "chap": "Additionnelles : Sécurité des soins", "title": "Sécurité de l'enfant hospitalisé", "d": {"groupe": "Sécurité des soins", "bref": "Rappel des règles de sécurité à appliquer en permanence en pédiatrie : identification, chutes, environnement, brûlures, sommeil, perfusion, présence des parents. Un enfant n'est pas un adulte miniature : il ne connaît pas le danger et ne peut pas toujours se protéger ou s'exprimer.", "sections": [{"k": "list", "h": "IDENTIFICATION DE L'ENFANT (IDENTITOVIGILANCE)", "items": ["**Le bracelet d'identité reste en place en permanence**, y compris lors des transports et des examens dans un autre service.", "Un bracelet est aussi mis sur le **lit** de l'enfant dès l'admission.", "Vérifier l'identité par des **questions ouvertes** (« Comment t'appelles-tu ? », au parent : « Quel est le nom de votre enfant ? ») et la comparer au bracelet : ne jamais poser une question fermée à laquelle l'enfant répond « oui » par réflexe.", "Vérifier l'identité avant chaque médicament, prélèvement, perfusion ou examen ; un biberon ou un lait préparé porte une étiquette (prénom, date, heure).", "Chez le très jeune enfant ou l'enfant qui ne parle pas : s'appuyer sur le bracelet et sur le parent présent."]}, {"k": "list", "h": "PRÉVENTION DES CHUTES ET SÉCURITÉ DU LIT", "items": ["**Les barres de lit sont TOUJOURS remontées** (et fixées), surtout pour les lits cages en hauteur : un enfant peut tomber en une seconde, même un nourrisson qui ne se retourne pas encore ou qui perd l'équilibre.", "Les lits à barreaux sont adaptés à la taille de l'enfant ; l'écartement des barreaux ne doit pas laisser passer la tête.", "**Ne jamais lâcher l'enfant posé sur la table à langer** : garder en permanence une main sur lui et préparer tout le matériel avant de commencer.", "Ne jamais laisser un nourrisson sur un support en hauteur (couffin, relax, lit) sans surveillance ; un couffin ou un relax se pose sur un support stable.", "Pendant le transport (lit, berceau, civière, chaise roulante) : barres remontées, enfant immobilisé par une contention non agressive, doigts à l'abri lors du passage des portes et ascenseurs.", "Âges et circonstances à risque de chute : à confirmer avec le service (échelle ou critères de risque utilisés dans l'unité)."]}, {"k": "list", "h": "ENVIRONNEMENT DE LA CHAMBRE", "items": ["Prises de courant protégées, fenêtres fermées par un système de sécurité, service fermé pour éviter l'accès aux escaliers et ascenseurs.", "**Aucune aiguille ne rentre en chambre** ; le matériel de soin n'est jamais laissé à portée de l'enfant sans surveillance.", "Médicaments, produits de toilette et d'entretien, objets coupants et appareils électriques : hors de portée.", "**Petits objets et aliments durs = risque d'inhalation** : 80 % des inhalations de corps étranger surviennent avant 4 ans (cacahuètes, pièces de jouets...). Jouets adaptés à l'âge, sans petites pièces détachables avant 3-4 ans.", "**Étouffement** : encourager la toux si l'enfant tousse efficacement ; sinon manœuvres de désobstruction adaptées à l'âge (claques dans le dos / compressions) et appel immédiat à l'aide ; si l'enfant devient inconscient ou ne respire plus : RCP (voir la fiche RCP) ; la position latérale de sécurité ne convient qu'à un enfant inconscient qui respire normalement.", "Pas de chaînette ou de cordon autour du cou, pas de peluche envahissante dans le lit."]}, {"k": "list", "h": "BRÛLURES ET TEMPÉRATURES", "items": ["**Bain : eau à 36,6-37 °C**, vérifiée avec le coude, l'avant-bras ou un thermomètre de bain ; pièce à 22 °C, fenêtres fermées.", "Préparer tout le matériel avant le bain et **ne jamais quitter l'enfant** : la personne qui donne le bain se considère comme absente pour le reste (pas de téléphone, pas de sonnette).", "Nourrisson avec T° < 36,5 °C : le réchauffer et reporter le bain.", "**Biberon, lait et repas : tester la chaleur sur le poignet (ou le dos de la main)** ; attention aux micro-ondes, qui chauffent de façon inégale.", "Les brûlures pédiatriques touchent surtout les moins de 4 ans (pic vers 2 ans), le plus souvent par liquides bouillants.", "Premier geste en cas de brûlure : refroidir (cooling 20-20-20 : 20 minutes, à 20 cm, eau à 20 °C) et prévoir un antalgique."]}, {"k": "list", "h": "SOMMEIL SÛR DU NOURRISSON", "items": ["**Toujours couché sur le dos**, pour les siestes comme pour la nuit.", "**Lit nu** : matelas ferme, plat, sans oreiller, sans couverture, sans peluche, sans tour de lit ; préférer un sac de couchage (gigoteuse).", "Surface de sommeil non inclinée ; pas de partage du lit avec un adulte.", "Chambre à 18-20 °C, nourrisson non surcouvert (éviter la surchauffe).", "Environnement sans fumée : le tabagisme passif augmente le risque de mort subite du nourrisson.", "Observer régulièrement l'enfant qui dort : respiration, coloration. Respecter son sommeil et ses siestes en tenant compte de la priorité des soins."]}, {"k": "list", "h": "PERFUSION ET MATÉRIEL", "items": ["Toutes les perfusions passent par une pompe (débit précis, cathéter perméable).", "**Protéger le point de ponction** : cacher le cathéter sous un bandage non serré ; immobiliser parfois le membre avec une attelle.", "Le pansement du cathéter périphérique n'est pas refait systématiquement : on le refait seulement s'il est décollé ou souillé.", "Prolongateur : laisse de la liberté de mouvement à l'enfant ; fixer et ranger les tubulures pour éviter arrachement, enroulement autour du cou ou des membres.", "Robinet à 3 voies : piège à bulles et à microbes ; le protéger pour que l'enfant ne le manipule pas.", "Surveiller le site : rougeur, chaleur, gonflement, douleur, infiltration ; une plainte d'un enfant craintif ne se banalise pas."]}, {"k": "list", "h": "PARENTS, SORTIES ET CONTENTION", "items": ["**Ne jamais laisser un enfant seul** dans une salle d'attente, un couloir ou lors d'un transport : le confier à une personne du service ou à ses parents.", "La présence des parents est encouragée : elle rassure et fait partie de la relation de soin ; leur expliquer les règles de sécurité (barres relevées, objets hors de portée).", "Un enfant qui marche ne se déplace hors du service qu'accompagné d'une personne responsable, après vérification qu'il n'a pas reçu de calmant ni de gouttes ophtalmiques modifiant sa vision.", "Contention : uniquement non agressive, adaptée à l'âge et à la nature du soin, la plus courte possible, avec explication à l'enfant et douleur prise en charge d'abord. Règles précises de contention et de non-contention du service : à confirmer.", "Risque de fugue ou de sortie non autorisée (adolescent, situation de maltraitance) : règles d'information de l'équipe et de surveillance à confirmer avec le service."]}, {"k": "list", "h": "RÔLE DE L'INFIRMIER RÉFÉRENT ET SIGNALEMENT", "items": ["Tout stagiaire travaille sous la responsabilité de son infirmier référent : ne rien faire dont on n'est pas certain, et seulement avec son accord.", "Signaler immédiatement à l'infirmier référent toute anomalie : paramètres anormaux, danger dans l'environnement, chute, objet ou produit trouvé à portée de l'enfant.", "Après tout incident ou quasi-incident (chute, erreur d'identité, arrachage de voie, brûlure) : s'assurer de la sécurité de l'enfant, prévenir l'infirmier et le médecin, informer les parents, puis transmettre par écrit.", "La déclaration d'incident se fait selon la procédure de l'hôpital : à confirmer avec le service."]}, {"k": "table", "h": "GESTES DE SÉCURITÉ CLÉS PAR SITUATION", "cols": ["SITUATION", "GESTE DE SÉCURITÉ"], "rows": [["**Table à langer**", "Une main sur l'enfant en permanence, matériel préparé avant"], ["**Lit / berceau**", "Barres relevées et fixées, surtout lit cage ; jamais d'aiguille en chambre"], ["**Bain**", "Eau 36,6-37 °C, coude ou thermomètre, jamais seul, pièce à 22 °C"], ["**Biberon / repas**", "Tester la chaleur au poignet ou au dos de la main"], ["**Sommeil nourrisson**", "Sur le dos, lit nu, matelas ferme, sans oreiller, 18-20 °C"], ["**Transport**", "Bracelet en place, barres relevées, contention non agressive, jamais seul, couvrir contre le froid"], ["**Perfusion**", "Cathéter caché sous bandage non serré, pompe, tubulures rangées"]]}], "alerte": ["Barres de lit baissées, même « une seconde » : un enfant peut tomber en une seconde.", "Enfant sans bracelet ou identité vérifiée par une question fermée : risque d'erreur de patient, de médicament ou de prélèvement.", "Petit objet, aliment dur ou médicament à portée d'un enfant de moins de 4 ans : risque d'inhalation, d'étouffement ou d'intoxication (centre antipoison : 070/245.245).", "Toux brutale, cyanose ou perte de réaction après une prise alimentaire ou un jeu : suspecter une fausse route ou une inhalation et appeler l'équipe tout de suite.", "Lait ou bain trop chaud, nourrisson couché sur le ventre ou avec literie souple : brûlure et risque de mort subite évitables."], "stage": ["Vérifier le bracelet et l'identité par questions ouvertes à chaque soin, médicament ou prélèvement.", "Remonter les barres du lit et contrôler leur fixation à chaque sortie de chambre.", "Ranger le matériel de soin et les médicaments hors de portée, et n'emporter aucune aiguille en chambre.", "Tester la température du bain (36,6-37 °C) et du biberon avant de les proposer.", "Coucher le nourrisson sur le dos, lit nu, et observer respiration et coloration pendant son sommeil.", "Protéger la voie veineuse (bandage non serré, tubulures rangées) et surveiller le site à chaque passage.", "Expliquer les règles de sécurité aux parents et les associer à la surveillance.", "Signaler sans attendre à l'infirmier référent tout danger, incident ou comportement inhabituel de l'enfant."], "retenir": ["Bracelet toujours en place + identité vérifiée par questions ouvertes.", "Barres toujours remontées ; une main sur l'enfant sur la table à langer ; jamais d'aiguille en chambre.", "Bain à 36,6-37 °C ; biberon testé au poignet ; cooling 20-20-20 en cas de brûlure.", "Nourrisson : sur le dos, lit nu, matelas ferme, 18-20 °C, sans fumée.", "Ne jamais laisser un enfant seul ; en cas de doute, appeler l'infirmier référent."]}}, {"k": "fiche", "part": "add", "chap": "Additionnelles : Sécurité des soins", "title": "Transmettre une information (SBAR)", "d": {"groupe": "Sécurité des soins", "bref": "Structurer un appel au médecin, une transmission orale ou écrite pour être clair, complet et bref. À relire avant tout appel et avant le rapport de relève.", "sections": [{"k": "list", "h": "SBAR : DÉFINITION", "items": ["**SBAR** = cadre de communication structuré pour transmettre l'état d'un patient et obtenir une décision rapidement.", "**S** = Situation : ce qui se passe maintenant. **B** = Background (Contexte) : l'histoire utile.", "**A** = Assessment (Évaluation) : l'évaluation de l'infirmier(ère) sur le problème. **R** = Recommendation (Demande) : ce qui est demandé, et pour quand.", "Commencer par se présenter (nom, fonction, service), puis annoncer le patient : « La situation est… Le contexte est… Mon évaluation est… Je demande… »."]}, {"k": "list", "h": "CONTENU DE CHAQUE LETTRE EN PÉDIATRIE", "items": ["**S : Situation** : nom et service de l'appelant(e), prénom/nom de l'enfant, chambre, **âge**, **poids**, **motif** de l'appel en une phrase (ex. « détresse respiratoire croissante »).", "**S : constantes** : **FR, FC, SpO2 (avec ou sans O2), T°, TA**, plus le score PEWS si utilisé dans le service. Donner les valeurs chiffrées, pas « ça va mal ».", "**B : Contexte** : motif d'hospitalisation et diagnostic, **évolution** depuis l'admission ou depuis la dernière garde, **allergies**, **traitements en cours** (dernière dose donnée), perfusion, O2, derniers résultats utiles.", "**A : Évaluation** : l'évaluation de l'infirmier(ère) (« je pense que l'état respiratoire s'aggrave », « je ne sais pas ce qui se passe mais je suis inquiet(e) »). Dire aussi si l'état est stable, instable ou en dégradation.", "**R : Demande** : ce qui est voulu précisément (venir voir l'enfant, prescription, examen, transfert) et **dans quel délai** (« tout de suite », « dans 15 minutes »). Demander quoi surveiller et quand rappeler."]}, {"k": "list", "h": "PRÉPARER AVANT D'APPELER", "items": ["**Évaluer l'enfant** soi-même : constantes complètes, aspect général, comportement, douleur.", "Relire le dossier : diagnostic, allergies, prescriptions, dernier bilan, poids.", "Garder le dossier et les valeurs sous les yeux pendant l'appel.", "Préparer la demande avant de composer le numéro : savoir ce qu'on veut obtenir.", "Le faire avec l'infirmier(ère) de référence (IR) pour un(e) étudiant(e) : l'étudiant(e) agit sous sa responsabilité."]}, {"k": "list", "h": "ÉCOUTE ACTIVE ET RÉPÉTITION (READ-BACK)", "items": ["**Répéter ce qui a été entendu** : prescription, dose, examen, délai. Ex. « Je répète : … ». L'interlocuteur confirme ou corrige.", "Demander une précision dès qu'un doute apparaît. Une consigne mal comprise vaut mieux d'être reposée que d'être exécutée de travers.", "Si la réponse ne semble pas adaptée à l'état de l'enfant, **redire l'inquiétude** avec les chiffres, ou faire appel à l'IR / à un échelon supérieur.", "Noter l'heure de l'appel, le nom de la personne jointe et ce qui a été décidé."]}, {"k": "list", "h": "TRANSMISSIONS DE RELÈVE ET DOSSIER INFIRMIER", "items": ["La relève est un **échange d'informations et un transfert de responsabilité** : la personne qui reçoit doit pouvoir poser des questions.", "À transmettre pour chaque enfant : identité, âge, poids, diagnostic, **allergies**, état de la nuit ou de la période, constantes et évolution, traitements et perfusion, douleur, alimentation/diurèse, soins faits et à faire, examens attendus, état des parents.", "**Dossier infirmier** : feuille de température, poids et paramètres, feuille d'observations, prescriptions, traitements, diététique, kinésithérapie, anamnèse infirmière.", "**Transmissions ciblées** : une donnée, une action, un résultat. Ex. « Fièvre à 38,8 °C : paracétamol donné à 10h : T° 37,9 °C à 11h ».", "Écris vite, lisiblement et avec l'heure. Ce qui n'est pas noté est considéré comme non fait.", "Pendant le rapport, rester hors de la tisanerie et répondre aux sonnettes pour ne pas déranger la relève."]}, {"k": "list", "h": "APPEL EN URGENCE", "items": ["Enfant qui se dégrade (respiration, conscience, couleur, SpO2 qui chute) : **appeler l'aide d'abord**, ne pas rester seul(e) avec l'enfant, puis transmettre en SBAR ultra-court.", "Version minimale : « Je suis [nom], chambre X, enfant de [âge], [problème], FR/FC/SpO2 : [valeurs]. Mon évaluation : [évaluation]. **Demande : venir tout de suite.** »", "Rester auprès de l'enfant, appliquer les gestes prévus (position, O2, monitoring) et préparer le matériel en attendant l'équipe."]}, {"k": "list", "h": "COMMUNICATION AVEC LES PARENTS ET CONFIDENTIALITÉ", "items": ["Se présenter, se mettre au niveau de l'enfant, utiliser des mots simples. Expliquer aux parents un peu plus en détail si besoin.", "**Écouter les parents** : ils connaissent leur enfant, leur inquiétude est une information à transmettre dans le SBAR.", "Si la réponse n'est pas connue, le dire (« je suis stagiaire, je me renseigne et je reviens vers vous ») et revenir effectivement.", "Respecter leur culture, leurs craintes et leurs décisions. Éviter tout jugement.", "**Confidentialité** : ne parler d'un enfant qu'aux professionnels impliqués dans ses soins, à voix basse, hors couloir et hors chambre voisine. Ne donner aucune information à un tiers non autorisé."]}, {"k": "table", "h": "EXEMPLE FICTIF DE TRANSMISSION SBAR (ENFANT IMAGINAIRE, VALEURS PLAUSIBLES)", "cols": ["LETTRE", "CE QU'ON DIT"], "rows": [["**S**", "Je suis [prénom], étudiant(e) avec l'IR, service pédiatrie. Chambre 12, Léo (enfant fictif), 18 mois, 11 kg. J'appelle car il respire plus vite et se fatigue. FR 58/min, FC 158/min, SpO2 91 % à l'air ambiant, T° 38,2 °C, TA 90/50 mmHg."], ["**B**", "Hospitalisé hier pour bronchiolite. Pas d'allergie connue. Perfusion en cours, O2 non encore démarré. Il buvait bien hier, il refuse le biberon depuis ce matin."], ["**A**", "Mon évaluation : son état respiratoire se dégrade, avec tirage visible et SpO2 en baisse depuis ce matin. Je suis inquiet(e)."], ["**R**", "Pouvez-vous venir l'examiner dans les 10 minutes ? Dois-je démarrer l'O2 en attendant ? Je le surveille en continu et je rappelle si la SpO2 baisse encore."]]}], "alerte": ["Un appel sans chiffres ni demande précise (« il ne va pas bien ») fait perdre du temps : toujours donner constantes + délai souhaité.", "Une inquiétude des parents ou un « mauvais pressentiment » du soignant se transmet, même si les constantes sont encore correctes.", "Ne jamais exécuter une prescription orale non répétée et non confirmée.", "Allergies et poids oubliés dans la transmission : erreurs de médicament possibles."], "stage": ["Préparer les valeurs (FR, FC, SpO2, T°, TA, poids, allergies) avant tout appel et garder le dossier en main.", "S'annoncer, dérouler S-B-A-R, puis formuler la demande avec un délai.", "Répéter la prescription ou la consigne reçue, puis informer l'IR.", "Noter l'heure, la personne jointe et la décision dans le dossier.", "Encoder les paramètres et rédiger les transmissions écrites dans le dossier informatisé avec l'IR.", "Faire le rapport à l'infirmier avant de quitter le service ou la pause si un patient a été pris en charge.", "Informer les parents de ce qui est décidé, en mots simples, et revenir vers eux."], "retenir": ["SBAR = Situation, Background (Contexte), Assessment (Évaluation), Recommendation (Demande).", "Pédiatrie : âge, poids, motif, FR/FC/SpO2/T°/TA, évolution, allergies, traitements, évaluation, demande et délai.", "Toujours répéter ce qui a été entendu (read-back).", "Urgence : appeler l'aide d'abord, SBAR minimal, rester auprès de l'enfant."]}}, {"k": "fiche", "part": "add", "chap": "Additionnelles : Relation et protection", "title": "Communiquer avec l'enfant selon son âge", "d": {"groupe": "Relation et protection", "bref": "Adapter les mots, le moment et le matériel au stade de développement pour rassurer l'enfant, obtenir sa coopération et réduire peur et douleur pendant les soins.", "sections": [{"k": "list", "h": "PRINCIPES VALABLES À TOUT ÂGE", "items": ["**Se présenter**, appeler l'enfant par son prénom, s'intéresser à ce qu'il aime (famille, école, hobbies) et utiliser des mots simples qu'il comprend.", "**Se mettre à son niveau** (à hauteur de ses yeux) : s'accroupir ou s'asseoir, ne pas parler d'en haut.", "**Dire la vérité** avec des termes adaptés à l'âge : ne jamais mentir ni user de supercherie (« ça ne fera pas mal » si c'est faux), l'enfant et ses parents ont besoin d'avoir confiance.", "Parler **de ce qui va se passer, de ce qu'il va ressentir** (pression, froid, odeur) et de ce qu'il peut faire pour aider ; annoncer chaque changement avant qu'il arrive.", "Utiliser des **phrases positives** (« garde ton bras bien détendu ») plutôt que des interdits ou des menaces.", "L'enfant exprime ce qu'il vit par ses attitudes et ses comportements : **observer** (jeu, regard, agitation, repli) et partager ses observations en équipe.", "Le soin est une occasion d'entrer en relation, pas seulement un acte technique."]}, {"k": "list", "h": "PRÉPARER UN SOIN : QUAND ET COMMENT", "items": ["**Quand prévenir** : peu de temps avant le soin (inutile de prévenir longtemps à l'avance, cela ne fait que créer de l'angoisse) ; plus tôt pour un adolescent et pour une hospitalisation programmée.", "**Expliquer** : pourquoi, comment, combien de temps, ce qu'il sentira, ce qu'il peut faire.", "**Laisser choisir** ce qui est négociable : le moment, le côté (bras droit ou gauche), la position (sur les genoux du parent ou sur le lit), le doudou ou la distraction. Ne pas proposer de choix quand le soin est obligatoire (ne pas demander « tu veux ? »).", "**Consentement et assentiment** : les parents donnent leur accord pour les soins ; les mineurs sont associés aux décisions selon leur discernement (loi sur les droits du patient) : à confirmer avec le service ; l'enfant est informé selon son âge et sa compréhension et son avis est recherché (assentiment) ; sauf urgence, rien ne se fait à l'insu des parents.", "Matériel **prêt avant** d'entrer, 3 soignants maximum dans la salle de soins, aide demandée si besoin (parent ou collègue)."]}, {"k": "list", "h": "PLACE DES PARENTS", "items": ["Le parent fait partie de la relation de soin : l'accueillir, l'informer clairement, le rassurer et l'écouter ; **gagner d'abord sa confiance** pour gagner celle de l'enfant.", "Proposer au parent un **rôle précis** pendant le soin : tenir, câliner, parler, chanter, distraire ; discuter avec lui de la position la moins stressante.", "Un parent très anxieux augmente l'anxiété de l'enfant : le rassurer et, si besoin, lui proposer une autre place ou un autre rôle.", "Le soignant **ne remplace pas** le parent : il le complète. Il est normal que l'enfant pleure au départ des parents ; le contraire serait inquiétant.", "Faire l'adieu au bord du lit : l'enfant doit savoir où sont ses parents et quand ils reviennent. Ne jamais partir en cachette."]}, {"k": "list", "h": "JEU, MATÉRIEL ET DISTRACTION", "items": ["Le jeu est le **mode de vie** de l'enfant : il l'aide à comprendre ce qu'il vit, à exprimer craintes et fantaisies et à surmonter peurs et angoisses.", "**Jeu thérapeutique** : laisser l'enfant manipuler le matériel (stéthoscope, compresses, masque) et rejouer le soin sur une **poupée ou un nounours** avant de le recevoir.", "Laisser les objets rassurants (doudou, poupée, jouet préféré, objet d'un parent) ; proposer la salle de jeux et l'éducateur(trice) du service.", "**Distraction pendant le soin** : chansons, histoires, bulles, livres, vidéos, jeux sur écran ; adapter à l'âge et choisir avec l'enfant.", "Observer le jeu de l'enfant : il renseigne sur ses peurs, son attention et sa tolérance à la frustration."]}, {"k": "list", "h": "DOULEUR ET SOINS : APPROCHE PRATIQUE", "items": ["**Évaluer avec l'échelle adaptée à l'âge** : EVENDOL en hétéro-évaluation de 0 à 4-6 ans ; auto-évaluation par échelle des 6 visages, EVA ou échelle numérique quand l'enfant peut se situer.", "Associer **méthodes non médicamenteuses** (distraction, jeux, chansons, vidéos, doudou ou tétine, histoires, présence des parents) et **prévention médicamenteuse** (MEOPA, Emla®, glucose 30 %), selon la prescription et le protocole du service.", "Chez le nourrisson : solution sucrée (glucose 30 %) déposée sur la langue, succion, contact peau à peau, emmaillotage.", "**Réévaluer** la douleur régulièrement et 30 minutes après une analgésie."]}, {"k": "list", "h": "DROITS DE L'ENFANT HOSPITALISÉ", "items": ["Avoir ses **parents ou un substitut** auprès de lui jour et nuit, quels que soient son âge et son état ; visiteurs acceptés sans limite d'âge.", "Recevoir, avec ses parents, une **information adaptée à son âge et à sa compréhension** afin de participer aux décisions qui le concernent.", "Éviter tout examen ou traitement non indispensable et **réduire au maximum agressions physiques, émotionnelles et douleur**.", "Être regroupé par âge, avec jeux, loisirs et activités éducatives adaptés ; **intimité respectée** et traitement avec tact en toute circonstance.", "Une équipe formée aux besoins psychologiques de l'enfant et de sa famille, avec une continuité des soins."]}, {"k": "table", "h": "COMMUNIQUER SELON LE STADE DE DÉVELOPPEMENT", "cols": ["STADE", "COMPRÉHENSION ET PEURS TYPIQUES", "COMMENT PARLER ET AGIR", "JEU, PRÉPARATION, PARENTS"], "rows": [["**Nourrisson (28 jours à 1 an)**", "Pas de compréhension des explications. Reconnaît sa mère par l'odeur dès les premiers jours. Vers 8 mois : angoisse de l'étranger (baisse les yeux, se détourne, pleure) ; angoisse de perte de la mère encore plus précoce.", "Voix douce, calme, contact visuel ; gestes lents, mains chaudes ; présentation progressive avant de le prendre ; soins rapides et rythmés. Éviter de l'arracher aux bras du parent.", "Pas de préparation verbale : confort physique (tétée, peau à peau, emmaillotage, tétine, doudou, glucose 30 % pour un geste invasif mineur). Parent présent et porteur du réconfort."], ["**Trottineur (1 à 3 ans)**", "Comprend peu les explications, capacité très limitée à se représenter l'avenir. Peur de la séparation, de l'étranger, du soin imprévu ; dit « non » (12-18 mois). Peut régresser (retour en arrière) lors de l'hospitalisation.", "Phrases très courtes et concrètes, dites juste avant le soin ; parler d'un geste à la fois ; ton rassurant. Éviter longues explications et surprises. Proposer de petits choix réels (quel pansement, quelle couleur).", "Doudou, jouets personnels, comptines, bulles, livres. Laisser toucher le matériel (tolère mal l'inconnu). Parent présent, dans ses bras ou tout près."], ["**Préscolaire (3 à 6 ans)**", "Pensée magique : peut croire que la maladie ou le soin est une punition ou sa faute ; imagine des scénarios effrayants. Peur de la douleur, des mutilations (piqûre, « trou »), de la séparation. Début de pudeur.", "Mots simples, vrais et concrets ; dire explicitement que **ce n'est pas une punition ni sa faute**. Éviter les mots à double sens (« endormir », « couper », « une petite piqûre de rien »). Préparer peu de temps avant (le jour même ou quelques jours pour une hospitalisation).", "**Poupée ou nounours**, jeu thérapeutique, dessin, histoires, livre d'accueil : l'enfant rejoue le soin et exprime ses peurs. Respecter la pudeur (couvrir). Parent présent avec un rôle."], ["**Scolaire (6 à 12 ans)**", "Comprend explications logiques et le fonctionnement du corps ; veut savoir et comprendre. Peur de la douleur, de la perte de contrôle, du regard des pairs. Pudeur marquée.", "Explications simples mais vraies et complètes, avec schémas ou démonstration ; répondre à toutes les questions ; valoriser sa coopération. Impliquer dans les décisions et laisser des choix. Prévenir l'enfant de 7 ans et plus 1 à 2 semaines avant une hospitalisation programmée.", "Montrer le matériel, laisser l'essayer (sur poupée ou sur soi), jeux, école à l'hôpital, techniques de respiration ou d'imagination. Préserver l'intimité ; parent présent si l'enfant le souhaite. Auto-évaluation de la douleur possible."], ["**Adolescent (dès 12 ans)**", "Corps en transformation, mal-être possible ; grande pudeur ; besoin d'autonomie, d'intimité et de contrôle ; peur du regard et de la douleur. Souhaite une information complète, y compris sur la douleur et les complications.", "S'adresser **à lui directement** (pas uniquement aux parents), avec respect, sans infantiliser ; information détaillée et honnête. Proposer de parler seul(e) à seul(e) si besoin pour les questions gênantes ; l'impliquer dans la planification du soin ; solliciter son accord (assentiment).", "Intimité maximale (porte fermée, couvrir, limiter le nombre de soignants). Musique, écran, activités entre pairs. Parent présent selon son choix ; respecter la confidentialité dans le cadre légal."]]}], "alerte": ["**Mentir ou minimiser** (« ça ne fera pas mal », « c'est fini ») détruit la confiance, rend les soins suivants plus difficiles et augmente la peur.", "**Ne jamais laisser un enfant seul** (salle d'attente, couloir, examen) et ne jamais partir en cachette : la séparation brutale est source d'angoisse majeure.", "**Prévenir trop tôt** un soin crée de l'angoisse ; prévenir trop tard ou pas du tout rompt la confiance.", "Un enfant très calme, figé ou en retrait peut avoir mal ou être très angoissé : **ne pas confondre silence et absence de douleur**.", "Attention aux mots à double sens (« endormir », « couper ») chez le jeune enfant, et aux comparaisons qui culpabilisent (« sois sage, sinon... »)."], "stage": ["Se présenter à l'enfant et aux parents en entrant dans la chambre, mettre l'enfant en confiance et se mettre à sa hauteur.", "Adapter les mots à l'âge : vérifier la compréhension en demandant à l'enfant de reformuler ou de montrer.", "Annoncer le soin juste avant, expliquer ce qui va être ressenti, proposer des choix possibles et préparer le matériel avant d'entrer.", "Proposer un rôle au parent (tenir, câliner, distraire) et rassurer un parent inquiet ; signaler être stagiaire et chercher la réponse quand on ne sait pas.", "Participer à la distraction : jouets, chansons, bulles, vidéos, histoires, jeu sur poupée, salle de jeux.", "Évaluer la douleur avec l'échelle adaptée, transmettre à l'infirmier(ère) et réévaluer après analgésie.", "Respecter la pudeur et l'intimité, surtout chez le grand enfant et l'adolescent ; limiter le nombre de soignants présents.", "Transmettre les peurs, réactions et comportements observés à l'équipe."], "retenir": ["Toujours dire la vérité, avec des mots adaptés à l'âge, juste avant le soin.", "Se mettre à hauteur de l'enfant, impliquer les parents, laisser des choix réels.", "Nourrisson : confort physique et parent ; 1-3 ans : séparation, peu de mots ; préscolaire : pensée magique, jeu et poupée ; scolaire : expliquer et comprendre ; adolescent : respect, intimité, autonomie.", "Douleur : échelle adaptée à l'âge + distraction + prévention (MEOPA, Emla®, glucose 30 %)."]}}, {"k": "fiche", "part": "add", "chap": "Additionnelles : Relation et protection", "title": "Maltraitance : repérer et réagir", "d": {"groupe": "Relation et protection", "bref": "Savoir évoquer une maltraitance (indices cliniques, récit, comportement), adopter les bons gestes d'observation et de transmission, et situer le rôle du service S 51 et du réseau belge francophone.", "sections": [{"k": "list", "h": "LES FORMES DE MALTRAITANCE", "items": ["**Physique** : coups, secouement, brûlures, fractures, intoxications provoquées.", "**Psychologique** : humiliation, rejet, menaces, exposition à la violence conjugale ou aux conflits parentaux.", "**Négligence** : besoins de base non assurés (alimentation, hygiène, soins, suivi médical, surveillance, affection).", "**Sexuelle** : tout acte à caractère sexuel imposé à l'enfant.", "**Syndrome du bébé secoué** : secouement violent d'un nourrisson, responsable de lésions cérébrales graves, parfois mortelles, avec séquelles fréquentes chez les survivants.", "Les formes sont souvent associées : une négligence peut cacher une violence physique, et inversement."]}, {"k": "list", "h": "QUAND L'ÉVOQUER : LES INDICES DANS LE RÉCIT ET LA PRISE EN CHARGE", "items": ["**Récit discordant** : histoire changeante, incompatible avec les lésions, ou improbable pour l'âge et le développement de l'enfant.", "**Délai inexpliqué** entre la survenue des lésions et la consultation.", "**Lésions répétées** ou non justifiées, ou lésions d'âges différents.", "**Attitude des parents inadaptée** par rapport à la clinique (désintérêt, minimisation, excès d'agressivité, refus d'examens ou d'hospitalisation).", "**Comportement de l'enfant** : peur, retrait, hypervigilance ou au contraire familiarité excessive, tristesse, régression, agressivité ; certains signes sont peu spécifiques, d'où l'importance de les noter sans conclure."]}, {"k": "list", "h": "QUAND L'ÉVOQUER : LES INDICES CLINIQUES", "items": ["**Ecchymoses** : tout hématome chez un enfant qui ne marche pas encore est suspect ; chez le petit de moins de 4 ans, localisations préoccupantes : tronc (thorax, abdomen, dos, fesses, région génitale), oreille, cou, frein de la langue, angle de la mâchoire, joues, paupières, conjonctives ; chez le nourrisson de 4 mois ou moins, tout hématome ; marque en forme d'objet, de main ou de morsure.", "**Fractures** : fracture sans traumatisme crédible, surtout avant l'âge de la marche, ou fractures multiples d'âges différents ; une fracture fémorale impose de vérifier que l'anamnèse est concordante.", "**Brûlures** : limites nettes, forme évoquant un objet ou une immersion, localisation inhabituelle pour un accident.", "**Traumatisme crânien non accidentel / bébé secoué** : signes souvent non spécifiques (irritabilité, vomissements, somnolence, malaise, convulsions, pâleur) ; les examens (imagerie cérébrale, fond d'œil) et l'évaluation par une équipe pluridisciplinaire confirment ou non le diagnostic.", "Une lésion isolée ne prouve rien : c'est la cohérence entre lésion, âge, développement et récit qui compte."]}, {"k": "list", "h": "FACTEURS DE RISQUE", "items": ["**Enfant** : très jeune âge, prématurité, handicap, pleurs inconsolables, enfant « différent » ou difficile.", "**Parents** : isolement, épuisement, violence conjugale, antécédents de maltraitance subie, troubles psychiques, addictions, immaturité.", "**Contexte** : précarité, conflits familiaux, séparation conflictuelle, stress important.", "Un facteur de risque oriente la vigilance mais n'est jamais une preuve."]}, {"k": "list", "h": "CONDUITE À TENIR DE L'INFIRMIER(ÈRE)", "items": ["**Protéger l'enfant** : sa sécurité passe avant tout ; suivre les consignes de surveillance et de visite données par l'équipe.", "**Observer et noter factuellement** dans le dossier : description précise des lésions (siège, taille, couleur, forme), heure, personnes présentes, comportement de l'enfant et des parents.", "**Noter les mots de l'enfant entre guillemets**, tels quels, sans les reformuler ni les interpréter.", "**Ne pas interroger l'enfant** de façon insistante ni suggestive : écouter s'il parle, rester calme et rassurant, ne pas promettre le secret.", "**Ne pas juger ni accuser** les parents, ne pas les confronter seul(e).", "**Alerter sans tarder** l'infirmier(ère) de référence, le médecin et l'équipe pluridisciplinaire ; la décision se prend en équipe.", "**Soutenir l'enfant** : présence, soins, confort, douleur, maintien de repères."]}, {"k": "list", "h": "CONTEXTE BELGE FRANCOPHONE", "items": ["**Équipes SOS-Enfants** (ONE) : accueil, évaluation pluridisciplinaire et accompagnement des situations de maltraitance ; elles peuvent être contactées notamment par des professionnels de santé, y compris pour partager un doute ou une inquiétude.", "**Écoute-Enfants 103** : ligne d'écoute gratuite, ouverte aux enfants, aux adolescents, aux adultes et aux professionnels (tous les jours de 10 h à minuit).", "**Secret professionnel** : le Code pénal (art. 458bis) **permet** (n'oblige pas) à un professionnel tenu au secret d'informer le procureur du Roi, sous conditions strictes : victime mineure ou personne vulnérable, infractions visées, danger grave et imminent pour son intégrité, impossibilité de la protéger seul ou avec l'aide de tiers. L'appréciation revient au médecin et à l'équipe, jamais à l'étudiant(e) seul(e).", "La décision de signaler à une autorité revient à l'équipe, pas à l'étudiant(e) seul(e) : transmettre à l'équipe, qui applique la procédure de l'institution."]}, {"k": "list", "h": "SPÉCIFICITÉ DU SERVICE S 51", "items": ["Le S 51 est un service de pneumologie et d'infectiologie pédiatrique qui comprend une **unité de cellule-maltraitance de 6 lits** (sur 30 lits au total).", "Cette unité accueille des enfants en situation difficile : abus, négligences, violences, conflits parentaux.", "Prise en charge **pluridisciplinaire psycho-médico-sociale** ; séjour moyen de **2 à 3 semaines**, le temps de trouver une solution adaptée à chaque enfant.", "Une médecin référente en cellule-maltraitance et pédiatrie générale est identifiée dans le service."]}], "alerte": ["Récit changeant, incompatible avec la lésion ou consultation tardive : penser à la maltraitance et alerter l'équipe, même sans certitude.", "Tout hématome chez un nourrisson qui ne se déplace pas est suspect ; tronc, oreille, cou, joues, frein : redoubler d'attention.", "Nourrisson irritable, vomisseur, somnolent ou convulsant sans cause claire : penser au secouement.", "Ne jamais confronter, accuser ni interroger : cela peut compromettre la protection de l'enfant et la suite de la procédure.", "Ne jamais promettre le secret à l'enfant."], "stage": ["Observer les lésions et le comportement de l'enfant lors des soins et les décrire précisément dans le dossier.", "Noter les paroles de l'enfant entre guillemets, avec l'heure et le contexte.", "Signaler immédiatement tout doute à l'infirmier(ère) de référence, sans attendre la fin du service.", "Rester factuel(le) et neutre avec les parents ; ne pas poser de questions d'enquête.", "Assurer les soins, le confort et la sécurité de l'enfant ; respecter les consignes de visite et de surveillance données par l'équipe.", "Participer aux transmissions et poser des questions sur la procédure du service."], "retenir": ["Évoquer : récit discordant, retard de consultation, lésions répétées ou suspectes pour l'âge.", "Observer, noter factuellement, alerter l'équipe : ni enquête, ni jugement, ni confrontation seul(e).", "Mots de l'enfant entre guillemets ; ne jamais promettre le secret.", "S 51 : unité de cellule-maltraitance de 6 lits, prise en charge pluridisciplinaire, séjour moyen de 2 à 3 semaines."]}}];
var PARTS={ess:'Essentiels',normes:'Normes',patho:'Pathologies',proc:'Soins',drug:'Médicaments',add:'Additionnelles'};
var ORDER=['ess','normes','patho','proc','drug','add'];
var CHIPC={ess:'var(--c-ess)',normes:'var(--c-normes)',patho:'var(--c-patho)',proc:'var(--c-proc)',drug:'var(--c-drug)',add:'var(--c-add)'};
var NF=PAGES.length-1;
var cur=0, done={}, opened={};
try{done=JSON.parse(localStorage.getItem('fiches_done')||'{}')}catch(e){}
try{opened=JSON.parse(localStorage.getItem('som_open')||'{}')}catch(e){}
function saveDone(){try{localStorage.setItem('fiches_done',JSON.stringify(done))}catch(e){}}
function saveOpen(){try{localStorage.setItem('som_open',JSON.stringify(opened))}catch(e){}}
function isDone(i){return !!done[PAGES[i].title]}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function f(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^⚠\s*/,'')}
function plain(s){return String(s).replace(/\*\*/g,'').replace(/\*/g,'')}
function sub(p){return String(p.chap||'').replace(/^[^:]*:\s*/,'')}
function ul(a,c){return a&&a.length?'<ul class="l '+(c||'')+'">'+a.map(function(x){return '<li>'+f(x)+'</li>'}).join('')+'</ul>':''}
function blk(t,a,c){return a&&a.length?'<section class="blk"><h2>'+t+'</h2>'+ul(a,c)+'</section>':''}
function box(cls,t,a){return a&&a.length?'<section class="box '+cls+'"><h2>'+t+'</h2>'+ul(a)+'</section>':''}
function head(p,kick,lead){return '<h1>'+f(p.title)+'</h1>'+(lead?'<p class="lead">'+f(lead)+'</p>':'')}
function band(p,i){return '<div class="band"><span>'+esc(PARTS[p.part])+' · '+esc(sub(p))+'</span><span>'+i+' / '+NF+'</span></div>'}
function foot(i){return '<div class="foot"><span>Fiche '+i+' sur '+NF+'</span><button class="done" id="bDone" type="button" aria-pressed="'+isDone(i)+'">'+(isDone(i)?'✓ Fiche acquise':'Marquer comme acquise')+'</button></div>'}
function table(t){return (t.t?'<h3 class="tt">'+esc(t.t)+'</h3>':'')+'<div class="tw"><table><thead><tr>'+t.cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+
  t.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+f(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function pagePatho(p){var d=p.d;
 return '<div class="kick">Pathologie · '+esc(d.groupe)+'</div>'+head(p,0,d.bref)+
 '<div class="grid">'+blk('Signes et symptômes',d.signes)+blk('Causes',d.causes)+'</div>'+
 box('alert','Attention',d.alerte)+
 '<div class="grid">'+blk('Complications',d.complications)+blk('Examens',d.examens)+'</div>'+
 blk('Traitement',d.traitement)+
 '<div class="grid">'+box('stage','En stage',d.stage)+box('ret','À retenir',d.retenir)+'</div>';}
function pageProc(p){var d=p.d;
 return '<div class="kick">Soin · '+esc(d.groupe)+'</div>'+head(p,0,d.but)+
 '<div class="grid">'+blk('Matériel',d.materiel,'chk')+blk('Vigilance',d.vigilance)+'</div>'+
 (d.etapes&&d.etapes.length?'<section class="blk"><h2>Étapes</h2><ol class="l">'+d.etapes.map(function(x){return '<li>'+f(x)+'</li>'}).join('')+'</ol></section>':'')+
 '<div class="grid">'+blk('Avec l’enfant',d.enfant)+blk('Surveillance',d.surveillance)+'</div>'+
 box('alert','Attention',d.alerte)+box('ret','À retenir',d.retenir);}
function pageDrug(p){var d=p.d;var idl='';
 if(d.noms)idl+='<dt>Noms commerciaux</dt><dd>'+f(d.noms)+'</dd>';
 if(d.molecule)idl+='<dt>Molécule</dt><dd>'+f(d.molecule)+'</dd>';
 if(d.famille)idl+='<dt>Famille</dt><dd>'+f(d.famille)+'</dd>';
 return '<div class="kick">Médicament · '+esc(d.groupe)+'</div>'+head(p,0,'')+(idl?'<dl class="id">'+idl+'</dl>':'')+
 '<div class="grid">'+blk('À quoi ça sert',d.sert)+(d.dose&&d.dose.length?'<section class="box dose"><h2>Doses</h2>'+ul(d.dose)+'</section>':'')+'</div>'+
 '<div class="grid">'+blk('Voie d’administration',d.voie)+blk('Effets indésirables fréquents',d.effets)+'</div>'+
 blk('Précautions d’administration',d.precautions)+box('alert','Attention',d.alerte)+
 '<div class="grid">'+box('stage','Rôle infirmier',d.stage)+box('ret','À retenir',d.retenir)+'</div>';}
/* fiches Normes et Essentiels */
function pageFiche(p){var d=p.d,body;
 if(d.sections){body=d.sections.map(function(x){return x.k==='table'?table({t:x.h,cols:x.cols,rows:x.rows}):blk(esc(x.h),x.items)}).join('')}
 else{body=(d.tables||[]).map(table).join('')+
  (d.etapes&&d.etapes.length?'<section class="blk"><h2>Étapes</h2><ol class="l">'+d.etapes.map(function(x){return '<li>'+f(x)+'</li>'}).join('')+'</ol></section>':'')+
  (d.blocks||[]).map(function(b){return blk(esc(b[0]),b[1])}).join('')}
 return '<div class="kick">'+({ess:'Essentiel',add:'Fiche additionnelle'}[p.part]||'Norme')+' · '+esc(d.groupe)+'</div>'+head(p,0,d.bref)+body+
 box('alert','Attention',d.alerte)+
 '<div class="grid">'+box('stage','En stage',d.stage)+box('ret','À retenir',d.retenir)+'</div>';}
/* accueil + sommaire complet */
function pageHome(){
 var n={},ok={},nd=0;ORDER.forEach(function(k){n[k]=0;ok[k]=0});
 PAGES.forEach(function(p,i){if(!p.part)return;n[p.part]++;if(isDone(i)){ok[p.part]++;nd++}});
 var h='<div class="body home"><div class="hero"><img class="logo-big" src="logo.svg" alt="Logo : ourson infirmier" width="120" height="120">'+
  '<div><div class="kick">Fiches de poche</div><h1>Stage de pédiatrie</h1><p class="sub">Service S 51 · '+NF+' fiches'+(nd?' · <span class="ok">'+nd+' acquises ✓</span>':'')+'</p></div></div>'+
  '<button class="btn" type="button" id="bSearch2">Rechercher une fiche</button>'+
  '<h2 class="somt">Sommaire</h2>';
 ORDER.forEach(function(k){
  h+='<details class="part" data-k="'+k+'" style="--c:'+CHIPC[k]+'"'+(opened[k]?' open':'')+'><summary><span class="pn">'+esc(PARTS[k])+'</span><span class="pc">'+(ok[k]?'<span class="ok">'+ok[k]+' ✓</span> · ':'')+n[k]+' fiches</span></summary>';
  var groups=[],gi={};
  PAGES.forEach(function(p,i){if(p.part!==k)return;var c=sub(p);if(!(c in gi)){gi[c]=groups.length;groups.push({c:c,items:[]})}groups[gi[c]].items.push(i)});
  groups.forEach(function(g){var key=k+'/'+g.c,gok=g.items.filter(isDone).length;
   h+='<details class="theme" data-k="'+esc(key)+'"'+(opened[key]?' open':'')+'><summary><span class="tn">'+esc(g.c)+'</span><span class="pc">'+(gok?'<span class="ok">'+gok+' ✓</span> · ':'')+g.items.length+'</span></summary>';
   g.items.forEach(function(i){h+='<a class="row" href="#p'+i+'"><span class="t">'+f(PAGES[i].title)+'</span>'+(isDone(i)?'<span class="ok">✓</span>':'')+'</a>'});
   h+='</details>';});
  h+='</details>';});
 return h+'<p class="note">Ces fiches sont un outil d’étude. Les doses sont des valeurs de référence : elles ne remplacent jamais la prescription médicale ni les protocoles du service. En cas de doute, demande à ton infirmier de référence.</p></div>';}
function render(){
 var p=PAGES[cur],h,cls='sheet';
 if(p.k==='home'){h=pageHome()}
 else{cls+=' p-'+p.part;
  var inner=p.k==='patho'?pagePatho(p):p.k==='proc'?pageProc(p):p.k==='drug'?pageDrug(p):pageFiche(p);
  h=band(p,cur)+'<div class="body">'+inner+'</div>'+foot(cur);}
 var s=document.getElementById('sheet');s.className=cls;s.innerHTML=h;
 document.getElementById('brand').innerHTML=p.k==='home'?'Stage de pédiatrie<small>Fiches · Service S 51</small>':esc(PARTS[p.part])+'<small>'+esc(plain(p.title))+'</small>';
 document.getElementById('pg').textContent=cur?cur+' / '+NF:'Accueil';
 document.getElementById('bPrev').disabled=cur===0;document.getElementById('bNext').disabled=cur===PAGES.length-1;
 var bd=document.getElementById('bDone');if(bd)bd.onclick=function(){var t=PAGES[cur].title;if(done[t])delete done[t];else done[t]=1;saveDone();bd.setAttribute('aria-pressed',!!done[t]);bd.textContent=done[t]?'✓ Fiche acquise':'Marquer comme acquise'};
 Array.prototype.forEach.call(s.querySelectorAll('details.part,details.theme'),function(dt){dt.addEventListener('toggle',function(){if(dt.open)opened[dt.dataset.k]=1;else delete opened[dt.dataset.k];saveOpen()})});
 var b2=document.getElementById('bSearch2');if(b2)b2.onclick=openSearch;
 window.scrollTo(0,0);
}
function go(i,noHash){i=Math.max(0,Math.min(PAGES.length-1,i));cur=i;if(!noHash){try{history.replaceState(null,'','#p'+i)}catch(e){location.hash='p'+i}}render()}
function fromHash(){var m=/^#p(\d+)$/.exec(location.hash);return m?parseInt(m[1],10):0}
window.addEventListener('hashchange',function(){go(fromHash(),true)});
document.getElementById('bPrev').onclick=function(){go(cur-1)};
document.getElementById('bNext').onclick=function(){go(cur+1)};
document.getElementById('bToc').onclick=function(){go(0)};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
var tx=0,ty=0,tt=null;
document.getElementById('sheet').addEventListener('touchstart',function(e){tt=e.target;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.getElementById('sheet').addEventListener('touchend',function(e){if(tt&&tt.closest&&tt.closest('.tw'))return;var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dy)<45){go(cur+(dx<0?1:-1))}},{passive:true});
/* recherche */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
var IDX=PAGES.map(function(p){return norm(JSON.stringify(p))});
function openSearch(){
 var ov=document.createElement('div');ov.className='ov';
 ov.innerHTML='<div class="pan"><input id="q" type="search" placeholder="Pathologie, soin, médicament, norme…" autocomplete="off"><div class="res" id="res"></div><p><button class="ib" id="xs" type="button">Fermer</button></p></div>';
 document.body.appendChild(ov);var q=document.getElementById('q'),res=document.getElementById('res');q.focus();
 function close(){ov.remove()}
 document.getElementById('xs').onclick=close;ov.addEventListener('click',function(e){if(e.target===ov)close()});
 q.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 q.addEventListener('input',function(){var t=norm(q.value.trim());if(t.length<2){res.innerHTML='';return}
  var out=[];PAGES.forEach(function(p,i){if(p.k==='home')return;var inT=norm(p.title).indexOf(t)>=0,inB=IDX[i].indexOf(t)>=0;if(inT||inB)out.push([inT?0:1,i])});
  out.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
  res.innerHTML=out.slice(0,40).map(function(o){var p=PAGES[o[1]];return '<a href="#p'+o[1]+'"><strong>'+esc(plain(p.title))+'</strong><small>'+esc(PARTS[p.part])+' · '+esc(sub(p))+(o[0]?' · cité dans la fiche':'')+'</small></a>'}).join('')||'<p>Aucun résultat.</p>';
  Array.prototype.forEach.call(res.querySelectorAll('a'),function(a){a.addEventListener('click',close)});});
}
document.getElementById('bSearch').onclick=openSearch;
go(fromHash(),true);
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
