romycine) ou clindamycine (résistances en hausse)", "Correspondances : Clamoxyl® = Amoxicilline ; Dalacin = Clindamycine", "Reprise des activités après 24 h d'ATB et défervescence", "Guérison en 3 à 6 jours, mortalité < 1 %"], "stage": ["Pathologie de dermatologie rencontrée en salle 51"], "retenir": ["Joues rouges + pâleur péribuccale + langue framboisée", "Strepto A : amoxicilline ou pénicilline V pendant 10 jours", "Reprise des activités après 24 h d'ATB"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Lymphangite", "d": {"id": "p2-lymphangite", "titre": "Lymphangite", "groupe": "Peau", "bref": "Inflammation bactérienne des vaisseaux lymphatiques.", "signes": ["Départ : petit traumatisme cutané ou zone infectée qui s'étend", "Général : fièvre, frissons, malaise, céphalées, perte d'appétit, douleurs musculaires, tachycardie", "Local : **traînées érythémateuses linéaires**, chaudes, sensibles, vers les ganglions", "Ganglions gonflés et douloureux", "Parfois bulles"], "alerte": ["Évolution rapide possible vers **bactériémie et sepsis** (surtout strepto A)", "Traitement précis : suivre la prescription"], "causes": ["Surtout **streptocoque du groupe A**", "Plus rarement staphylocoque doré", "Parfois Pasteurella (morsures)", "Rares : champignons (Sporothrix), mycobactéries (M. marinum), parasites"], "complications": ["Bactériémie, sepsis", "Abcès ou cellulite au foyer initial", "Lymphœdème"], "examens": [], "traitement": ["**Pénicilline** en 1re intention", "**IV** dans les formes sévères", "Élévation du membre", "Compresses chaudes"], "stage": ["**Surveillance**", "Élever le membre, compresses chaudes", "Pathologie de dermatologie rencontrée en salle 51"], "retenir": ["Traînées rouges linéaires vers les ganglions", "Strepto A le plus fréquent", "Risque de sepsis"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Vascularite à IgA (purpura rhumatoïde)", "d": {"id": "p2-vascularite-vascularite-iga-purpura-rhumatode", "titre": "Vascularite à IgA (purpura rhumatoïde)", "groupe": "Peau", "bref": "Vascularite la plus fréquente de l'enfant (anciennement Henoch-Schönlein).", "signes": ["**Peau** : papules → pétéchies, **purpura palpable** (membres inférieurs, fesses)", "**Articulations** : arthralgies ~75 % (genoux, chevilles), transitoires", "**Digestif** (50 à 65 %) : douleurs abdominales coliques, parfois abdomen aigu", "Invagination rare", "**Rein** (~50 %) : 1 à 3 mois après l'éruption", "Rein : hématurie microscopique, cylindres, protéinurie, insuffisance rénale", "Fièvre modérée, fatigue, orchite"], "alerte": ["Atteinte rénale = complication à long terme la plus grave", "Douleurs abdominales pouvant simuler un abdomen aigu", "AINS à éviter si atteinte rénale"], "causes": ["Souvent après une infection des voies respiratoires supérieures (streptocoque, parainfluenza, parvovirus B19)", "Dépôts d'IgA", "Âge moyen ~6 ans, > 90 % avant 10 ans ; plus bénigne avant 2 ans", "Incidence : 3,0 à 26,7 pour 100 000 enfants par an", "Légère prédominance masculine ; automne et hiver"], "complications": ["**Atteinte rénale** : 1 à 2 % des insuffisances rénales terminales de l'enfant", "Rechutes : 2 à 30 %, parfois jusqu'à 10 ans plus tard", "91 % des atteintes rénales dans les 6 semaines, 97 % dans les 6 mois", "Pas d'atteinte rénale à 6 mois : faible risque de maladie chronique"], "examens": ["Aucun examen indispensable au diagnostic", "Critères (sensibilité 100 %, spécificité 87 %) : **purpura des membres inférieurs obligatoire** + ≥ 1 critère parmi les suivants", "Autres critères : douleur abdominale aiguë, arthrite ou arthralgie, histologie typique (dépôts d'IgA), atteinte rénale", "Bilan : formule sanguine, coagulation, ionogramme, fonction rénale, albumine, analyse d'urine", "**Tigette urinaire** (hématurie, protéinurie), **tension**", "Biopsie cutanée si doute ; biopsie rénale si atteinte rénale progressive"], "traitement": ["94 % guérissent spontanément : traitement **symptomatique**", "**Paracétamol** (Dafalgan®) ou AINS pour les douleurs articulaires", "Corticoïdes : ne préviennent pas les complications", "**Prednisone 1 à 2 mg/kg** possible si douleurs sévères non soulagées (à confirmer avec la prescription)", "Atteinte rénale sévère : immunosuppresseurs"], "stage": ["Connaître la **dose de paracétamol par poids**", "Évaluer la douleur : **EVENDOL** (0 à 4-6 ans), EVA ou échelle numérique", "**Réévaluer 30 min après l'analgésie**", "Tigette urinaire et tension", "Si anomalie rénale au diagnostic : urine, créatinine, tension **au moins 1 fois par mois**, surveillance de 6 mois"], "retenir": ["Purpura palpable des membres inférieurs + douleurs abdominales + arthralgies", "Surveiller les reins : urine et tension", "Traitement symptomatique, pas d'AINS si atteinte rénale"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Varicelle (et varicelle surinfectée)", "d": {"id": "p2-varicelle-et-varicelle-surinfecte", "titre": "Varicelle (et varicelle surinfectée)", "groupe": "Peau", "bref": "Maladie contagieuse due au virus varicelle-zona (VZV) ; primo-infection, réactivation possible en zona.", "signes": ["Lésions : macule → papule → **vésicule** → croûte", "Lésions **à tous les stades en même temps**, pendant 5 à 7 jours", "Boutons de tailles inégales, rouges, **prurigineux**", "Fièvre, fatigue, pharyngite, céphalées, refus alimentaire", "**Contagieuse tant que toutes les lésions ne sont pas croûteuses**", "Ne pas confondre avec pieds-mains-bouche"], "alerte": ["**PAS de Nurofen** (risque de fascite nécrosante), pas d'AINS", "Éviter l'**aspirine** (syndrome de Reye)", "Pneumonie varicelleuse : mortalité de 10 à 30 % sans traitement", "⚠ Consignes sur les anti-inflammatoires : pas d'AINS (valeur habituelle), pas de Nurofen (au service S 51), éviter l'aspirine : suivre la consigne du service", "⚠ Fucidin : décrit comme « corticoïde local » au service S 51, mais c'est un antibiotique local ; seuls Fucidin Hydrocortisone et Fucicort contiennent un corticoïde : demander à l'équipe quelle préparation est utilisée"], "causes": ["Transmission par **gouttelettes** (inhalation)", "Incubation **10 à 21 jours**", "Contagiosité : de 1 à 2 jours avant l'éruption jusqu'aux croûtes", "Virus : entrée respiratoire, multiplication dans les ganglions (2 à 4 jours), virémie primaire puis secondaire (peau, organes)"], "complications": ["Surinfection bactérienne : cellulite, impétigo, érysipèle", "Pneumonie varicelleuse", "Encéphalite, ataxie cérébelleuse, Guillain-Barré", "Varicelle congénitale si infection maternelle avant 20 semaines"], "examens": ["Diagnostic clinique (lésions à tous les stades)", "**PCR** (liquide des vésicules, grattage) : meilleur rendement", "Sérologie"], "traitement": ["Traitement symptomatique chez l'enfant", "**Paracétamol** (Dafalgan®) pour la fièvre", "Antihistaminiques", "Lotion à la calamine ; toilette quotidienne à l'eau tiède", "**Aciclovir** (Zovirax®) seulement si débuté dans les **24 h** : raccourcit les symptômes d'1 jour, sans effet sur les complications", "Boutons surinfectés : Fucidin (voir alerte)", "Vaccin vivant atténué : ~85 % de protection après 1 dose, ≥ 99 % après 2"], "stage": ["**Isolement aérien** (feuille blanche) : **masque FFP2**, tablier, gants", "**Pesée quotidienne**", "**Assécher** les boutons (Diaceptyl), désinfecter", "**Couper les ongles**", "Éviction scolaire", "Connaître la **dose de paracétamol par poids**", "Douleur : **EVENDOL** (0 à 4-6 ans), EVA ou échelle numérique ; **réévaluer à 30 min**"], "retenir": ["Vésicules à tous les stades + prurit", "Isolement aérien FFP2 jusqu'aux croûtes", "Pas d'AINS ni de Nurofen, pas d'aspirine", "Aciclovir utile seulement dans les 24 h"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Érythème polymorphe", "d": {"id": "p2-rythme-polymorphe", "titre": "Érythème polymorphe", "groupe": "Peau", "bref": "Réaction immunitaire de la peau et parfois des muqueuses.", "signes": ["Lésions **« en cible »** : centre sombre, anneau rose plus clair, anneau rouge", "Atteinte muqueuse dans 25 à 60 % des cas : surtout buccale, parfois génitale ou oculaire"], "alerte": ["Diagnostic différentiel : **syndrome de Stevens-Johnson** (macules érythémateuses ou purpuriques étendues avec bulles ; l'érythème polymorphe donne des papules en cible)", "Dose d'aciclovir : à confirmer avec la prescription"], "causes": ["Infectieuse ~90 % : **HSV-1** le plus souvent, puis **Mycoplasma pneumoniae** (surtout chez l'enfant)", "Médicaments < 10 % : AINS, antiépileptiques, antibiotiques"], "complications": ["Enfant : formes récidivantes, prédominance masculine, plus d'hospitalisations, réponse moindre aux immunosuppresseurs que chez l'adulte"], "examens": ["Diagnostic sur l'aspect des lésions en cible"], "traitement": ["Selon la gravité et la cause", "Forme aiguë : **corticoïdes topiques** ou **antihistaminiques**", "Récidives liées à l'herpès : **aciclovir 400 mg 2 fois par jour pendant 6 mois** (à confirmer avec la prescription)", "Zovirax® = aciclovir"], "stage": ["Pathologie de dermatologie rencontrée en salle 51"], "retenir": ["Lésions en cible à 3 zones", "Cause surtout infectieuse (HSV-1, Mycoplasma)", "Ne pas confondre avec Stevens-Johnson (bulles étendues)"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Impétigo", "d": {"id": "p2-imptigo", "titre": "Impétigo", "groupe": "Peau", "bref": "Infection cutanée contagieuse des couches superficielles de l'épiderme, due au streptocoque A ou au staphylocoque doré.", "signes": ["Trois formes : **non bulleux**, **bulleux**, **ecthyma**", "**Non bulleux** : vésicules ou pustules qui se rompent, **croûte jaune miel** sur base rouge", "Non bulleux : adénopathie régionale légère, pas de fièvre", "**Bulleux** : bulles flasques à contenu clair ou jaune, sans croûte jaune miel ; fièvre plus fréquente", "**Ecthyma** : ulcération profonde « en coup de poinçon », bords violacés"], "alerte": ["**Glomérulonéphrite** possible : atteinte rénale 7 à 14 jours après l'infection", "**SARM communautaire** en augmentation : faire une culture si suspecté"], "causes": ["Streptocoque A ou staphylocoque doré : S. aureus 80 %, strepto A 10 %, association 10 %", "Impétigo bulleux : presque toujours S. aureus", "Contagion par contact ; la rupture de la barrière cutanée est la porte d'entrée", "Facteurs de risque : malnutrition, immunodépression, crèche, mauvaise hygiène, diabète, varicelle"], "complications": ["**Glomérulonéphrite** (environ 5 %)", "Arthrite septique, sepsis", "Scarlatine", "Syndrome d'échaudure staphylococcique", "Ecthyma"], "examens": ["Diagnostic **clinique**, pas de sérologie", "Culture pour confirmer ou si SARM suspecté"], "traitement": ["1re intention : antiseptique + antibiotique local (sauf si forme sévère)", "Formes localisées non bulleuses : retirer les croûtes à l'eau et au savon, puis **mupirocine**, **rétapamuline** ou **acide fusidique** local", "Voie orale : bêtalactamines résistantes aux bêtalactamases (céphalosporines, amoxicilline-clavulanate, dicloxacilline)", "Si SARM : **clindamycine** ou **doxycycline**", "Correspondances : Augmentin® = amoxiclav ; Dalacin® = clindamycine", "Évolution : guérison en 14 à 21 jours sans traitement, environ 10 jours avec"], "stage": ["Pathologie rencontrée en salle 51", "**Hygiène des mains** et du linge", "**Éviction** 24 à 48 h après le début des antibiotiques"], "retenir": ["Croûte **jaune miel** = impétigo non bulleux", "Contagieux : hygiène des mains, linge, éviction 24 à 48 h sous ATB", "Complication rénale : **glomérulonéphrite**", "Diagnostic clinique ; culture si SARM suspecté"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Gale", "d": {"id": "p2-gale", "titre": "Gale", "groupe": "Peau", "bref": "Infestation cutanée très contagieuse par l'acarien Sarcoptes scabiei var. hominis.", "signes": ["**Prurit surtout nocturne**", "Lésions papulo-vésiculeuses, parfois nodules", "**Sillons** : courtes lignes blanches ondulées, avec vésicule ou érosion au bout", "Nourrisson : cuir chevelu, visage, paumes et plantes possibles"], "alerte": ["⚠ Lavage du linge à **60 °C** ou **75 °C** : valeur à confirmer avec le service", "⚠ Incubation de **4 à 6 semaines** ou **4 à 10 semaines** : valeur à confirmer avec le service", "⚠ Dose d'ivermectine : à confirmer avec la prescription"], "causes": ["Parasite obligatoire de la peau humaine ; la femelle pond 2 à 4 œufs par jour", "Contact **prolongé et rapproché** entre personnes (peau à peau 10 à 15 min) ; transmission par tissus, literie ou objets rare", "L'acarien survit 48 à 72 h hors de la peau", "Incubation à la 1re infestation : 4 à 6 semaines (ou 4 à 10) ; en cas de réinfestation : quelques heures à quelques jours", "Hypersensibilité retardée de type IV"], "complications": ["Surinfection bactérienne (impétigo, cellulite)", "Glomérulonéphrite post-streptococcique"], "examens": ["Diagnostic clinique", "**Dermatoscope** (signe du « jet »)", "Grattage cutané : peu sensible"], "traitement": ["**Traiter toute la famille** et tous les contacts proches en même temps", "Zalvor à J0 et J10 + traitement du linge, ou ivermectine per os", "**Perméthrine 5 %** crème : 1 fois par semaine pendant 2 semaines", "Alternative : **ivermectine** orale 200 µg/kg, répétée après 14 jours (dose à confirmer avec la prescription)", "Linge : laver à **60 °C** (ou machine à au moins **75 °C**)", "Sinon acaricide (type A-PAR ou BAYGON VERT), si possible 2 h en sachet fermé"], "stage": ["Pathologie rencontrée en salle 51", "Suivre le protocole du service pour le linge"], "retenir": ["Prurit **nocturne** + sillons", "Traiter **toute la famille** en même temps", "Perméthrine 5 % : 1 fois par semaine, 2 semaines", "Linge : 60 °C ou 75 °C, selon le protocole du service"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Eczéma (dermatite atopique)", "d": {"id": "p2-eczma-dermatite-atopique", "titre": "Eczéma (dermatite atopique)", "groupe": "Peau", "bref": "Maladie **inflammatoire chronique** de la peau, par poussées, avec démangeaisons ; prédisposition génétique.", "signes": ["Localisation : plis, convexité du visage et des membres, cuir chevelu", "Lésions sèches, érythémato-papuleuses, squameuses", "Lésions de grattage"], "alerte": [], "causes": ["Anomalie de la **barrière cutanée**", "Facteurs déclenchants : stress, infection, changement de température, irritants"], "complications": ["**Surinfection**"], "examens": [], "traitement": ["Prévention : hydratation quotidienne par **émollients**", "Symptomatique : **corticoïdes topiques**, antihistaminique (« traiter vite et bien »)"], "stage": ["Soins à l'eau tiède, huile lavante ou savon neutre", "Éviter lainages et parfums", "Éducation : émollients tous les jours"], "retenir": ["Touche environ 1 enfant sur 4 ; 3 sur 4 guéris à 5 ans", "Émollients quotidiens", "Corticoïdes topiques : traiter vite et bien"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Urticaire", "d": {"id": "p2-urticaire", "titre": "Urticaire", "groupe": "Peau", "bref": "Éruption inflammatoire **prurigineuse** avec œdèmes dermiques.", "signes": ["Plaques ou papules érythémateuses, **mobiles**, aux contours nets", "Démangeaisons"], "alerte": ["Détresse respiratoire, **œdème de Quincke**"], "causes": ["Physique, contact, alimentaire, médicamenteuse, infectieuse, idiopathique"], "complications": ["Détresse respiratoire", "**Œdème de Quincke**"], "examens": [], "traitement": ["Antihistaminiques", "Corticoïdes", "**Adrénaline**"], "stage": [], "retenir": ["Plaques prurigineuses mobiles", "Complication : œdème de Quincke", "Traitement : antihistaminiques, corticoïdes, adrénaline"]}}, {"k": "patho", "part": "patho", "chap": "Pathologies : Peau", "title": "Dermite du siège", "d": {"id": "p2-dermite-du-sige", "titre": "Dermite du siège", "groupe": "Peau", "bref": "Atteinte cutanée de la région du siège, dont la **première cause est l'irritation**.", "si , étiqueter", "Asepsie", "Déballer le site avant toute injection IV", "Désinfecter le site d'injection", "Rincer au LP (compatibilité et perméabilité)", "Injecter selon la modalité prévue", "Rincer après (IVD, IVB, pousse-seringue)", "Cocher le soin, noter les observations"], "vigilance": ["Rinçage après : sauf éventuellement chez les enfants en restriction hydrique", "IVD : produit dilué possible pour ménager les veines (ex. **2 ml** de produit dans **5 ou 10 ml** de LP)", "IVB sans protocole : diluer dans **20 ml** avant 18 mois (sauf nouveau-né), **50 ml** après 18 mois, à adapter", "Burette vide : rincer avec au moins l'espace mort (**20 ml**), au même débit", "Durée de l'IVB = administration + rinçage", "Tenir compte de l'espace mort", "Certains produits ne s'injectent pas en IVD ; certains doivent couler en temps donné ; incompatibilités possibles", "Suivre le médecin, les protocoles de l'unité, les recommandations pharmaceutiques", "Aucune aiguille en chambre ; maximum **3 soignants** en salle de soins", "Interdit sans la surveillance de l'infirmier de référence"], "enfant": ["Hyperhydratation orale ou IV pour diminuer la toxicité de certains antibiotiques (mucoviscidose)"], "surveillance": ["Surveiller l'enfant pendant et après l'administration", "Site : rougeur, douleur, chaleur", "Certains antibiotiques toxiques (ex. mucoviscidose) : dosages nécessaires", "Dose/poids à connaître : Dafalgan®/paracétamol, Nurofen®/ibuprofène"], "alerte": ["Antibiothérapie IV : méningite ; mucoviscidose (Glazidim®, Obracin, Meronem®)", "Fièvre du nourrisson jusqu'à 1 mois (un pic **T° ≥ 38 °C**) : hospitalisation **48 h**, triple ATB (Clamoxyl®, Céfotaxim®, Amukin®) jusqu'aux cultures", "Augmentin IV : plusieurs protocoles existent (4) ; à vérifier avec la prescription / le service"], "retenir": ["IVD, IVB ou pousse-seringue : rincer avant et après", "Espace mort : burette **20 ml**", "Déballer le site avant toute injection", "Jamais sans l'infirmier de référence"]}}, {"k": " groupe": "Voies d'administration", "but": "Donner un médicament à absorption lente et régulière dans le tissu adipeux peu vascularisé.", "materiel": ["Aiguille **25 G × 16 mm** ou **27 G × 13 mm**", "Antalgie : crème anesthésique locale, pansement occlusif transparent, glace **5 min** avant si produit douloureux", "Au service S 51 : Emla®, MEOPA, glucosé 30 %"], "etapes": ["Identitovigilance : bracelet + questions ouvertes", "Hygiène des mains et asepsie rigoureuse", "Choisir le site (voir Vigilance)", "Pincer la peau", "Piquer à **45 degrés**", "Relâcher le pli avant d'injecter", "Injecter lentement", "Attendre **10 secondes** avant de retirer l'aiguille", "Appuyer **2 à 5 minutes** pour limiter l'ecchymose"], "vigilance": ["Sites : paroi abdominale antérieure (préférée après **2 ans**, à plus de **5 cm** de l'ombilic)", "Sites : face antérieure de la cuisse (préférée avant **2 ans**)", "Sites : face externe du bras (dès **12 mois**)", "Éviter les zones œdémateuses, ecchymotiques, infectées, lésées, les reliefs osseux, les plis", "Volume : **1,5 ml** par site en général (jusqu'à **3 ml** bien toléré à l'abdomen)", "Aucune aiguille en chambre ; maximum **3 soignants** en salle de soins", "Interdit sans la surveillance de l'infirmier de référence"], "enfant": ["Emla, MEOPA, glucosé **30 %**", "Distraction, jeux, chansons, vidéos, doudou/tétine, histoires", "Présence des parents"], "surveillance": ["Inspecter le site chaque jour et avant chaque administration", "Perfusion continue SC : au moins **toutes les 4 heures**", "Évaluer la douleur ; réévaluer **30 min** après analgésie"], "alerte": ["Complications : infection, inconfort, ecchymose, saignement, fuite, rougeur, inflammation, douleur"], "retenir": ["Piquer à **45°** dans un pli pincé", "Attendre **10 s** avant de retirer", "Volume **1,5 ml** par site", "Abdomen après 2 ans, cuisse avant 2 ans"]}}, {"k": "proc", "part": "proc", "chap": "Soins : Voies d'administration", "title": "Injection intramusculaire (IM)", "d": {"id": "p4-injection-intramusculaire-im", "titre": "Injection intramusculaire (IM)", "groupe": "Voies d'administration", "but": "Donner un produit dans le muscle quand la voie veineuse est impossible ou pour une injection unique (vaccin, antibiotique).", "materiel": ["Seringue de **1 ml** si quantité < 1 ml", "Aiguille **25 G 1''** : nouveau-né et nourrisson jusqu'à 3 mois environ", "Aiguille **23 G 1''** : petit enfant", "Aiguille **22 G 1½''** : plus grand", "Tampon sec", "Antalgie au service S 51 : MEOPA, Emla®, glucosé 30 %"], "etapes": ["Préparer l'enfant selon l'âge : expliquer sans mentir", "Lui dire qu'il peut pleurer mais doit tâcher de ne pas bouger", "Le laisser choisir le côté, le prévenir du moment de la piqûre", "Être **deux** : l'un tient et distrait, l'autre pique", "Asepsie", "Avant la marche : face antérieure du quadriceps, ligne médiane à mi-hauteur", "Pincer la cuisse pour faire saillir le muscle, piquer perpendiculairement", "Après la marche : muscle dorso-fessier, cadran supéro-externe", "Piquer franchement, sans élan, par un mouvement du poignet", "Contrôle sanguin avant d'injecter (voir Alerte)", "Injecter", "Retirer l'aiguille en repoussant la peau avec un tampon sec", "Masser doucement", "Consoler, féliciter, réinstaller l'enfant"], "vigilance": ["Voie peu utilisée : traumatisante et douloureuse", "Risque nerveux : nerf **sciatique** (paresthésie, voire paralysie), muscle peu volumineux", "Dorso-fessier **contre-indiqué** si l'enfant ne marche pas depuis 1 an ou plus", "Volume max : **1 ml** grand nourrisson et jeune enfant ; **0,5 ml** nouveau-né et petit", "Risque de produit dans le sous-cutané si la couche adipeuse est épaisse", "Aucune aiguille en chambre, matériel jamais à portée de l'enfant", "Maximum **3 soignants** en salle de soins", "Interdit sans la surveillance de l'infirmier référent"], "enfant": ["Distraction, jeux, chansons, vidéos, doudou/tétine, histoires, présence des parents", "Participer par la distraction, la préparation du matériel et de l'enfant", "Communication avec l'enfant et les parents importante", "Douleur : EVENDOL (hétéro-évaluation **0 à 4-6 ans**), EVA ou échelle numérique", "Réévaluer la douleur **30 min** après analgésie"], "surveillance": ["Effets attendus et effets indésirables possibles", "Garder l'enfant **15 à 20 min** sur place pour repérer une réaction"], "alerte": ["⚠ Contrôle sanguin avant d'injecter, ou ne pas aspirer car plus douloureux : à confirmer avec la prescription / le service", "⚠ Volumes max : 1 ml grand nourrisson/jeune enfant et 0,5 ml nouveau-né/petit, ou jusqu'à 1 ml nouveau-né et 3 ml enfant (vastus lateralis) : à confirmer avec la prescription / le service", "⚠ Sites habituels : quadriceps avant la marche, dorso-fessier après. Autre option : vastus lateralis avant 18 mois ; vastus lateralis ou deltoïde de 18 mois à 3 ans ; deltoïde de 3 à 11 ans ; ventro-fessier possible après 7 mois si formé. À confirmer avec la prescription / le service"], "retenir": ["IM peu utilisée en pédiatrie : voie veineuse impossible ou injection unique", "Avant la marche : quadriceps ; après : dorso-fessier supéro-externe", "Toujours à deux, volume max **1 ml**", "Risque : nerf sciatique"]}}, {"k": "chapter", "part": "proc", "chap": "Soins : Perfusion et cathéter", "title": "Soins : Perfusion et cathéter", "items": [["Pose de cathéter périphérique (KTP)", "Poser un accès veineux fin pour réhydrater, perfuser et donner des médicaments IV."], ["Placement de perfusion : burette ou pousse-seringue", "Réhydrater, alimenter, rééquilibrer l'ionogramme, rétablir le volume circulant et administrer des médicaments."]], "sub": "But, matériel, étapes, vigilance"}, {"k": "proc", "part": "proc", "chap": "Soins : Perfusion et cathéter", "title": "Pose de cathéter périphérique (KTP)", "d": {"id": "p4-pose-de-cathter-priphrique-ktp", "titre": "Pose de cathéter périphérique (KTP)", "groupe": "Perfusion et cathéter", "but": "Poser un accès veineux fin pour réhydrater, perfuser et donner des médicaments IV.", "materiel": ["Cathéter **22 G à 26 G** (prématuré, nourrisson)", "Désinfectant : alcool **70 %** ou chlorhexidine **2 %**", "Garrot, connecteur purgé au sérum physiologique", "Seringue de **10 ml** de NaCl 0,9 %", "Adhésif stérile + pansement transparent", "Attelle si nécessaire, bandage non serré", "Antalgie : **Emla**, **glucosé 30 %**, **MEOPA**"], "etapes": ["Vérifier l'identité : bracelet + questions ouvertes", "Envisager d'abord la voie orale ou une autre voie si tolérée", "Prévenir la douleur selon l'âge (voir Enfant)", "Hygiène des mains, asepsie rigoureuse", "Choisir le site (voir Vigilance)", "Désinfecter, laisser sécher **au moins 30 secondes**", "Insérer à **10 à 15 degrés**", "Après le reflux, avancer encore de **2 à 3 mm** dans l'axe de la veine", "Pousser le cathéter hors de l'aiguille", "Retirer le garrot avant de fixer", "Brancher le connecteur purgé et rincer : cela confirme le bon placement", "Fixer : adhésif sur l'embase, pansement transparent", "Garder visibles la pointe et la peau autour", "Poser une attelle sans serrer si besoin, puis cacher par un bandage non serré"], "vigilance": ["KTP adapté si traitement **< 7 jours** ; au-delà : midline, PICC ou voie centrale", "Sites : dos de la main non dominante, face palmaire de l'avant-bras, dos du pied, saphène interne", "Éviter les zones articulaires et le membre inférieur (plus d'échecs)", "Reflux parfois absent sur une petite veine avec un **24 G**", "Limite : **2 essais** par soignant, puis demander de l'aide", "Score DIVA **≥ 4** : plus de **50 %** d'échec au 1er essai", "Aucune aiguille en chambre, matériel jamais à portée de l'enfant", "Maximum **3 soignants** dans la salle de soins", "Interdit de préparer ou d'administrer sans l'infirmier de référence"], "enfant": ["Nourrisson **< 3 mois** : solution sucrée avec succion ou allaitement", "Plus grand : **Emla** (**60 minutes**), **MEOPA**, jeu, distraction", "Au service S 51 : Emla®, MEOPA, glucosé **30 %**", "Distraction, jeux, chansons, vidéos, doudou/tétine, histoires", "Présence des parents", "Bandage pour que l'enfant ne touche pas le cathéter"], "surveillance": ["Avant : identité, site, antalgie, état de l'enfant", "Pendant : le rinçage confirme le placement", "Après : rougeur, chaleur, gonflement, douleur (enfants craintifs !), pansement", "Perméabilité : injecter au moins **2 ml** de LP", "Déballer régulièrement le site ; **obligatoire** avant toute injection IV", "Refaire le pansement seulement s'il est décollé ou souillé", "Contrôle du site : **toutes les heures** (soins intensifs, médicaments à risque)", "Contrôle du site : **toutes les 4 heures** (perfusions simples)", "Contrôle du site : avant et après chaque perfusion intermittente", "Rinçage pulsé (poussée-pause) au NaCl 0,9 % prescrit, seringue **10 ml**", "Désinfecter l'embout **15 secondes**, laisser sécher", "Contrôler T°, pouls, respiration, TA, poids, diurèse, faciès, coloration, éveil", "Évaluer la douleur ; réévaluer **30 min** après antalgie"], "alerte": ["Retirer le KTP dès qu'il n'est plus nécessaire ou au 1er signe de complication", "**Phlébite** : gonflement, rougeur, chaleur, induration, pus, cordon veineux, douleur", "**Infiltration/extravasation** : douleur, gonflement, érythème, induration, phlyctènes, pâleur, cathéter qui dysfonctionne", "**Ponction artérielle** accidentelle : reflux rouge vif et pulsatile", "Autres complications : septicémie, choc, surcharge circulatoire, embolie gazeuse, allergie, embol du cathéter, infection du site", "Reflux : ne pas le rechercher (sauf voies centrales)"], "retenir": ["Cathéter fin (**22-26 G**), angle **10-15°**", "Max **2 essais** par soignant", "Site déballé et contrôlé régulièrement, **obligatoire** avant toute injection", "Retirer au 1er signe de complication"]}}, {"k": "proc", "part": "proc", "chap": "Soins : Perfusion et cathéter", "title": "Placement de perfusion : burette ou pousse-seringue", "d": {"id": "p4-placement-de-perfusion-burette-ou-pousse-seringue", "titre": "Placement de perfusion : burette ou pousse-seringue", "groupe": "Perfusion et cathéter", "but": "Réhydrater, alimenter, rééquilibrer l'ionogramme, rétablir le volume circulant et administrer des médicaments.", "materiel": ["Circuit de base : cathéter, bionecteur, prolongateur, robinet, trousse, poche", "Métrisette ou burette : réservoir gradué, connectable à une ou plusieurs perfusions", "Prolongateur : liberté de mouvement, calibres et longueurs variés pour réduire l'espace mort", "Robinet à 3 voies : piège à bulles et à microbes, à protéger de l'enfant", "**Pompe** pour toutes les perfusions"], "etapes": ["La **burette** prépare une quantité limitée de perfusion", "Elle permet d'adapter la composition (ions, mélange de soluté)", "Elle permet d'injecter un médicament dans une solution précise en un temps donné", "**Pousse-seringue** : médicament dilué dans un liquide compatible, injecté en un temps donné", "**Mini baxter** : même principe", "Tenir compte de l'espace mort du prolongateur (perdu ou rincé)", "Exemple : Léa, **20 kg**, paracétamol IV en **30 min** à **15 mg/kg** = **300 mg**, soit **30 ml** (flacon 500 mg/50 ml)", "Dose maximale de l'exemple : **4 par jour**"], "vigilance": ["La pompe garde le cathéter perméable et le débit précis", "Se méfier de tout ce qui perturbe le débit : coudure, cathéter bouché, pompe défectueuse", "Grande surveillance même avec une pompe", "Calculs de dosage à maîtriser", "Dose/poids à connaître : Dafalgan®/paracétamol et Nurofen®/ibuprofène", "Robinet : protéger pour que l'enfant ne le manipule pas", "Interdit de préparer ou d'administrer sans l'infirmier de référence"], "enfant": ["Soutien psychologique", "Exemple au service S 51 : hydratation IV si le SG est mal toléré car l'enfant est encombré (bronchiolite)"], "surveillance": ["Perfusion : débit, produit conforme à la prescription", "Circuit : pas de coudure, robinet bien orienté, clamps ouverts", "Circuit : réserve de produit, niveau dans la burette", "Feuille de surveillance pour les débits stricts", "Enfant : état général, réactions au produit, poids, bilan hydrique", "Contrôler T°, pouls, respiration, TA, poids, diurèse", "Diurèse normale : **≥ 2 ml/kg/h**", "Tour de salle : cathéter et point de ponction (rougeur, douleur, chaleur)", "Bilan hydrique à maîtriser (utilisé dans certaines pathologies)"], "alerte": ["Savoir répondre sur l'indication, le dosage et le débit, toujours sous la supervision de l'infirmier de référence"], "retenir": ["Toujours une pompe", "Surveiller le circuit : coudure, clamps, robinet", "Diurèse **≥ 2 ml/kg/h**", "Bilan hydrique maîtrisé"]}}, {"k": "chapter", "part": "proc", "chap": "Soins : Prélèvements", "title": "Soins : Prélèvements", "items": [["Prélèvements veineux : macro-méthode et micro-méthode", "Obtenir du sang pour des dosages à visée diagnostique ou pour surveiller l'efficacité du traitement."], ["Mise en place d'un urinocol", "Recueillir les urines d'un enfant sans maîtrise des sphincters (prélèvement ou diurèse)."]], "sub": "But, matériel, étapes, vigilance"}, {"k": "proc", "part": "proc", "chap": "Soins : Prélèvements", "title": "Prélèvements veineux : macro-méthode et micro-méthode", "d": {"id": "p4-prlvements-veineux-macro-mthode-et-micro-mthode", "titre": "Prélèvements veineux : macro-méthode et micro-méthode", "groupe": "Prélèvements", "but": "Obtenir du sang pour des dosages à visée diagnostique ou pour surveiller l'efficacité du traitement.", "materiel": ["Gants à usage unique", "Aiguille à ailettes + seringue ou Vacutainer", "Micro-tubes", "Seringue de 2, 5 ou 10 ml selon la taille de l'enfant", "Antalgie : **Emla**, **glucosé 30 %**, **MEOPA** (Kalinox)"], "etapes": ["Vérifier bracelet + identité par questions ouvertes", "Prévenir la douleur avant l'acte", "Hygiène et asepsie rigoureuses", "Choisir la technique : âge, capital veineux, type de prélèvement", "**Macro-méthode** : ponction veineuse (adaptée de l'adulte)", "**Micro-méthode** : ponction capillaire (pulpe du doigt ou talon)", "Sur KTP avec bionnecteur ou KTC : mêmes principes que chez l'adulte, seringue plus petite", "Étiqueter les tubes"], "vigilance": ["**Ne pas aspirer trop fort** : la veine se collabe ou éclate", "Sites veineux : dos de la main, pli du coude, parfois dessus du pied", "Aiguille ouverte possible (sang dans un tube ouvert), **sauf hémoculture**", "Aucune aiguille en chambre ; maximum **3 soignants** en salle de soins", "Interdit sans l'infirmier de référence ; ne faire que ce dont on est certain, avec son accord"], "enfant": ["Emla, glucosé **30 %**, MEOPA (Kalinox)", "Distraction, jeux, chansons, vidéos, doudou/tétine, histoires", "Présence des parents"], "surveillance": [], "alerte": ["Au service S 51 : priorité du côté assigné = biologie sanguine ; hémoculture si **T° > 38 °C** et si nécessaire", "Détail complet (indications, interprétation, complications) : voir la fiche prélèvements sanguins"], "retenir": ["Macro = veine ; micro = capillaire", "Aspirer doucement, seringue adaptée", "Antalgie avant l'acte", "Aiguille ouverte impossible pour une hémoculture"]}}, {"k": "proc", "part": "proc", "chap": "Soins : Prélèvements", "title": "Mise en place d'un urinocol", "d": {"id": "p4-mise-en-place-d-un-urinocol", "titre": "Mise en place d'un urinocol", "groupe": "Prélèvements", "but": "Recueillir les urines d'un enfant sans maîtrise des sphincters (prélèvement ou diurèse).", "materiel": ["Protection propre", "Solution désinfectante aqueuse (**Hibidil**)", "2 sets de 5 tampons", "Bassin réniforme", "Flacon", "Gants", "Urinocol (poche adhésive)"], "etapes": ["Hygiène des mains, rigueur en asepsie", "Se faire aider par la maman ou une autre personne", "Installer l'enfant en décubitus dorsal", "Toilette intime si le soin n'est pas fait au moment du bain, bien sécher", "Désinfection large", "Fille : pubis, grandes lèvres, petites lèvres, méat, entrée du vagin", "Garçon : pubis, bourses, verge, sillon, gland", "Laisser sécher", "Coller l'urinocol d'un mouvement ascendant, sans pli", "Langer pour permettre l'écoulement", "Recueil : décoller de haut en bas en soutenant la peau", "Verser l'urine d'un mouvement ferme dans le récipient", "Étiqueter et envoyer au laboratoire"], "vigilance": ["Pose **seulement si la peau est intacte**", "Diurèse : urinocol **pas plus de 24 h**", "Sinon : peser les langes si l'état cutané ne permet pas l'urinocol", "Bilan hydrique à maîtriser (utilisé dans certaines pathologies)"], "enfant": ["Aide de la maman pour tenir l'enfant", "Douleur à l'ablation de l'adhésif : **glucosé 30 %** (voir fiche glucose 30 %)"], "surveillance": ["Avant : état de la peau", "Après : le change de lange fait partie du tour de salle", "Encoder les paramètres et observations dans le dossier informatisé", "Au service S 51 : diurèse normale **≥ 2 ml/kg/h**"], "alerte": [], "retenir": ["Peau intacte obligatoire", "Désinfection large, bien sécher, coller sans pli", "Diurèse : max 24 h", "Diurèse normale ≥ 2 ml/kg/h (au service S 51)"]}}, {"k": "chapter", "part": "proc", "chap": "Soins : Soins du nez et respiratoire", "title": "Soins : Soins du nez et respiratoire", "items": [["Soin du nez", "Dégager les narines des sécrétions visibles pour le confort et la respiration de l'enfant."], ["Aérosolthérapie", "Administrer des bronchodilatateurs par inhalation pour dégager les voies respiratoires (crise : « bronchodilater, et vite »)."]], "sub": "But, matériel, étapes, vigilance"}, {"k": "proc", "part": "proc", "chap": "Soins : Soins du nez et respiratoire", "title": "Soin du nez", "d": {"id": "p4-soin-du-nez", "titre": "Soin du nez", "groupe": "Soins du nez et respiratoire", "but": "Dégager les narines des sécrétions visibles pour le confort et la respiration de l'enfant.", "materiel": ["Sérum physiologique", "Coton-tige à bâtonnet souple", "Mouche-bébé ou seringue de sérum physiologique", "Poire"], "etapes": ["Instiller quelques gouttes de physiologique dans chaque narine", "Attendre que les sécrétions ramollissent osol activé par la respiration", "Chambre : un seul puff à la fois, observer **4 respirations**", "Secouer l'aérosol entre les doses", "Masque si l'enfant est trop essoufflé ou ne coordonne pas ; embout dès que possible", "Nébuliseur : seulement si aucun autre système n'est possible", "Traitement de fond par puffs après la phase aiguë : chambre type Optichamber", "Position proclive à **30°** ; kiné respiratoire parfois nécessaire"], "vigilance": ["**Chambre** : dépôt pulmonaire **20 à 40 %**, pas de problème de coordination, utilisable en crise et à tout âge", "**Nébuliseur** : dépôt pulmonaire **2 à 10 %**, dépôt oropharyngé élevé, encombrant, long, risque de colonisation", "Aérosol activé par la respiration : **pas avant 6 ans**", "Poudre sèche : pas avant 6 ans, dépend du débit, difficile si dyspnée", "O2 par lunettes : **max 3 l/min** (irritant pour les muqueuses nasales)", "Toxicité du salbutamol : agitation, tachycardie, tachypnée, tremblement"], "enfant": ["Aider à l'utilisation correcte : la plupart des problèmes viennent de la coordination, de la coopération, du débit"], "surveillance": ["Évaluer : conscience, dyspnée, sibilants, tirage, FR, FC, saturation, score de Wood modifié", "Saturation : **> 95 %** légère ; **90 à 95 %** modérée ; **< 90 %** sévère", "Crise d'asthme : électrodes + câble à saturation, prendre saturation, FR, pulsation", "Détresse : tirage sus-sternal, intercostal, sous-costal", "Détresse : battements des ailes du nez, wheezing, grunting", "Détresse : coloration (surtout péri-buccale), stridor (bruit inspiratoire)", "Présenter les paramètres à l'infirmier référent"], "alerte": ["⚠ Seuil d'O2 : **< 92-93 %** ou **< 92 %** (au service S 51, objectif ≥ 92 %, sauf certaines pathologies) : suivre la prescription et le protocole du service", "Signaler toute saturation **< 92 %**", "Signes de danger : agitation ou conscience altérée, épuisement, cyanose, entrée d'air quasi nulle"], "retenir": ["Chambre d'inhalation = système de choix (moins d    h+= '<div class="foot"><span>Page '+(cur+1)+' sur '+PAGES.length+'</span></div>';
 } else {
   var inner=p.k==='patho'?pagePatho(p):p.k==='proc'?pageProc(p):p.k==='drug'?pageDrug(p):p.k==='table'?pageTable(p):p.k==='list'?pageList(p):p.k==='serv'?pageServ(p):pageChapter(p,cur);
   h=band(p,cur)+'<div class="body">'+inner+'</div>'+(p.k==='chapter'?'<div class="foot"><span>Page '+(cur+1)+' sur '+PAGES.length+'</span></div>':foot(p,cur));
 }
 var s=document.getElementById('sheet');s.className=cls;s.innerHTML=h;
 document.getElementById('brand').innerHTML=(p.chap?esc(p.chap):'Syllabus de stage pédiatrie')+'<small>'+(p.k==='chapter'||!p.title||p.k==='cover'||p.k==='toc'||p.k==='howto'?'Service S 51':esc(plain(p.title)))+'</small>';
 document.getElementById('pg').textContent=(cur+1)+' / '+PAGES.length;
 document.getElementById('bPrev').disabled=cur===0;document.getElementById('bNext').disabled=cur===PAGES.length-1;
 var bd=document.getElementById('bDone');if(bd)bd.onclick=function(){if(done[cur])delete done[cur];else done[cur]=1;saveDone();bd.setAttribute('aria-pressed',!!done[cur]);bd.textContent=done[cur]?'✓ Page acquise':'Marquer comme acquise'};
 window.scrollTo(0,0);
}
function go(i,noHash){i=Math.max(0,Math.min(PAGES.length-1,i));cur=i;if(!noHash){try{history.replaceState(null,'','#p'+i)}catch(e){location.hash='p'+i}}render()}
function fromHash(){var m=/^#p(\d+)$/.exec(location.hash);return m?parseInt(m[1],10):0}
window.addEventListener('hashchange',function(){go(fromHash(),true)});
document.getElementById('bPrev').onclick=function(){go(cur-1)};
document.getElementById('bNext').onclick=function(){go(cur+1)};
document.getElementById('bToc').onclick=function(){go(2)};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
var tx=0,ty=0,tt=null;
document.getElementById('sheet').addEventListener('touchstart',function(e){tt=e.target;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.getElementById('sheet').addEventListener('touchend',function(e){if(tt&&tt.closest&&tt.closest('.tw'))return;var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dy)<45){go(cur+(dx<0?1:-1))}},{passive:true});
/* recherche */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
var IDX=PAGES.map(function(p){return norm(JSON.stringify(p))});
document.getElementById('bSearch').onclick=function(){
 var ov=document.createElement('div');ov.className='ov';
 ov.innerHTML='<div class="pan"><input id="q" type="search" placeholder="Pathologie, soin, médicament, mot-clé…" autocomplete="off"><div class="res" id="res"></div><p><button class="ib" id="xs" type="button">Fermer</button></p></div>';
 document.body.appendChild(ov);var q=document.getElementById('q'),res=document.getElementById('res');q.focus();
 function close(){ov.remove()}
 document.getElementById('xs').onclick=close;ov.addEventListener('click',function(e){if(e.target===ov)close()});
 q.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 q.addEventListener('input',function(){var t=norm(q.value.trim());if(t.length<2){res.innerHTML='';return}
  var out=[];PAGES.forEach(function(p,i){if(p.k==='cover'||p.k==='howto'||p.k==='toc'||p.k==='chapter')return;var inT=norm(p.title).indexOf(t)>=0,inB=IDX[i].indexOf(t)>=0;if(inT||inB)out.push([inT?0:1,i])});
  out.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
  res.innerHTML=out.slice(0,40).map(function(o){var p=PAGES[o[1]];return '<a href="#p'+o[1]+'"><strong>'+esc(plain(p.title))+'</strong><small>'+esc(p.chap)+' · p. '+(o[1]+1)+(o[0]?' · cité dans la page':'')+'</small></a>'}).join('')||'<p>Aucun résultat.</p>';
  Array.prototype.forEach.call(res.querySelectorAll('a'),function(a){a.addEventListener('click',close)});});
};
go(fromHash(),true);
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
